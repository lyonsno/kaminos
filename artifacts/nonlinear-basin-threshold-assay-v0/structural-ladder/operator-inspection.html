<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authored Envelope Structural Revision Ladder</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #181c1b; color: #eef2ef; }
    main { max-width: 1500px; margin: 0 auto; padding: 28px; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
    p { margin: 0 0 24px; color: #aeb8b2; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    figure { margin: 0; background: #202524; border: 1px solid #343b38; border-radius: 6px; overflow: hidden; }
    img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: #1d2220; }
    figcaption { padding: 12px 14px 14px; font-weight: 650; }
    small { display: block; margin-top: 3px; color: #9ca7a1; font-weight: 450; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Operator-authored structural revision ladder</h1>
    <p>Historical source revisions, same object identity and inspection renderer. Provenance only: this sequence is not admitted as a monotonic quality axis.</p>
    <section class="grid">
      <figure><img src="revision-018/lod-00-r1.00.png"><figcaption>Revision 018<small>921 evaluated vertices</small></figcaption></figure>
      <figure><img src="revision-022/lod-00-r1.00.png"><figcaption>Revision 022<small>933 evaluated vertices</small></figcaption></figure>
      <figure><img src="revision-023/lod-00-r1.00.png"><figcaption>Revision 023<small>941 evaluated vertices</small></figcaption></figure>
      <figure><img src="revision-024/lod-00-r1.00.png"><figcaption>Revision 024<small>1,069 evaluated vertices</small></figcaption></figure>
      <figure><img src="revision-025/lod-00-r1.00.png"><figcaption>Revision 025<small>989 evaluated vertices</small></figcaption></figure>
    </section>
  </main>
</body>
</html>
