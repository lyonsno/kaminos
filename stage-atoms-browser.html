<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Material Circuit</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101216;
      color: #f5f2e9;
      letter-spacing: 0;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101216; }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid #77e6d5; outline-offset: 3px; }
    #stage-atoms-shell { position: relative; width: 100%; height: 100%; min-height: 540px; overflow: hidden; }
    #stage-atoms-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .stage-header {
      position: absolute;
      inset: 0 0 auto 0;
      height: 72px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      border-bottom: 1px solid rgba(245, 242, 233, 0.16);
      background: rgba(16, 18, 22, 0.92);
      z-index: 3;
    }
    .stage-title { min-width: 210px; }
    .stage-title h1 { margin: 0; font-family: Georgia, serif; font-size: 25px; font-weight: 600; line-height: 1; }
    .stage-title p { margin: 7px 0 0; color: #a7acae; font-size: 10px; text-transform: uppercase; }
    .authority-strip { display: flex; align-items: center; gap: 18px; min-width: 0; overflow: hidden; }
    .authority { display: grid; gap: 4px; min-width: 110px; }
    .authority span { color: #777e82; font-size: 9px; text-transform: uppercase; }
    .authority strong { color: #d8dcda; font-size: 11px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .authority[data-state="verified"] strong { color: #77e6d5; }
    .authority[data-state="failed"] strong { color: #ff6e61; }
    .stage-source {
      margin-left: auto;
      max-width: 340px;
      text-align: right;
      color: #b7bcbb;
      font-size: 11px;
      line-height: 1.35;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stage-source:hover { color: #fff0a8; }
    .instrument-rail {
      position: absolute;
      top: 72px;
      right: 0;
      bottom: 92px;
      width: 276px;
      padding: 24px 22px;
      border-left: 1px solid rgba(245, 242, 233, 0.14);
      background: rgba(17, 20, 23, 0.88);
      z-index: 2;
      overflow: auto;
    }
    .rail-section { padding: 0 0 22px; margin: 0 0 22px; border-bottom: 1px solid rgba(245, 242, 233, 0.12); }
    .rail-section:last-child { border-bottom: 0; }
    .rail-kicker { margin: 0 0 14px; color: #8e9697; font-size: 9px; text-transform: uppercase; }
    .rail-heading { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; }
    .rail-heading .rail-kicker { margin: 0; }
    .icon-button {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(245, 242, 233, 0.24);
      border-radius: 4px;
      background: transparent;
      color: #c9cecc;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }
    .handle { display: grid; grid-template-columns: 1fr 42px; gap: 7px 10px; align-items: center; margin: 0 0 18px; }
    .handle label { color: #e4e0d7; font-size: 12px; }
    .handle output { color: #fff0a8; font-variant-numeric: tabular-nums; font-size: 11px; text-align: right; }
    .handle input { grid-column: 1 / -1; width: 100%; accent-color: #ff806e; }
    .history-control { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 4px; border: 1px solid rgba(245, 242, 233, 0.22); border-radius: 4px; overflow: hidden; }
    .history-control button { height: 31px; border: 0; background: #1b2023; color: #b9c0bf; cursor: pointer; font-size: 10px; text-transform: uppercase; }
    .history-control button + button { border-left: 1px solid rgba(245, 242, 233, 0.18); }
    .history-control button[data-active="true"] { background: #77e6d5; color: #101216; }
    .clock-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin: 0 0 11px; font-size: 10px; }
    .clock-row span { color: #7d8587; text-transform: uppercase; }
    .clock-row strong { color: #d5d9d7; font-variant-numeric: tabular-nums; font-weight: 600; }
    .feature-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .feature { border-left: 2px solid #454b4c; padding-left: 9px; }
    .feature:nth-child(1) { border-color: #ff806e; }
    .feature:nth-child(2) { border-color: #fff0a8; }
    .feature:nth-child(3) { border-color: #77e6d5; }
    .feature:nth-child(4) { border-color: #9faf63; }
    .feature span { display: block; color: #777f81; font-size: 8px; text-transform: uppercase; }
    .feature strong { display: block; margin-top: 4px; font-size: 15px; font-variant-numeric: tabular-nums; }
    .transport {
      position: absolute;
      inset: auto 0 0 0;
      height: 92px;
      display: grid;
      grid-template-columns: 48px minmax(120px, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 0 24px;
      border-top: 1px solid rgba(245, 242, 233, 0.16);
      background: rgba(16, 18, 22, 0.94);
      z-index: 4;
    }
    .transport button {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(245, 242, 233, 0.32);
      border-radius: 50%;
      background: #f4ede0;
      color: #121519;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }
    .transport button:disabled { opacity: 0.35; cursor: not-allowed; }
    .seek-wrap { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 12px; align-items: center; }
    .seek-wrap span { color: #a8adae; font-size: 10px; font-variant-numeric: tabular-nums; }
    #stage-atoms-seek { width: 100%; accent-color: #77e6d5; }
    .transport-state { display: flex; align-items: center; gap: 10px; color: #969d9d; font-size: 10px; text-transform: uppercase; }
    .transport-state i { width: 7px; height: 7px; border-radius: 50%; background: #697071; }
    .transport-state[data-state="live"] i { background: #77e6d5; box-shadow: 0 0 14px rgba(119, 230, 213, 0.8); }
    .transport-state[data-state="failed"] i { background: #ff6e61; }
    .failure {
      position: absolute;
      left: 24px;
      bottom: 116px;
      max-width: min(620px, calc(100vw - 340px));
      padding: 14px 16px;
      border-left: 3px solid #ff6e61;
      background: rgba(35, 18, 20, 0.96);
      color: #ffd5cf;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      z-index: 5;
    }
    .failure[hidden] { display: none; }
    @media (max-width: 820px) {
      #stage-atoms-shell { min-height: 620px; }
      .stage-header { height: 98px; padding: 0 16px; align-items: flex-start; padding-top: 16px; }
      .stage-title { min-width: 145px; }
      .stage-title h1 { font-size: 21px; }
      .authority-strip { flex-wrap: wrap; gap: 8px 14px; }
      .authority { min-width: 80px; }
      .stage-source { display: none; }
      .instrument-rail { top: auto; right: 0; bottom: 84px; left: 0; width: 100%; height: 210px; display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; padding: 14px 16px; border-left: 0; border-top: 1px solid rgba(245, 242, 233, 0.14); }
      .rail-section { border-bottom: 0; border-right: 1px solid rgba(245, 242, 233, 0.12); padding: 0 12px 0 0; margin: 0; overflow: hidden; }
      .rail-section:last-child { border-right: 0; }
      .handle { gap: 1px 6px; margin-bottom: 4px; }
      .handle input { height: 12px; }
      .rail-heading { margin-bottom: 6px; }
      .icon-button { width: 24px; height: 24px; }
      .history-control button { height: 25px; }
      .feature-grid { gap: 7px; }
      .feature strong { font-size: 12px; }
      .transport { height: 84px; grid-template-columns: 42px 1fr; padding: 0 16px; gap: 12px; }
      .transport-state { display: none; }
      .failure { left: 16px; bottom: 310px; max-width: calc(100vw - 32px); }
    }
  </style>
</head>
<body>
  <main id="stage-atoms-shell">
    <canvas id="stage-atoms-canvas" aria-label="Material soundstage"></canvas>
    <header class="stage-header">
      <div class="stage-title"><h1>Material Circuit</h1><p>Pulp graph / retained material</p></div>
      <div class="authority-strip">
        <div class="authority" data-stage-source-authority data-state="pending"><span>Source</span><strong>checking</strong></div>
        <div class="authority" data-stage-route-authority data-state="pending"><span>Route</span><strong>checking</strong></div>
        <div class="authority" data-stage-fallback-authority data-state="pending"><span>Fallback</span><strong>checking</strong></div>
      </div>
      <a class="stage-source" id="stage-atoms-source-link" target="_blank" rel="noreferrer">Coruscate / Geppetto V4</a>
    </header>
    <aside class="instrument-rail">
      <section class="rail-section">
        <div class="rail-heading"><p class="rail-kicker">Material handles</p><button class="icon-button" id="stage-atoms-reset" type="button" title="Clear retained material state" aria-label="Clear retained material state">&#8634;</button></div>
        <div class="handle"><label for="stage-atoms-coupling">Coupling</label><output id="stage-atoms-coupling-value">1.00</output><input id="stage-atoms-coupling" type="range" min="0" max="2" step="0.01" value="1"></div>
        <div class="handle"><label for="stage-atoms-memory">Memory</label><output id="stage-atoms-memory-value">1.00</output><input id="stage-atoms-memory" type="range" min="0" max="2" step="0.01" value="1"></div>
        <div class="handle"><label for="stage-atoms-depth">Stage depth</label><output id="stage-atoms-depth-value">1.00</output><input id="stage-atoms-depth" type="range" min="0" max="1.5" step="0.01" value="1"></div>
        <div class="history-control" aria-label="Gesture history imprint"><button id="stage-atoms-history-a" type="button" title="Imprint coupling then memory">Path A</button><button id="stage-atoms-history-b" type="button" title="Imprint memory then coupling">Path B</button></div>
      </section>
      <section class="rail-section">
        <p class="rail-kicker">Clock boundary</p>
        <div class="clock-row"><span>Audio</span><strong id="stage-atoms-audio-clock">0.000 s</strong></div>
        <div class="clock-row"><span>Visual</span><strong id="stage-atoms-visual-clock">0.000 s</strong></div>
        <div class="clock-row"><span>Feature</span><strong id="stage-atoms-feature-frame">0 / 0</strong></div>
      </section>
      <section class="rail-section">
        <p class="rail-kicker">Signal / material</p>
        <div class="feature-grid">
          <div class="feature"><span>Energy</span><strong id="feature-energy">0.00</strong></div>
          <div class="feature"><span>Onset</span><strong id="feature-onset">0.00</strong></div>
          <div class="feature"><span>Retained</span><strong id="material-memory">0.00</strong></div>
          <div class="feature"><span>Coherence</span><strong id="material-coherence">0.00</strong></div>
        </div>
      </section>
    </aside>
    <section class="transport">
      <button id="stage-atoms-play" type="button" title="Play or pause" aria-label="Play" disabled>&#9654;</button>
      <div class="seek-wrap"><span id="stage-atoms-time">0:00</span><input id="stage-atoms-seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="Seek"><span id="stage-atoms-duration">0:00</span></div>
      <div class="transport-state" id="stage-atoms-state" data-state="pending"><i></i><span>Loading</span></div>
    </section>
    <div class="failure" id="stage-atoms-failure" hidden></div>
  </main>
  <script type="module" src="./stage-atoms-browser.mjs"></script>
</body>
</html>
