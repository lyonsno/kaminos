<!doctype html><meta charset="utf-8"><title>GPU Scene Solid Conformance</title>
<script type="module">
import * as THREE from '../lib/three.webgpu.js';
import {createGpuSceneSolidProducer} from '../scene-solid-gpu.mjs';
import {createSceneSolidGeometryCache} from '../volume-scene-solid.mjs';
import {createGpuCollisionVoxelMesh} from '../scene-collision-debug.mjs';
window.runSolidConformance=async()=>{
 const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('No WebGPU adapter');
 const device=await adapter.requestDevice(),errors=[];device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 const results=[];
 try{
  for(const height of [16,32]){
   const gpu=createGpuSceneSolidProducer(device,{grid:16,gridHeight:height}),cpu=createSceneSolidGeometryCache();
   const box=new THREE.Mesh(new THREE.BoxGeometry(.62,.51,.43));box.position.set(.123,.171,-.087);box.rotation.set(.13,.27,.32);
   const other=new THREE.Mesh(new THREE.BoxGeometry(.35,.38,.32));other.position.set(-.5,.1,.1);
   const open=new THREE.Mesh(new THREE.PlaneGeometry(.8,.9));open.rotation.y=.43;
   const cases=[{name:'rotated-solid',objects:[{id:'box',object:box}]},
    {name:'open-plane',objects:[{id:'open',object:open}]},
    {name:'independent-union',objects:[{id:'box',object:box},{id:'other',object:other}]},
    {name:'removal',objects:[{id:'box',object:box}]},
    {name:'domain-transform',objects:[{id:'box',object:box}],transform:{translate:[.2,-.1,.1],scale:1.2}}];
   for(const fixture of cases){
    const transform=fixture.transform??{translate:[0,0,0],scale:1},shape={grid:16,gridHeight:height};
    const expected=cpu.update(fixture.objects,transform,shape),receipt=gpu.update(fixture.objects,transform,shape);
    const encoder=device.createCommandEncoder();gpu.encode(encoder);device.queue.submit([encoder.finish()]);
    const actual=await gpu.snapshot(),different=[];for(let i=0;i<actual.cells.length;i++)if(actual.cells[i]!==expected.field.cells[i])different.push(i);
    results.push({name:fixture.name,height,different,expected:Array.from(expected.field.cells),actual:Array.from(actual.cells),receipt});
   }
   gpu.destroy();
  }
  const gpu=createGpuSceneSolidProducer(device,{grid:16,gridHeight:16});
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(.7,.7,.7)),transform={translate:[0,0,0],scale:1};
  const submit=()=>{const e=device.createCommandEncoder();gpu.encode(e);device.queue.submit([e.finish()]);};
  async function installedCount(){
   const b=device.createBuffer({size:256*16*16,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
   try{const e=device.createCommandEncoder();e.copyTextureToBuffer({texture:gpu.texture},{buffer:b,bytesPerRow:256,rowsPerImage:16},[16,16,16]);device.queue.submit([e.finish()]);await b.mapAsync(GPUMapMode.READ);
    const a=new Uint32Array(b.getMappedRange());let count=0;for(let z=0;z<16;z++)for(let y=0;y<16;y++)for(let x=0;x<16;x++)count+=a[x+64*(y+16*z)]!==0;return count;
   }finally{b.unmap();b.destroy();}
  }
  const negatives=[];
  mesh.position.x=4;gpu.update([{id:'box',object:mesh}],transform,{grid:16,gridHeight:16});submit();
  let sampled=await gpu.snapshot();negatives.push({name:'outside-volume',valid:sampled.valid,counts:sampled.counts,installedCount:await installedCount()});
  mesh.position.x=0;gpu.update([{id:'box',object:mesh}],transform,{grid:16,gridHeight:16});submit();sampled=await gpu.snapshot();
  gpu.setSourceSupport(Uint32Array.from(sampled.cells));submit();sampled=await gpu.snapshot();
  negatives.push({name:'occluded-source',valid:sampled.valid,counts:sampled.counts,installedCount:await installedCount()});
  gpu.setSourceSupport(new Uint32Array(16**3));submit();
  const canvas=document.createElement('canvas');canvas.width=384;canvas.height=384;document.body.append(canvas);
  const renderer=new THREE.WebGPURenderer({canvas,device,antialias:false});await renderer.init();renderer.setSize(384,384);
  const scene=new THREE.Scene();scene.background=new THREE.Color(.015,.02,.025);
  const camera=new THREE.PerspectiveCamera(45,1,.01,10);camera.position.set(1.8,1.4,2);camera.lookAt(0,0,0);
  const makeOverlay=()=>createGpuCollisionVoxelMesh(THREE,renderer,{texture:gpu.texture,dimensions:[16,16,16],transform});
  const release=o=>{scene.remove(o);o.userData.disposeGpuSolid();o.geometry.dispose();o.material.dispose();};
  let overlay=makeOverlay();scene.add(overlay);await renderer.renderAsync(scene,camera);
  mesh.position.x=.3;gpu.update([{id:'box',object:mesh}],transform,{grid:16,gridHeight:16});submit();await renderer.renderAsync(scene,camera);
  release(overlay);overlay=makeOverlay();scene.add(overlay);await renderer.renderAsync(scene,camera);
  await device.queue.onSubmittedWorkDone();
  const overlayCount=(await gpu.snapshot()).cells.reduce((a,b)=>a+b,0);
  // Leave the inspected frame painted, then release only owned GPU resources.
  release(overlay);renderer.dispose();gpu.destroy();
  if(errors.length)throw Error(errors.join('\n'));
  return {backend:'WebGPU',adapter:adapter.info,results,negatives,overlay:{rendered:true,solidCells:overlayCount,lifecycle:['enabled','moved','disabled','recreated']},errors};
 }finally{device.destroy();}
};
window.fixtureLoaded=true;
</script>
