  settings: {resolution: res, views: dirs.length, fovDegrees: 30, albedoSupersample: 2, antialias: false, sameSurface, normals: useNormalMaps ? 'shading+normal-map' : 'shading'},
  diagonal, aggregate: aggregate(perView), perView, shownViews: show};

</script></body></html>
