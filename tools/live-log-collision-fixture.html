<!doctype html><meta charset="utf-8"><title>Log surface heat kernel fixture</title>
<script type="module">
import * as THREE from '../lib/three.webgpu.js';
import {createLiveLogHeatGpu} from '../live-log-heat-gpu.mjs';
window.runLogCollisionFixture=async()=>{
  const adapter=await navigator.gpu.requestAdapter();
  if(!adapter)throw Error('WebGPU adapter unavailable');
  const device=await adapter.requestDevice();
  const captureDevice=new Proxy(device,{get(target,key){
    if(key==='createTexture')return spec=>target.createTexture({...spec,usage:spec.usage|GPUTextureUsage.COPY_SRC});
    const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;
  }});
  const errors=[];device.addEventListener('uncapturederror',e=>errors.push(String(e.error)));
  const rows=[];
  try {
    for(const arm of ['overlap','collision','cold','blocked']){
      const grid=8,fluidData=new Float32Array(grid**3*16),solidData=new Uint8Array(256*grid*grid);
      for(let z=0;z<grid;z++)for(let y=0;y<grid;y++)for(let x=0;x<grid;x++){
        const solid=arm==='collision'&&[x,y,z].every(v=>v>=2&&v<=5)||arm==='blocked'&&[x,y,z].every(v=>v>=1&&v<=6);
        solidData[x+256*(y+grid*z)]=solid?1:0;
        fluidData[(x+grid*(y+grid*z))*16+5]=arm==='cold'||solid?0:1;
      }
      const fluid=device.createBuffer({size:fluidData.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
      device.queue.writeBuffer(fluid,0,fluidData);
      const collision=device.createTexture({size:[grid,grid,grid],dimension:'3d',format:'r8uint',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});
      device.queue.writeTexture({texture:collision},solidData,{bytesPerRow:256,rowsPerImage:grid},[grid,grid,grid]);
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),new THREE.MeshStandardMaterial());mesh.geometry.computeBoundingBox();
      const field=await createLiveLogHeatGpu({renderer:{backend:{device:captureDevice,get:()=>({})}},mesh,bounds:mesh.geometry.boundingBox});
      for(let step=1;step<=600;step++){
        const encoder=device.createCommandEncoder();
        field.encode(encoder,{device:captureDevice,fluid,collision,dimensions:[grid,grid,grid],simStepCount:step,allocationId:arm,dt:1/60,transform:{translate:[0,0,0],scale:1}});
        device.queue.submit([encoder.finish()]);
      }
      const readback=device.createBuffer({size:16,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
      // The summary is rgba16float: preserve its raw signal as well as decoded values.
      const encoder=device.createCommandEncoder();
      encoder.copyTextureToBuffer({texture:field.summaryTexture},{buffer:readback,bytesPerRow:256},[1,1,1]);
      device.queue.submit([encoder.finish()]);await readback.mapAsync(GPUMapMode.READ);
      const raw=Array.from(new Uint16Array(readback.getMappedRange().slice(0,8)));
      const decode=u=>{const s=u>>15?-1:1,e=(u>>10)&31,m=u&1023;return s*(e?Math.pow(2,e-15)*(1+m/1024):Math.pow(2,-14)*m/1024);};
      rows.push({arm,raw,peak:raw.map(decode),state:field.read()});
      readback.unmap();readback.destroy();field.dispose();fluid.destroy();collision.destroy();mesh.geometry.dispose();mesh.material.dispose();
    }
    const {vendor,architecture,device:adapterDevice,description}=adapter.info;
    return {adapter:{vendor,architecture,device:adapterDevice,description},rows,errors};
  }finally{device.destroy();}
};
</script>
