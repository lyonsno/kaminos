<!doctype html><html lang="en"><meta charset="utf-8"><title>Scene reflection conformance</title>
<style>body{margin:0;background:#111}canvas{display:block}</style>
<script type="importmap">{"imports":{"three/webgpu":"/lib/three.webgpu.js","three/tsl":"/lib/three.tsl.js"}}</script>
<script type="module">
import * as THREE from 'three/webgpu';
import {createSceneGI} from '../scene-gi.mjs';
THREE.Node.captureStackTrace=true;
const W=256,H=192,renderer=new THREE.WebGPURenderer({antialias:false});
try {
await renderer.init();renderer.setPixelRatio(1);renderer.setSize(W,H);renderer.toneMapping=THREE.NoToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,W/H,.1,30);
camera.position.set(2,2,4);camera.lookAt(0,.5,0);camera.updateMatrixWorld();
const data=new Uint8Array(16*8*4);for(let i=0;i<data.length;i+=4){data[i]=data[i+1]=data[i+2]=32;data[i+3]=255;}
const env=new THREE.DataTexture(data,16,8);env.mapping=THREE.EquirectangularReflectionMapping;env.needsUpdate=true;scene.environment=env;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:0xffffff,metalness:1,roughness:.05}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const box=new THREE.Mesh(new THREE.BoxGeometry(.9,1.3,.7),new THREE.MeshStandardMaterial({color:0,emissive:0xff1000,emissiveIntensity:3}));box.position.set(0,.65,0);scene.add(box);
const gi=createSceneGI(scene,camera,THREE.TSL.uniform(0),{renderer,reflections:{enabled:true,resolutionScale:.5,steps:64,maxDistance:20,thickness:.15}});
gi.setSettings({mode:'combined',gain:0,denoise:0,temporal:false,slices:1,steps:2});
const pipeline=new THREE.RenderPipeline(renderer);
window.reflectionAssay={
 async render(enabled,roughness=.05){
  floor.material.roughness=roughness;gi.reflections?.setSettings({enabled});
  pipeline.outputNode=gi.output();pipeline.needsUpdate=true;
  for(let i=0;i<12;i++){await new Promise(requestAnimationFrame);pipeline.render();await renderer.backend.device.queue.onSubmittedWorkDone();}
  const target=gi.beauty.renderTarget;
  const values=await renderer.readRenderTargetPixelsAsync(target,0,0,W,H);
  const pixels=Array.from(values,THREE.DataUtils.fromHalfFloat);
  return {pixels,state:gi.reflections?.state()??{enabled:false,route:'missing'},gi:gi.debugState()};
 },
 setObjectVisible(value){box.visible=value;gi.reflections?.reset('object-visibility');},
 dispose(){pipeline.dispose();gi.dispose();renderer.dispose();}
};
window.assayLoaded=true;
}catch(error){window.assayFailure=String(error.stack||error);}
</script></html>
