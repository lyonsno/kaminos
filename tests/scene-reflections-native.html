<script type="module">

window.reflectionAssay={
 async samplingFrames({settings,roughness=.35,views,boxPositions=null,resetBefore=false}){
  if(!Array.isArray(views)||!views.length)throw Error('Explicit replay camera sequence required');
  if(boxPositions&&(!Array.isArray(boxPositions)||boxPositions.length!==views.length))throw Error('Block replay must match the camera sequence');

  floor.material.roughness=roughness;gi.reflections.setSettings(settings);
  pipeline.outputNode=gi.output();pipeline.needsUpdate=true;
  const frames=[],before=gi.reflections.state();
  for(const [index,view]of views.entries()){
   if(boxPositions)box.position.fromArray(boxPositions[index]);
   camera.position.fromArray(view);camera.lookAt(0,.5,0);camera.updateMatrixWorld();
   await new Promise(requestAnimationFrame);pipeline.render();await renderer.backend.device.queue.onSubmittedWorkDone();
   const target=gi.reflections.raw;
   const values=await renderer.readRenderTargetPixelsAsync(target,0,0,target.width,target.height);
   const row=target.height>1?(values.length-target.width*4)/(target.height-1):target.width*4;
   if(!Number.isInteger(row)||row<target.width*4)throw Error('Invalid reflection readback row layout');
   const raw=[];for(let y=0;y<target.height;y++)for(let x=0;x<target.width*4;x++)raw.push(THREE.DataUtils.fromHalfFloat(values[y*row+x]));
   const completed=gi.reflections.targets[1-gi.reflections.writeIndex];const resolvedValues=await renderer.readRenderTargetPixelsAsync(completed,0,0,completed.width,completed.height,0);
   let historyStats=null;if(completed.textures.length>3){const historyValues=await renderer.readRenderTargetPixelsAsync(completed,0,0,completed.width,completed.height,3);historyStats=[];for(let y=0;y<target.height;y++)for(let x=0;x<target.width*4;x++)historyStats.push(THREE.DataUtils.fromHalfFloat(historyValues[y*row+x]));}
   const resolved=[];for(let y=0;y<target.height;y++)for(let x=0;x<target.width*4;x++)resolved.push(THREE.DataUtils.fromHalfFloat(resolvedValues[y*row+x]));
   frames.push({camera:camera.position.toArray(),block:box.position.toArray(),state:gi.reflections.state(),readback:{elements:values.length,rowElements:row},raw,resolved,historyStats});
  }

 },
 async neuralReceiver(){
  const layer=(i,o)=>({num_inputs:i,num_outputs:o,weights:Array(i*o).fill(0),biases:Array(o).fill(0)});
  const last=layer(2,3);last.biases.fill(Math.log(.015));
  const bundle=readNeuralAppearanceBundle({latents:{num_channels:8},decoder:{hidden_layers:[2],hidden_activations:'SmeLU',output_activation:{type:'ScaledSigmoid',scale:1e5},half_diff_parameterization:'StableRusinkiewicz',num_shading_frames:2,direction_inputs:'WhWdZiZo',_params:{rotation:{rotation_decoder:{mlp_layers:[layer(8,12)]}},network:{mlp_layers:[layer(24,2),last]}}},kaminos:{schema:'kaminos.neural-appearance.bundle.v1',response:'projected-bsdf',filtering:'nearest-authored-texel-mip',levels:[{width:2,height:2,url:'fixture.f32',sha256:'0'.repeat(64)}]}});
  bundle.levels[0].data=new Float32Array(32);
  const runtime=createNeuralAppearanceMaterial(bundle,{reflectionRoughness:.05,reflectionColor:'#ffffff'}),original=floor.material;
  const oldIntensity=scene.environmentIntensity,oldEnvironment=scene.environment;
  const hdrData=new Uint16Array(128*64*4);
  for(let i=0;i<hdrData.length;i+=4){
   hdrData[i]=hdrData[i+1]=hdrData[i+2]=THREE.DataUtils.toHalfFloat(.25);hdrData[i+3]=THREE.DataUtils.toHalfFloat(1);
  }
  const hdr=new THREE.DataTexture(hdrData,128,64,THREE.RGBAFormat,THREE.HalfFloatType);
  hdr.mapping=THREE.EquirectangularReflectionMapping;hdr.needsUpdate=true;scene.environment=hdr;
  floor.material=runtime.material;
  const capture=async(enabled,intensity)=>{
   scene.environmentIntensity=intensity;gi.reflections.reset('receiver-case');
   const frame=await this.render(enabled);
   return frame;
  };
  try{
   const dark=await capture(false,0),sky=await capture(false,1),room=await capture(true,1);
   let skyGain=0,redGain=0,roomPixels=0;
   for(let y=110;y<185;y++)for(let x=20;x<236;x++){
    const i=(y*W+x)*4,delta=room.pixels[i]-sky.pixels[i];
    skyGain+=sky.pixels[i]-dark.pixels[i];
    redGain+=delta;
    if(delta>.02&&delta>2*(room.pixels[i+1]-sky.pixels[i+1]))roomPixels++;
   }
   const probe=new SourceNeuralFallbackProbe(gi.neuralShading);
   const measurements={};
   const directLight=new THREE.DirectionalLight(0xffffff,1);directLight.position.set(.2,1,.1);scene.add(directLight);
   try{
    for(const scale of [1,.5]){
     gi.neuralShading.setScale(scale);
     const frame=await capture(false,0);
     const before=gi.neuralShading.state();
     const counts=await probe.sample(renderer,{frame:frame.gi.frames}).catch(async error=>{
      const attachment=gi.source.renderTarget.textures.indexOf(gi.transport.value);
      const raw=await renderer.readRenderTargetPixelsAsync(gi.source.renderTarget,128,156,1,1,attachment);
      throw Error('At scale '+scale+': '+error.message+' center transport '+Array.from(raw,THREE.DataUtils.fromHalfFloat));
     });
     measurements[scale]={counts,captureFrames:before.frames,center:frame.pixels.slice((156*W+128)*4,(156*W+128)*4+3)};
    }
   }finally{directLight.removeFromParent();directLight.dispose();probe.dispose();gi.neuralShading.setScale(1);}
   floor.material=original;
   const standard=await capture(false,1);
   let standardSkyGain=0;for(let y=135;y<185;y++)for(let x=20;x<236;x++)standardSkyGain+=standard.pixels[(y*W+x)*4];
   return {skyGain,redGain,roomPixels,dark,sky,room,standardSkyGain,measurements,material:runtime.material.userData.neuralAppearance};
  }finally{floor.material=original;scene.environmentIntensity=oldIntensity;scene.environment=oldEnvironment;hdr.dispose();runtime.dispose();gi.reflections.reset('receiver-disposed');}
 },
 async transport(){
  const matte=new THREE.Mesh(new THREE.SphereGeometry(.35,16,12),new THREE.MeshStandardMaterial({color:0x00ff00,roughness:1}));matte.position.set(1.3,.4,0);
  const unlit=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),new THREE.MeshBasicMaterial({color:0x0000ff}));unlit.position.set(-1.3,.3,0);scene.add(matte,unlit);
  const light=new THREE.DirectionalLight(0xffffff,6);light.position.set(-2,3,-4);scene.add(light);
  // Exercise the existing surface-light attachment alongside the new transport
  // channel on the default 32-byte color-attachment budget.
  gi.surfaceLighting.bind(box.material,THREE.TSL.vec3(.01,.02,.03));
  const reference=THREE.TSL.pass(scene,camera,{samples:0});reference.transparent=false;reference.contextNode=THREE.TSL.context({sceneReflectionLighting:null});reference.setMRT(THREE.TSL.mrt({output:THREE.TSL.output}));
  const referencePipeline=new THREE.RenderPipeline(renderer);referencePipeline.outputNode=reference.getTextureNode('output');
  try{
   await this.render(false);
   const read=async(target,attachment=0)=>Array.from(await renderer.readRenderTargetPixelsAsync(target,0,0,W,H,attachment),THREE.DataUtils.fromHalfFloat);
   const full=await read(gi.source.renderTarget),transportNode=gi.transport??gi.source.getTextureNode('output');
   const transport=await read(gi.source.renderTarget,gi.source.renderTarget.textures.indexOf(transportNode.value));
   const normal=await read(gi.source.renderTarget,gi.source.renderTarget.textures.indexOf(gi.source.getTextureNode('normal').value));
   referencePipeline.render();await renderer.backend.device.queue.onSubmittedWorkDone();const ordinary=await read(reference.renderTarget);
   let metalPixels=0,metalTransportPeak=0,metalFullPeak=0,emissivePixels=0,emissiveError=0,diffusePixels=0,diffusePeak=0,unlitPixels=0,unlitError=0,fullReferenceError=0;
   const emission=box.material.emissive.toArray().map(x=>x*box.material.emissiveIntensity);
   for(let i=0;i<full.length;i+=4){
    for(let c=0;c<3;c++)fullReferenceError=Math.max(fullReferenceError,Math.abs(full[i+c]-ordinary[i+c]));
    const covered=normal[i]**2+normal[i+1]**2+normal[i+2]**2>.5;
    if(covered&&normal[i+3]<.1){metalPixels++;for(let c=0;c<3;c++){metalTransportPeak=Math.max(metalTransportPeak,Math.abs(transport[i+c]));metalFullPeak=Math.max(metalFullPeak,full[i+c]);}}
    if(covered&&full[i]>2&&full[i+1]<.05){emissivePixels++;for(let c=0;c<3;c++)emissiveError=Math.max(emissiveError,Math.abs(transport[i+c]-emission[c]));}
    if(covered&&full[i+1]>.01&&full[i+1]>full[i]*2){diffusePixels++;diffusePeak=Math.max(diffusePeak,transport[i+1]);}
    if(covered&&full[i+2]>.5&&full[i+2]>full[i]*4){unlitPixels++;for(let c=0;c<3;c++)unlitError=Math.max(unlitError,Math.abs(transport[i+c]-full[i+c]));}
   }
   return {stats:{metalPixels,metalTransportPeak,metalFullPeak,emissivePixels,emissiveError,diffusePixels,diffusePeak,unlitPixels,unlitError,fullReferenceError},full,transport,ordinary,normal};
  }finally{light.removeFromParent();referencePipeline.dispose();reference.dispose();for(const mesh of [matte,unlit]){mesh.removeFromParent();mesh.geometry.dispose();mesh.material.dispose();}}
 },
 async studyShadow(){
  const {default:study}=await import('../experiments/reflection-study.experiment.mjs');
  const oldEnv=scene.environment,oldCamera=camera.clone(),oldShadows=renderer.shadowMap.enabled,root=new THREE.Group();scene.add(root);
  const session={attach:async value=>{root.add(value);return {id:value.uuid,root:value};},setView(){},dispose:async()=>root.removeFromParent()};
  const instance=await study.create({host:{scene:{open:async()=>session},rendering:{readReflections:()=>({settings:{enabled:true}}),reflections:()=>{}}},inputs:{},record(){},updateInputs(){}});
  const ground=root.getObjectByName('Reflective ground'),block=root.getObjectByName('Warm reflected block');
  root.getObjectByName('Cool reflected block').visible=false;root.getObjectByName('Curved silver receiver').visible=false;
  block.position.set(0,.76,-2);block.material.emissiveIntensity=0;block.material.color.set(0);
  ground.material.metalness=1;ground.material.roughness=.08;
  const light=new THREE.DirectionalLight(0xffffff,6);light.position.set(0,2,-4);light.castShadow=true;light.shadow.camera.left=-5;light.shadow.camera.right=5;light.shadow.camera.top=5;light.shadow.camera.bottom=-5;light.shadow.camera.near=.1;light.shadow.camera.far=20;scene.add(light);
  floor.visible=false;box.visible=false;scene.environment=null;renderer.shadowMap.enabled=true;camera.position.set(0,2,4);camera.lookAt(0,0,0);camera.updateMatrixWorld();

   const records={};const point=new THREE.Vector3(0,.01,0).project(camera),px=Math.round((point.x*.5+.5)*W),py=Math.round((.5-point.y*.5)*H);
   for(const [name,visible]of [['open',false],['blocked',true]]){block.visible=visible;light.shadow.needsUpdate=true;const frame=await this.render(false);let peak=0;for(let y=py-2;y<=py+2;y++)for(let x=px-2;x<=px+2;x++)for(let c=0;c<3;c++)peak=Math.max(peak,frame.pixels[(y*W+x)*4+c]);records[name]={peak,pixels:frame.pixels};}

 async glossySource({samples=12}={}){
  if(!Number.isSafeInteger(samples)||samples<1)throw Error('Positive glossy capture count required');
  const hotspot=new THREE.Mesh(new THREE.PlaneGeometry(.06,.06),new THREE.MeshBasicMaterial({color:new THREE.Color(4096,4096,4096)}));hotspot.position.set(0,.9,.355);scene.add(hotspot);
  const read=async target=>Array.from(await renderer.readRenderTargetPixelsAsync(target,0,0,target.width,target.height),THREE.DataUtils.fromHalfFloat);
  const results={};
  try{
   for(const [name,scale]of [['small',1],['broad',12]]){
    hotspot.scale.setScalar(scale);gi.reflections.reset('glossy-source-'+name);await this.render(true,.35);
    const source=await read(gi.source.renderTarget),frames=[],before={frame:gi.reflections.frames,pyramid:gi.reflections.radianceFrames};let peak=0;
    for(let i=0;i<samples;i++){await new Promise(requestAnimationFrame);pipeline.render();await renderer.backend.device.queue.onSubmittedWorkDone();const raw=await read(gi.reflections.raw);let maximum=0;for(let j=0;j<raw.length;j+=4)maximum=Math.max(maximum,raw[j],raw[j+1],raw[j+2]);peak=Math.max(peak,maximum);frames.push({frame:gi.reflections.frames,pyramid:gi.reflections.radianceFrames,maximum,raw});}

   }
   return results;

 async render(enabled,roughness=.05){
  floor.material.roughness=roughness;gi.reflections?.setSettings({enabled});
  pipeline.outputNode=gi.output();pipeline.needsUpdate=true;
  for(let i=0;i<12;i++){await new Promise(requestAnimationFrame);pipeline.render();await renderer.backend.device.queue.onSubmittedWorkDone();}
  const target=gi.beauty.renderTarget;
  const values=await renderer.readRenderTargetPixelsAsync(target,0,0,W,H);
