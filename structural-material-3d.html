<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="kaminos-visual-consumer-authority" content="threejs-sidecar-consumer-not-truth-v0">
  <title>Kaminos Layered Structural Sidecar</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0d10;
      color: #f4efe0;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #0a0d10;
      overflow: hidden;
    }
    header {
      display: grid;
      grid-template-columns: auto auto auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #273342;
      background: #101821;
      min-width: 0;
    }
    button {
      appearance: none;
      border: 1px solid #41556d;
      border-radius: 6px;
      background: #1d2b36;
      color: #f4efe0;
      min-height: 34px;
      padding: 0 12px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #263848; }
    #readout {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: #9fb6c9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    #stage {
      position: relative;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      background: #0a0d10;
    }
    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      left: 14px;
      bottom: 12px;
      right: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 12px;
      pointer-events: none;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: #d6e4ea;
      text-shadow: 0 1px 2px #000;
    }
    #route {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #95d0a5;
    }
    #gesture {
      color: #f1cc62;
      white-space: nowrap;
    }
    #gpu-status {
      color: #95d0a5;
      white-space: nowrap;
    }
    @media (max-width: 640px) {
      header {
        grid-template-columns: auto auto auto minmax(0, 1fr);
        gap: 8px;
      }
      button {
        min-height: 34px;
        padding: 0 10px;
      }
      #hud {
        grid-template-columns: 1fr;
      }
      #route {
        display: none;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three.webgpu.js",
        "three/webgpu": "./lib/three.webgpu.js",
        "three/tsl": "./lib/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <button id="reset">Reset</button>
    <button id="fracture">Shear</button>
    <button id="bind">Bind</button>
    <div id="readout"></div>
  </header>
  <main id="stage" aria-label="Layered structural material sidecar route">
    <div id="hud">
      <div id="route"></div>
      <div id="gpu-status"></div>
      <div id="gesture"></div>
    </div>
  </main>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import {
      STRUCTURAL_MATERIAL_3D_ROUTE,
      STRUCTURAL_MATERIAL_3D_VISUAL_AUTHORITY,
      applyLayeredStructuralInteraction,
      buildLayeredStructuralWitnessScenario,
      createLayeredStructuralMaterial,
      createLayeredStructuralPickedDragInteraction,
      resolveLayeredStructuralRestContact,
      summarizeLayeredStructuralState,
    } from './structural-material-3d-core.js';
    import {
      STRUCTURAL_MATERIAL_3D_WEBGPU_ROUTE,
      runLayeredStructuralWebGpuParity,
    } from './structural-material-3d-webgpu-core.js';
    import {
      STRUCTURAL_MATERIAL_3D_WEBGPU_RETAINED_ROUTE,
      buildLayeredStructuralRetainedWitnessInteractions,
      runLayeredStructuralRetainedWebGpuParity,
    } from './structural-material-3d-webgpu-retained.js';
    import {
      STRUCTURAL_MATERIAL_3D_WEBGPU_BINDING_ROUTE,
      STRUCTURAL_MATERIAL_3D_WEBGPU_HOT_SIDECAR_ROUTE,
      createLayeredStructuralHotWebGpuSidecar,
      validateLayeredStructuralHotBindingReceipt,
    } from './structural-material-3d-webgpu-hot-sidecar.js';
    import {
      STRUCTURAL_MATERIAL_3D_WEBGPU_TEAR_ROUTE,
      buildLayeredStructuralGpuTearMaterial,
      buildLayeredStructuralHotSympatheticTearFailureReceipt,
      buildLayeredStructuralHotSympatheticTearReceipt,
      createLayeredStructuralGpuTearRequestGate,
      runLayeredStructuralSympatheticTearWebGpu,
    } from './structural-material-3d-webgpu-tear.js';
    import {
      buildLayeredStructuralGpuBindingFailureReceipt,
      buildLayeredStructuralGpuBindingMaterial,
    } from './structural-material-3d-webgpu-bind.js';
    import {
      DEFAULT_STRUCTURAL_MATERIAL_NATIVE_HAPTIC_URL,
      buildLayeredStructuralHapticImpulse,
      createLatestStructuralGpuOperationTracker,
      createLatestStructuralInteractionScheduler,
      detectStructuralHapticCapabilities,
      dispatchStructuralHapticImpulse,
    } from './structural-material-3d-live-drag.js';

    const stage = document.querySelector('#stage');
    const readout = document.querySelector('#readout');
    const route = document.querySelector('#route');
    const gpuStatus = document.querySelector('#gpu-status');
    const gesture = document.querySelector('#gesture');
    const CAMERA_CONTROL_AUTHORITY = 'operator-camera-controls-v0';
    const hapticCompanionParameter = new URL(window.location.href).searchParams.get('hapticCompanion');
    const nativeHapticCompanionUrl = hapticCompanionParameter === 'off'
      ? null
      : hapticCompanionParameter || DEFAULT_STRUCTURAL_MATERIAL_NATIVE_HAPTIC_URL;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0d10);
    const initialStageRect = stage.getBoundingClientRect();
    const initialAspect = initialStageRect.width / Math.max(1, initialStageRect.height);
    const camera = new THREE.PerspectiveCamera(42, initialAspect, 0.01, 100);
    camera.position.set(0.2, 1.2, initialAspect < 0.75 ? 8.5 : 3.35);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGPURenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    stage.prepend(renderer.domElement);
    await renderer.init();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = false;
    controls.rotateSpeed = 0.72;
    controls.panSpeed = 0.6;
    controls.zoomSpeed = 0.85;
    controls.screenSpacePanning = true;
    controls.minDistance = 1.2;
    controls.maxDistance = 14;
    controls.target.set(0, 0, 0);
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.PAN,
      RIGHT: THREE.MOUSE.ROTATE,
    };
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN,
    };
    controls.update();
    renderer.domElement.addEventListener('contextmenu', event => event.preventDefault());

    const world = new THREE.Group();
    world.rotation.set(-0.18, -0.45, 0);
    scene.add(world);
    scene.add(new THREE.HemisphereLight(0xe8f3ff, 0x1d2530, 2.3));
    const key = new THREE.DirectionalLight(0xffffff, 2.1);
    key.position.set(1.5, 2.2, 2.4);
    scene.add(key);

    const nodeGeometry = new THREE.SphereGeometry(0.025, 12, 8);
    const liveMaterial = new THREE.LineBasicMaterial({ color: 0x6ec6d3, transparent: true, opacity: 0.62 });
    const stressedMaterial = new THREE.LineBasicMaterial({ color: 0xf2b84b, transparent: true, opacity: 0.92 });
    const brokenMaterial = new THREE.LineBasicMaterial({ color: 0xff4a3b, transparent: true, opacity: 0.95 });
    const depthMaterial = new THREE.LineBasicMaterial({ color: 0x95d0a5, transparent: true, opacity: 0.62 });
    const nodeMaterial = new THREE.MeshStandardMaterial({ color: 0xf4efe0, roughness: 0.82, metalness: 0.05 });
    const pinnedMaterial = new THREE.MeshStandardMaterial({ color: 0x697a9a, roughness: 0.7, metalness: 0.08 });
    const looseMaterial = new THREE.MeshStandardMaterial({ color: 0xffe078, roughness: 0.66, metalness: 0.05 });
    const forceMaterial = new THREE.LineBasicMaterial({ color: 0xf1cc62, transparent: true, opacity: 0.96 });
    const forceNodeMaterial = new THREE.MeshBasicMaterial({ color: 0xff785a });
    const structuralRaycaster = new THREE.Raycaster();
    structuralRaycaster.params.Line.threshold = 0.075;
    const structuralPointerNdc = new THREE.Vector2();

    let material = createLayeredStructuralMaterial({ columns: 9, rows: 5, layers: 4, notch: true });
    let materialPointerId = null;
    let dragStart = null;
    let latestStructuralPick = null;
    let forceEnvelope = null;
    let lastPoint = { x: 0.92, y: 0.52, z: 0.85 };
    const cameraInvariantViolations = [];
    let gpuParityReceipt = null;
    let gpuParityPromise = null;
    let gpuRetainedReceipt = null;
    let gpuRetainedPromise = null;
    let gpuTearReceipt = null;
    let gpuTearPromise = null;
    let gpuTearPostExecutionWitnessHold = null;
    let gpuBindingReceipt = null;
    let gpuBindingPromise = null;
    let gpuTearOperationQueue = Promise.resolve();
    let gpuTearAppliedCount = 0;
    let gpuTearPreviousAppliedReceipt = null;
    let gpuTearLatestAppliedReceipt = null;
    let gpuTearDiscardedCount = 0;
    let gpuHotSidecar = null;
    let gpuHotSidecarPromise = null;
    let hapticImpulseCount = 0;
    let hapticDispatchCount = 0;
    let hapticDispatchErrorCount = 0;
    let latestHapticImpulse = null;
    let latestHapticDispatchReceipt = null;
    let structuralGestureSequence = 0;
    const hapticCapabilities = detectStructuralHapticCapabilities(undefined, { nativeCompanionUrl: nativeHapticCompanionUrl });
    const gpuTearRequestGate = createLayeredStructuralGpuTearRequestGate();
    const latestGpuOperationTracker = createLatestStructuralGpuOperationTracker();
    const liveDragScheduler = createLatestStructuralInteractionScheduler({
      execute: interaction => requestGpuSympatheticTear(material, interaction),
    });

    function worldPoint(node) {
      return new THREE.Vector3(
        (node.x + node.displacement.x - 0.5) * 2.35,
        (0.5 - node.y - node.displacement.y) * 1.25,
        (node.z + node.displacement.z - 0.5) * 0.95,
      );
    }

    function clearWorld() {
      while (world.children.length > 0) {
        const child = world.children.pop();
        child.geometry?.dispose?.();
      }
    }

    function lineBetween(a, b, lineMaterial) {
      const geometry = new THREE.BufferGeometry().setFromPoints([a, b]);
      return new THREE.Line(geometry, lineMaterial);
    }

    function renderMaterial() {
      clearWorld();
      const nodeById = new Map(material.nodes.map(node => [node.id, node]));
      const structuralMutation = material.sympatheticBinding || material.sympatheticTear;
      const anchoredComponentId = structuralMutation
        ? `g${structuralMutation.anchoredComponentLabel}`
        : 'c0';
      const maxStress = Math.max(0.001, ...material.bonds.map(bond => bond.lastStress || 0));
      for (const bond of material.bonds) {
        const a = worldPoint(nodeById.get(bond.a));
        const b = worldPoint(nodeById.get(bond.b));
        const stress = (bond.lastStress || 0) / maxStress;
        const lineMaterial = bond.alive
          ? bond.bondKind === 'depth'
            ? depthMaterial
            : stress > 0.58
              ? stressedMaterial
              : liveMaterial
          : brokenMaterial;
        const line = lineBetween(a, b, lineMaterial);
        line.userData.structuralPick = { kind: 'bond', id: bond.id };
        if (!bond.alive) line.computeLineDistances?.();
        world.add(line);
      }
      for (const node of material.nodes) {
        const mesh = new THREE.Mesh(
          nodeGeometry,
          node.pinned ? pinnedMaterial : node.componentId === anchoredComponentId ? nodeMaterial : looseMaterial,
        );
        mesh.position.copy(worldPoint(node));
        mesh.scale.setScalar(node.pinned ? 1.32 : 1);
        mesh.userData.structuralPick = { kind: 'node', id: node.id };
        world.add(mesh);
      }
      if (forceEnvelope) {
        const contactPoint = forceEnvelope.displayPoint || forceEnvelope.start || forceEnvelope.point;
        const visualEnd = forceEnvelope.visualEnd || forceEnvelope.point;
        const start = new THREE.Vector3((contactPoint.x - 0.5) * 2.35, (0.5 - contactPoint.y) * 1.25, (contactPoint.z - 0.5) * 0.95);
        const end = new THREE.Vector3((visualEnd.x - 0.5) * 2.35, (0.5 - visualEnd.y) * 1.25, (visualEnd.z - 0.5) * 0.95);
        world.add(lineBetween(start, end, forceMaterial));
        const contact = new THREE.Mesh(new THREE.SphereGeometry(0.055 + forceEnvelope.radius * 0.05, 18, 10), forceNodeMaterial);
        contact.position.copy(start);
        world.add(contact);
      }
    }

    function updateReadout() {
      const summary = summarizeLayeredStructuralState(material);
      readout.textContent = `broken ${summary.brokenBondCount} | repaired ${summary.repairedBondCount} | depth ${summary.brokenDepthBondCount}/${summary.crossDepthBondCount} | components ${summary.componentCount} | sound ${summary.sound.signature}`;
      route.textContent = `${STRUCTURAL_MATERIAL_3D_ROUTE} | ${STRUCTURAL_MATERIAL_3D_VISUAL_AUTHORITY}`;
      const latestGpuOperation = latestGpuOperationTracker.snapshot();
      const latestGpuReceipt = latestGpuOperation?.receipt;
      const latestWarmTotal = latestGpuReceipt?.timingsMs?.warmTotal;
      const timingSuffix = Number.isFinite(latestWarmTotal) ? ` | ${latestWarmTotal.toFixed(1)} ms` : '';
      gpuStatus.textContent = latestGpuOperation?.status === 'pending'
        ? `GPU ${latestGpuOperation.kind === 'binding' ? 'bind' : 'tear'} pending`
        : latestGpuOperation?.status === 'failed'
          ? `GPU ${latestGpuOperation.kind === 'binding' ? 'bind' : 'tear'} failed | ${latestGpuReceipt?.failurePhase || 'unknown'}${timingSuffix}`
        : latestGpuOperation?.kind === 'binding'
        ? latestGpuReceipt?.binding?.noOp && material.sympatheticBinding
          ? `GPU bind no-op | repaired ${material.sympatheticBinding.repairedBondCount}${timingSuffix}`
          : `GPU bind ${latestGpuReceipt?.status} ${latestGpuReceipt?.binding?.eventCount ?? 0} edges${timingSuffix}`
        : latestGpuOperation?.kind === 'tear'
        ? `GPU tear ${latestGpuReceipt?.status} ${latestGpuReceipt?.topology?.componentCount ?? 0} components${timingSuffix}`
        : gpuRetainedReceipt
          ? `GPU retained ${gpuRetainedReceipt.status} ${gpuRetainedReceipt.parity?.gpuEventCount ?? 0}/${gpuRetainedReceipt.parity?.cpuEventCount ?? 0}`
        : gpuParityReceipt
          ? `GPU ${gpuParityReceipt.status} ${gpuParityReceipt.parity?.gpuBreakCount ?? 0}/${gpuParityReceipt.parity?.cpuBreakCount ?? 0}`
          : '';
      gpuStatus.title = latestGpuReceipt?.effectiveRoute || (latestGpuReceipt?.requestedExecutionRoute
        ? `requested ${latestGpuReceipt.requestedExecutionRoute}; effective ${latestGpuOperation?.status === 'pending' ? 'pending' : 'unavailable'}`
        : latestGpuReceipt?.requestedRoute
          ? `requested ${latestGpuReceipt.requestedRoute}; effective unavailable`
          : gpuRetainedReceipt?.effectiveRoute || gpuParityReceipt?.effectiveRoute || STRUCTURAL_MATERIAL_3D_WEBGPU_ROUTE);
      gesture.textContent = forceEnvelope
        ? `input ${Math.round((forceEnvelope.inputLoad ?? forceEnvelope.magnitude / 1.95) * 100)}% | ramp ${Math.round((forceEnvelope.contactRamp ?? Math.min(1, forceEnvelope.magnitude / 0.45)) * 100)}% | stress ${summary.maxStress.toFixed(3)}`
        : `input 0% | ramp 0% | stress ${summary.maxStress.toFixed(3)}`;
    }

    function visibleTearState() {
      if (!material.sympatheticTear) return null;
      const direction = material.sympatheticTear.direction;
      const nodeById = new Map(material.nodes.map(node => [node.id, node]));
      const nodeIndexById = new Map(material.nodes.map((node, index) => [node.id, index]));
      const gestureBaseline = material.visualDisplacementGesture?.baselineDisplacements;
      const currentGestureBaselineAvailable = Array.isArray(gestureBaseline) &&
        gestureBaseline.length === material.nodes.length;
      const currentResponse = (node, index) => {
        if (!currentGestureBaselineAvailable) return null;
        return {
          x: node.displacement.x - gestureBaseline[index].x,
          y: node.displacement.y - gestureBaseline[index].y,
          z: node.displacement.z - gestureBaseline[index].z,
        };
      };
      let responseWeight = 0;
      let currentResponseWeight = 0;
      const responseCentroid = material.nodes.reduce((centroid, node) => {
        const weight = Math.hypot(node.displacement.x, node.displacement.y, node.displacement.z);
        responseWeight += weight;
        centroid.x += node.x * weight;
        centroid.y += node.y * weight;
        centroid.z += node.z * weight;
        return centroid;
      }, { x: 0, y: 0, z: 0 });
      const currentResponseCentroid = material.nodes.reduce((centroid, node, index) => {
        const response = currentResponse(node, index);
        if (!response) return centroid;
        const weight = Math.hypot(response.x, response.y, response.z);
        currentResponseWeight += weight;
        centroid.x += node.x * weight;
        centroid.y += node.y * weight;
        centroid.z += node.z * weight;
        return centroid;
      }, { x: 0, y: 0, z: 0 });
      return {
        authority: material.sympatheticTear.authority,
        effectiveRoute: material.sympatheticTear.effectiveRoute,
        effectiveSequenceIdentity: material.sympatheticTear.effectiveSequenceIdentity,
        contactResponse: material.sympatheticTear.contactResponse,
        currentGestureBaselineAvailable,
        responseCentroid: responseWeight > 0
          ? {
              x: responseCentroid.x / responseWeight,
              y: responseCentroid.y / responseWeight,
              z: responseCentroid.z / responseWeight,
            }
          : null,
        currentResponseCentroid: currentResponseWeight > 0
          ? {
              x: currentResponseCentroid.x / currentResponseWeight,
              y: currentResponseCentroid.y / currentResponseWeight,
              z: currentResponseCentroid.z / currentResponseWeight,
            }
          : null,
        components: material.components.map(component => {
          const nodes = component.nodeIds.map(nodeId => nodeById.get(nodeId));
          const currentResponses = component.nodeIds.map(nodeId => {
            const index = nodeIndexById.get(nodeId);
            return currentResponse(nodeById.get(nodeId), index);
          });
          const displacementMagnitudes = nodes.map(node => Math.hypot(
            node.displacement.x,
            node.displacement.y,
            node.displacement.z,
          ));
          const directionDots = nodes.map(node =>
            node.displacement.x * direction.x +
            node.displacement.y * direction.y +
            node.displacement.z * direction.z
          );
          const currentResponseMagnitudes = currentResponses.map(response => response
            ? Math.hypot(response.x, response.y, response.z)
            : null);
          const currentDirectionDots = currentResponses.map(response => response
            ? response.x * direction.x + response.y * direction.y + response.z * direction.z
            : null);
          return {
            id: component.id,
            label: component.label,
            pinned: component.pinned,
            nodeCount: component.nodeCount,
            maxDisplacement: Math.max(...displacementMagnitudes),
            maxPinnedDisplacement: Math.max(0, ...nodes
              .filter(node => node.pinned)
              .map(node => Math.hypot(node.displacement.x, node.displacement.y, node.displacement.z))),
            maxUnpinnedDisplacement: Math.max(0, ...nodes
              .filter(node => !node.pinned)
              .map(node => Math.hypot(node.displacement.x, node.displacement.y, node.displacement.z))),
            minDirectionDot: Math.min(...directionDots),
            maxCurrentResponse: currentGestureBaselineAvailable
              ? Math.max(0, ...currentResponseMagnitudes)
              : null,
            minCurrentDirectionDot: currentGestureBaselineAvailable
              ? Math.min(...currentDirectionDots)
              : null,
            currentResponseNodeCount: currentGestureBaselineAvailable
              ? currentResponseMagnitudes.filter(magnitude => magnitude > 0.000000001).length
              : null,
          };
        }),
      };
    }

    function visibleBindingState() {
      if (!material.sympatheticBinding) return null;
      return {
        ...material.sympatheticBinding,
        finalBondLiveness: material.bonds.map(bond => bond.alive),
        repairedBondIds: material.bonds.filter(bond => bond.repaired).map(bond => bond.id),
        componentLabels: material.nodes.map(node => Number(node.componentId.slice(1))),
      };
    }

    function renderScene() {
      renderer.render(scene, camera);
    }

    function render() {
      renderMaterial();
      updateReadout();
      renderScene();
    }

    controls.addEventListener('change', renderScene);

    function cameraState() {
      return {
        position: camera.position.toArray(),
        quaternion: camera.quaternion.toArray(),
        up: camera.up.toArray(),
        zoom: camera.zoom,
        target: controls.target.toArray(),
      };
    }

    function sameCameraState(a, b, epsilon = 1e-10) {
      return ['position', 'quaternion', 'up', 'target'].every(field =>
        a[field].every((value, index) => Math.abs(value - b[field][index]) <= epsilon)
      ) && Math.abs(a.zoom - b.zoom) <= epsilon;
    }

    function restoreCameraState(state) {
      camera.position.fromArray(state.position);
      camera.quaternion.fromArray(state.quaternion);
      camera.up.fromArray(state.up);
      camera.zoom = state.zoom;
      controls.target.fromArray(state.target);
      camera.updateProjectionMatrix();
    }

    function runStructuralMutation(action, mutation) {
      const before = cameraState();
      const result = mutation();
      const after = cameraState();
      if (!sameCameraState(before, after)) {
        restoreCameraState(before);
        cameraInvariantViolations.push({ action, before, after });
        throw new Error(`structural action changed operator camera state: ${action}`);
      }
      render();
      return result;
    }

    function resize() {
      const rect = stage.getBoundingClientRect();
      const width = Math.max(320, Math.floor(rect.width));
      const height = Math.max(280, Math.floor(rect.height));
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
      renderScene();
    }

    function eventPoint(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      return {
        x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
        y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height)),
      };
    }

    function displayedStructuralPointFromWorld(hitPoint) {
      const local = world.worldToLocal(hitPoint.clone());
      return {
        x: local.x / 2.35 + 0.5,
        y: 0.5 - local.y / 1.25,
        z: local.z / 0.95 + 0.5,
      };
    }

    function cameraBasisInMaterial() {
      camera.updateMatrixWorld(true);
      world.updateMatrixWorld(true);
      const inverseWorldQuaternion = world.getWorldQuaternion(new THREE.Quaternion()).invert();
      const toStructuralDirection = worldDirection => {
        const local = worldDirection.clone().applyQuaternion(inverseWorldQuaternion);
        return local.set(local.x / 2.35, -local.y / 1.25, local.z / 0.95);
      };
      const screenRight = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0).normalize();
      const screenDown = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1).multiplyScalar(-1).normalize();
      const right = toStructuralDirection(screenRight);
      const down = toStructuralDirection(screenDown);
      return {
        screenRight: { x: right.x, y: right.y, z: right.z },
        screenDown: { x: down.x, y: down.y, z: down.z },
      };
    }

    function pickStructuralContact(event) {
      const point = eventPoint(event);
      structuralPointerNdc.set(point.x * 2 - 1, 1 - point.y * 2);
      camera.updateMatrixWorld(true);
      world.updateMatrixWorld(true);
      structuralRaycaster.setFromCamera(structuralPointerNdc, camera);
      const hit = structuralRaycaster
        .intersectObjects(world.children, false)
        .find(intersection => intersection.object.userData.structuralPick);
      if (!hit) return null;
      const structuralPick = hit.object.userData.structuralPick;
      const displayPoint = displayedStructuralPointFromWorld(hit.point);
      let segmentT = null;
      if (structuralPick.kind === 'bond') {
        const bond = material.bonds.find(candidate => candidate.id === structuralPick.id);
        const nodeById = new Map(material.nodes.map(node => [node.id, node]));
        const a = worldPoint(nodeById.get(bond.a));
        const b = worldPoint(nodeById.get(bond.b));
        const localHit = world.worldToLocal(hit.point.clone());
        const segment = b.clone().sub(a);
        segmentT = segment.lengthSq() > 0
          ? Math.max(0, Math.min(1, localHit.clone().sub(a).dot(segment) / segment.lengthSq()))
          : 0.5;
      }
      const contact = resolveLayeredStructuralRestContact(material, {
        ...structuralPick,
        displayPoint,
        segmentT,
      });
      return {
        ...contact,
        distance: hit.distance,
      };
    }

    function projectedStructuralPickTargets() {
      camera.updateMatrixWorld(true);
      world.updateMatrixWorld(true);
      const rect = renderer.domElement.getBoundingClientRect();
      const candidates = world.children
        .filter(child => child.userData.structuralPick?.kind === 'node')
        .map(child => {
          const node = material.nodes.find(candidate => candidate.id === child.userData.structuralPick.id);
          const worldPosition = child.getWorldPosition(new THREE.Vector3());
          const projected = worldPosition.clone().project(camera);
          return {
            kind: child.userData.structuralPick.kind,
            id: child.userData.structuralPick.id,
            restPoint: { x: node.x, y: node.y, z: node.z },
            displayPoint: {
              x: node.x + node.displacement.x,
              y: node.y + node.displacement.y,
              z: node.z + node.displacement.z,
            },
            displacementMagnitude: Math.hypot(
              node.displacement.x,
              node.displacement.y,
              node.displacement.z,
            ),
            clientX: rect.left + (projected.x + 1) * 0.5 * rect.width,
            clientY: rect.top + (1 - projected.y) * 0.5 * rect.height,
            ndc: { x: projected.x, y: projected.y, z: projected.z },
            centerDistance: Math.hypot(projected.x, projected.y),
          };
        })
        .filter(candidate => Math.abs(candidate.ndc.x) < 0.82 && Math.abs(candidate.ndc.y) < 0.82 && candidate.ndc.z > -1 && candidate.ndc.z < 1)
        .sort((a, b) => a.centerDistance - b.centerDistance);
      return candidates;
    }

    function requestGpuSympatheticTear(sourceState, interaction, { applyToWorld = true } = {}) {
      const requestEpoch = gpuTearRequestGate.begin();
      const operationId = latestGpuOperationTracker.begin('tear', {
        requestedRoute: STRUCTURAL_MATERIAL_3D_WEBGPU_TEAR_ROUTE,
        requestedExecutionRoute: applyToWorld
          ? STRUCTURAL_MATERIAL_3D_WEBGPU_HOT_SIDECAR_ROUTE
          : STRUCTURAL_MATERIAL_3D_WEBGPU_RETAINED_ROUTE,
      });
      const operation = async () => {
        if (!gpuTearRequestGate.accepts(requestEpoch)) {
          gpuTearDiscardedCount += 1;
          return buildLayeredStructuralHotSympatheticTearFailureReceipt(
            new Error('structural interaction invalidated before execution'),
            'request-invalidated-before-execution',
            applyToWorld
              ? STRUCTURAL_MATERIAL_3D_WEBGPU_HOT_SIDECAR_ROUTE
              : STRUCTURAL_MATERIAL_3D_WEBGPU_RETAINED_ROUTE,
          );
        }
        const effectiveSourceState = applyToWorld ? material : sourceState;
        const execution = applyToWorld
          ? ensureHotSidecar(effectiveSourceState)
            .then(sidecar => sidecar.execute(interaction))
            .then(receipt => buildLayeredStructuralHotSympatheticTearReceipt(effectiveSourceState, receipt))
          : runLayeredStructuralSympatheticTearWebGpu({
            state: effectiveSourceState,
            interactions: [interaction],
          });
        const receipt = await execution.catch(error =>
          buildLayeredStructuralHotSympatheticTearFailureReceipt(
            error,
            applyToWorld ? 'hot-sidecar-initialization-or-execution' : 'cold-validation-execution',
            applyToWorld
              ? STRUCTURAL_MATERIAL_3D_WEBGPU_HOT_SIDECAR_ROUTE
              : STRUCTURAL_MATERIAL_3D_WEBGPU_RETAINED_ROUTE,
          ));
        if (gpuTearPostExecutionWitnessHold) {
          const hold = gpuTearPostExecutionWitnessHold;
          hold.reached = true;
          await hold.releasePromise;
          if (gpuTearPostExecutionWitnessHold === hold) gpuTearPostExecutionWitnessHold = null;
        }
        if (!gpuTearRequestGate.accepts(requestEpoch)) {
          gpuTearDiscardedCount += 1;
          return {
            ...buildLayeredStructuralHotSympatheticTearFailureReceipt(
              new Error('structural interaction invalidated after GPU execution'),
              'request-invalidated-after-execution',
              applyToWorld
                ? STRUCTURAL_MATERIAL_3D_WEBGPU_HOT_SIDECAR_ROUTE
                : STRUCTURAL_MATERIAL_3D_WEBGPU_RETAINED_ROUTE,
            ),
            discardedExecution: {
              status: receipt.status,
              effectiveRoute: receipt.effectiveRoute,
              executionRoute: receipt.executionRoute,
              objectIdentity: receipt.objectIdentity,
              eventEpoch: receipt.eventEpoch,
              timingsMs: receipt.timingsMs ? { ...receipt.timingsMs } : null,
            },
          };
        }
        gpuTearReceipt = receipt;
        if (applyToWorld && receipt.status === 'passed') {
          let nextMaterial;
          runStructuralMutation('gpu-sympathetic-tear', () => {
            nextMaterial = buildLayeredStructuralGpuTearMaterial(effectiveSourceState, receipt, interaction);
            material = nextMaterial;
            gpuBindingReceipt = null;
          });
          routeStructuralHaptics(effectiveSourceState, nextMaterial, receipt, interaction);
          gpuTearAppliedCount += 1;
          gpuTearPreviousAppliedReceipt = gpuTearLatestAppliedReceipt;
          gpuTearLatestAppliedReceipt = receipt;
        } else {
          updateReadout();
          renderScene();
        }
        return receipt;
      };
      const trackedOperation = async () => {
        let receipt;
        try {
          receipt = await operation();
        } catch (error) {
          receipt = buildLayeredStructuralHotSympatheticTearFailureReceipt(
            error,
            'unhandled-live-tear-operation',
            applyToWorld
              ? STRUCTURAL_MATERIAL_3D_WEBGPU_HOT_SIDECAR_ROUTE
              : STRUCTURAL_MATERIAL_3D_WEBGPU_RETAINED_ROUTE,
          );
          gpuTearReceipt = receipt;
        }
        latestGpuOperationTracker.settle(operationId, receipt);
        return receipt;
      };
      const promise = gpuTearOperationQueue.then(trackedOperation, trackedOperation).finally(() => {
        if (gpuTearPromise === promise) {
          gpuTearPromise = null;
          updateReadout();
          renderScene();
        }
      });
      gpuTearOperationQueue = promise.catch(() => undefined);
      gpuTearPromise = promise;
      updateReadout();
      renderScene();
      return promise;
    }

    async function countCanvasPixelsFromBlob() {
      const blob = await new Promise(resolve => renderer.domElement.toBlob(resolve, 'image/png'));
      if (!blob) return { ok: false, reason: 'canvas blob unavailable', nonDarkPixels: 0, width: 0, height: 0 };
      const bitmap = await createImageBitmap(blob);
      const sampleWidth = Math.min(96, bitmap.width);
      const sampleHeight = Math.min(96, bitmap.height);
      const canvas = new OffscreenCanvas(sampleWidth, sampleHeight);
      const context = canvas.getContext('2d');
      context.drawImage(bitmap, 0, 0, sampleWidth, sampleHeight);
      const pixels = context.getImageData(0, 0, sampleWidth, sampleHeight).data;
      let nonDarkPixels = 0;
      for (let i = 0; i < pixels.length; i += 4) {
        if (pixels[i] + pixels[i + 1] + pixels[i + 2] > 42) nonDarkPixels += 1;
      }
      return { ok: nonDarkPixels > 0, source: 'canvas-blob-pixels', nonDarkPixels, width: bitmap.width, height: bitmap.height, sampleWidth, sampleHeight };
    }

    window.__structuralMaterial3dPixelProbe = async () => {
      renderer.render(scene, camera);
      const gl = renderer.getContext?.();
      if (!gl?.readPixels) {
        return countCanvasPixelsFromBlob();
      }
      const width = gl.drawingBufferWidth;
      const height = gl.drawingBufferHeight;
      const sampleWidth = Math.min(96, width);
      const sampleHeight = Math.min(96, height);
      const pixels = new Uint8Array(sampleWidth * sampleHeight * 4);
      gl.readPixels(
        Math.floor((width - sampleWidth) * 0.5),
        Math.floor((height - sampleHeight) * 0.5),
        sampleWidth,
        sampleHeight,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        pixels,
      );
      let nonDarkPixels = 0;
      for (let i = 0; i < pixels.length; i += 4) {
        if (pixels[i] + pixels[i + 1] + pixels[i + 2] > 42) nonDarkPixels += 1;
      }
      return { ok: nonDarkPixels > 0, source: 'readPixels', nonDarkPixels, width, height, sampleWidth, sampleHeight };
    };

      });
      const reinitialize = await sidecar.reinitialize(witnessState);
      const afterReinitialize = await sidecar.execute(scenario.force);
      const beforeDispose = sidecar.snapshot();
      const dispose = await sidecar.dispose();
      const disposeAgain = await sidecar.dispose();
      return {
        schema: 'kaminos.structural-material.webgpu-hot-sidecar-page-witness.v0',
        coldInitialization: {
          timingsMs: sidecar.coldTimingsMs,
          lifecycle: sidecar.initializationLifecycle,
        },
        first,
        second,
        reinitialize,
        afterReinitialize,
        beforeDispose,
        dispose,
        disposeAgain,
        warmReuse: first.lifecycle.deviceRequestCount === 1 &&
          second.lifecycle.deviceRequestCount === 1 &&
          first.lifecycle.pipelineCreateCount === 3 &&
          second.lifecycle.pipelineCreateCount === 3 &&
          first.lifecycle.bufferAllocationCount === 9 &&
          second.lifecycle.bufferAllocationCount === 9,
        disposeIdempotent: JSON.stringify(dispose) === JSON.stringify(disposeAgain),
      };
    };

    window.__structuralMaterial3dRunGpuContactLocalityWitness = async () => {
      const runContact = async point => {
        const state = createLayeredStructuralMaterial({ columns: 9, rows: 5, layers: 4, notch: true });
        const contactNode = state.nodes.reduce((nearest, node) => {
          const distance = Math.hypot(node.x - point.x, node.y - point.y, node.z - point.z);
          return !nearest || distance < nearest.distance ? { node, distance } : nearest;
        }, null).node;
        const interaction = {
          kind: 'picked-contact-locality-witness',
          gestureId: `contact-locality-${contactNode.id}`,
          point,
          displayPoint: point,
          contactIdentity: {
            authority: 'stable-rest-material-contact-v0',
            kind: 'node',
            id: contactNode.id,
            segmentT: null,
          },
          vector: { x: 1, y: 0.08, z: -0.64 },
          magnitude: 1.46,
          radius: 0.18,
        };
        const sidecar = await createLayeredStructuralHotWebGpuSidecar({ state });
        const receipt = await sidecar.execute(interaction);
        const tearReceipt = buildLayeredStructuralHotSympatheticTearReceipt(state, receipt);
        const responseMaterial = tearReceipt.status === 'passed'
          ? buildLayeredStructuralGpuTearMaterial(state, tearReceipt, interaction)
          : null;
        const brokenBondIndices = receipt.gpuStructuralState?.finalBondLiveness?.flatMap(
          (alive, index) => alive ? [] : [index],
        ) || [];
        const breakCentroid = brokenBondIndices.length > 0
          ? brokenBondIndices.reduce((centroid, index) => {
              const midpoint = state.bonds[index].midpoint;
              centroid.x += midpoint.x / brokenBondIndices.length;
              centroid.y += midpoint.y / brokenBondIndices.length;
              centroid.z += midpoint.z / brokenBondIndices.length;
              return centroid;
            }, { x: 0, y: 0, z: 0 })
          : null;
        let responseWeight = 0;
        const responseCentroid = responseMaterial?.nodes.reduce((centroid, node) => {
          const weight = Math.hypot(node.displacement.x, node.displacement.y, node.displacement.z);
          responseWeight += weight;
          centroid.x += node.x * weight;
          centroid.y += node.y * weight;
          centroid.z += node.z * weight;
          return centroid;
        }, { x: 0, y: 0, z: 0 }) || null;
        const visibleResponse = responseMaterial ? {
          authority: responseMaterial.sympatheticTear.contactResponse.authority,
          contactIdentity: responseMaterial.sympatheticTear.contactResponse.contactIdentity,
          primaryContactComponentLabel:
            responseMaterial.sympatheticTear.contactResponse.primaryContactComponentLabel,
          localResponseNodeCount:
            responseMaterial.sympatheticTear.contactResponse.localResponseNodeCount,
          responseCentroid: responseWeight > 0 ? {
            x: responseCentroid.x / responseWeight,
            y: responseCentroid.y / responseWeight,
            z: responseCentroid.z / responseWeight,
          } : null,
          maxPinnedDisplacement: Math.max(...responseMaterial.nodes
            .filter(node => node.pinned)
            .map(node => Math.hypot(node.displacement.x, node.displacement.y, node.displacement.z))),
          movedNodeCount: responseMaterial.nodes.filter(node => Math.hypot(
            node.displacement.x,
            node.displacement.y,
            node.displacement.z,
          ) > 0).length,
        } : null;
        const dispose = await sidecar.dispose();
        return {
          requestedExecutionRoute: STRUCTURAL_MATERIAL_3D_WEBGPU_HOT_SIDECAR_ROUTE,
          effectiveExecutionRoute: receipt.effectiveRoute,
          requestedBackend: 'webgpu',
          effectiveBackend: receipt.effectiveBackend,
          cpuFallbackUsed: receipt.cpuFallbackUsed,
          requestedInteraction: interaction,
          effectiveInteraction: receipt.interaction,
          objectIdentity: receipt.objectIdentity,
          eventEpoch: receipt.eventEpoch,
          brokenBondIndices,
          breakCentroid,
          visibleResponse,
          status: receipt.status,
          failurePhase: receipt.failurePhase,
          compactValidation: receipt.compactValidation,
          lifecycle: receipt.lifecycle,
          timingsMs: receipt.timingsMs,
          dispose,
        };
      };
      const left = await runContact({ x: 0.18, y: 0.24, z: 0.5 });
      const right = await runContact({ x: 0.88, y: 0.24, z: 0.5 });
      const passed = left.status === 'passed' && right.status === 'passed' &&
        left.effectiveExecutionRoute === STRUCTURAL_MATERIAL_3D_WEBGPU_HOT_SIDECAR_ROUTE &&
        right.effectiveExecutionRoute === STRUCTURAL_MATERIAL_3D_WEBGPU_HOT_SIDECAR_ROUTE &&
        left.effectiveBackend === 'webgpu' && right.effectiveBackend === 'webgpu' &&
        left.cpuFallbackUsed === false && right.cpuFallbackUsed === false &&
        left.brokenBondIndices.length > 0 && right.brokenBondIndices.length > 0 &&
        JSON.stringify(left.brokenBondIndices) !== JSON.stringify(right.brokenBondIndices) &&
        right.breakCentroid.x > left.breakCentroid.x + 0.12 &&
        left.visibleResponse?.movedNodeCount > 0 && right.visibleResponse?.movedNodeCount > 0 &&
        left.visibleResponse?.maxPinnedDisplacement === 0 &&
        right.visibleResponse?.maxPinnedDisplacement === 0 &&
        right.visibleResponse?.responseCentroid?.x >
          left.visibleResponse?.responseCentroid?.x + 0.3;
      return {
        schema: 'kaminos.structural-material.webgpu-contact-locality-witness.v0',
        status: passed ? 'passed' : 'failed',
        failurePhase: passed ? null : 'gpu-contact-locality',
        requestedRoute: STRUCTURAL_MATERIAL_3D_WEBGPU_HOT_SIDECAR_ROUTE,
        effectiveRoute: passed ? STRUCTURAL_MATERIAL_3D_WEBGPU_HOT_SIDECAR_ROUTE : null,
        left,
        right,
        breakCentroidDeltaX: left.breakCentroid && right.breakCentroid
          ? right.breakCentroid.x - left.breakCentroid.x
          : null,
        responseCentroidDeltaX: left.visibleResponse?.responseCentroid && right.visibleResponse?.responseCentroid
          ? right.visibleResponse.responseCentroid.x - left.visibleResponse.responseCentroid.x
          : null,
      };
    };

    window.__structuralMaterial3dRunGpuSympatheticTear = async (options = {}) => {
      const scenario = buildLayeredStructuralWitnessScenario();
      const sourceState = createLayeredStructuralMaterial({
        columns: 9,
        rows: 5,
        layers: 4,
        notch: options.notch !== false,
      });
      const interaction = options.interaction || scenario.force;
      if (options.applyToWorld !== false) {
        runStructuralMutation('gpu-sympathetic-tear-force', () => {
          forceEnvelope = {
            ...interaction,
            authority: 'screen-space-drag-to-layered-force-envelope-v0',
            start: interaction.start || {
              x: Math.max(0, interaction.point.x - 0.38),
              y: interaction.point.y,
              z: 0.5,
            },
            dragLength: interaction.dragLength || 0.5,
          };
          lastPoint = interaction.point;
        });
      }
      return requestGpuSympatheticTear(sourceState, interaction, {
        applyToWorld: options.applyToWorld !== false,
      });
    };

    window.__structuralMaterial3dRunGpuBinding = async (binding = null) => {
      liveDragScheduler.invalidate();
      gpuTearRequestGate.invalidate();
      const summary = summarizeLayeredStructuralState(material);
      const point = binding?.point ||
        summary.crackPath.find(edge => edge.bondKind === 'depth')?.midpoint ||
        lastPoint;
      return requestGpuBinding({
        point,
        radius: binding?.radius ?? 0.22,
        strength: binding?.strength ?? 1.25,
      });
    };

    window.__structuralMaterial3dRunGpuBindingRollbackWitness = async () => {
      const scenario = buildLayeredStructuralWitnessScenario();
      const witnessState = createLayeredStructuralMaterial({ columns: 9, rows: 5, layers: 4, notch: true });
      let bindingValidationCount = 0;
      const sidecar = await createLayeredStructuralHotWebGpuSidecar({
        state: witnessState,
        bindingReceiptValidator(sourceState, receipt) {
          const validation = validateLayeredStructuralHotBindingReceipt(sourceState, receipt);
          bindingValidationCount += 1;
          return bindingValidationCount === 1
            ? { ...validation, ok: false, reasons: [...validation.reasons, 'injected-post-dispatch-rejection'] }
            : validation;
        },
      });
      const fractured = await sidecar.execute(scenario.force);
      if (fractured.status !== 'passed') {
        await sidecar.dispose();
        throw new Error(`rollback witness fracture failed: ${fractured.failurePhase}`);
      }
      const point = scenario.summaries.cracked.crackPath
        .find(edge => edge.bondKind === 'depth')?.midpoint || scenario.force.point;
      const binding = { point, radius: 0.22, strength: 1.25 };
      const rejected = await sidecar.bind(binding);
      const expectedRepairEventCount = rejected.binding?.eventCount || 0;
      const recovered = await sidecar.bind(binding);
      const beforeDispose = sidecar.snapshot();
      const dispose = await sidecar.dispose();
      const passed = rejected.status === 'failed' &&
        rejected.failurePhase === 'compact-binding-receipt-validation' &&
        expectedRepairEventCount > 0 &&
        recovered.status === 'passed' &&
        recovered.binding?.eventCount === expectedRepairEventCount &&
        recovered.lifecycle?.rollbackCount === 1 &&
        recovered.lifecycle?.rollbackFailureCount === 0 &&
        recovered.lifecycle?.residentStateTrusted === true &&
        dispose.status === 'passed';
      return {
        schema: 'kaminos.structural-material.webgpu-binding-rollback-witness.v0',
        status: passed ? 'passed' : 'failed',
        expectedRepairEventCount,
        fractured,
        rejected,
        recovered,
        beforeDispose,
        dispose,
      };
    };

    window.addEventListener('pagehide', () => {
      if (gpuHotSidecar) void gpuHotSidecar.dispose();
    });

    window.addEventListener('resize', resize);
    resize();
    render();
  </script>
</body>
