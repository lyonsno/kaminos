<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaminos Low-Grid Oracle Matrix</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #07090a; color: #e9eef0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #07090a; }
    #app { display: grid; grid-template-rows: auto minmax(0, 1fr) 150px; height: 100vh; }
    #toolbar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; min-height: 58px; padding: 10px 14px; border-bottom: 1px solid #283238; background: #101416; }
    .control { display: grid; grid-template-columns: auto minmax(72px, 140px); gap: 7px; align-items: center; font-size: 12px; color: #b8c3c7; }
    select, input, button { min-height: 30px; border: 1px solid #39464c; border-radius: 4px; background: #171d20; color: #eff7f8; font: inherit; }
    input[type="range"] { width: 126px; accent-color: #69d7ed; }
    button { padding: 0 11px; cursor: pointer; }
    #views { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
    .viewport { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #000; }
    .viewport + .viewport { border-left: 1px solid #283238; }
    .viewport canvas { width: 100%; height: 100%; display: block; }
    .label { position: absolute; z-index: 3; top: 10px; left: 10px; max-width: calc(100% - 20px); padding: 6px 8px; border: 1px solid rgba(170, 205, 216, 0.24); background: rgba(3, 7, 9, 0.76); color: #e4f2f5; font: 11px/1.4 "SF Mono", Menlo, monospace; pointer-events: none; }
    #status { margin: 0; overflow: auto; padding: 10px 14px; border-top: 1px solid #283238; background: #0c1012; color: #aebdc2; font: 10px/1.4 "SF Mono", Menlo, monospace; white-space: pre-wrap; }
    @media (max-width: 820px) { #app { grid-template-rows: auto minmax(0, 1fr) 170px; } #views { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } .viewport + .viewport { border-left: 0; border-top: 1px solid #283238; } }
  </style>
  <script type="importmap">
  { "imports": { "three": "./lib/three.webgpu.js", "three/webgpu": "./lib/three.webgpu.js", "three/tsl": "./lib/three.tsl.js" } }
  </script>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <label class="control">Receiver grid <select id="low-grid"></select></label>
      <label class="control">Oracle grid <select id="high-grid"></select></label>
      <label class="control">Treatment <select id="source-mode"></select></label>
      <label class="control">Cue cadence <select id="cadence"><option value="1">every frame</option><option value="2">2 frames</option><option value="4">4 frames</option><option value="8">8 frames</option></select></label>
      <label class="control">Vorticity <input id="vorticity" type="range" min="0" max="1.2" step="0.01"></label>
      <label class="control">Curl noise <input id="curl-noise" type="range" min="0" max="1.2" step="0.01"></label>
      <label class="control">Material <input id="material" type="range" min="0" max="1.2" step="0.01"></label>
      <button id="restart" type="button">Restart</button>
    </div>
    <main id="views">
      <section class="viewport" id="low-view"><div class="label" id="low-label"></div></section>
      <section class="viewport" id="high-view"><div class="label" id="high-label"></div></section>
    </main>
    <pre id="status">Starting...</pre>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { createKaminosVolumePrototype } from './volume-core.js?v=low-grid-oracle-matrix-0713';

    const routeIdentity = 'continuous-low-grid-oracle-splat-matrix-v0';
    const expectedSplatRendererIdentity = 'live-boundary-sidecar-learned-attribute-splats-v0';
    const playbackAuthority = 'consecutive-sim-steps-fixed-playback-v0';
    const lowGridOptions = [48, 64, 96];
    const highGridOptions = [128, 160];
    const sourceModes = ['none', 'lowSelf', 'highProjected'];
    const routeBySourceMode = {
      none: 'untouched_low',
      lowSelf: 'low_self',
      highProjected: 'high_projected_oracle',
    };
    const authorityBySourceMode = {
      none: 'procedural-receiver-activity-proxy-no-truth-v0',
      lowSelf: 'live-low-self-current-field-scalar-activity-cue-v0',
      highProjected: 'live-high-projected-current-field-scalar-activity-cue-v0',
    };
    const params = new URLSearchParams(location.search);
    const startControlled = params.get('controlled') === '1';
    const byId = id => document.getElementById(id);
    const controls = {
      lowGrid: byId('low-grid'), highGrid: byId('high-grid'), sourceMode: byId('source-mode'), cadence: byId('cadence'),
      vorticity: byId('vorticity'), curlNoise: byId('curl-noise'), material: byId('material'),
    };
    const fillOptions = (node, values, selected) => {
      node.replaceChildren(...values.map(value => {
        const option = document.createElement('option');
        option.value = String(value);
        option.textContent = String(value);
        option.selected = String(value) === String(selected);
        return option;
      }));
    };
    fillOptions(controls.lowGrid, lowGridOptions, params.get('low_grid') || 64);
    fillOptions(controls.highGrid, highGridOptions, params.get('high_grid') || 128);
    fillOptions(controls.sourceMode, sourceModes, params.get('source_mode') || 'none');
    controls.cadence.value = params.get('cadence') || '1';
    controls.vorticity.value = params.get('vorticity') || '0.20';
    controls.curlNoise.value = params.get('curl_noise') || '0.00';
    controls.material.value = params.get('material') || '0.00';
    const numberValue = (node, fallback) => Number.isFinite(Number(node.value)) ? Number(node.value) : fallback;

    function volumeControls(resolution, receiver) {
      return {
        volumeScene: 'tall_plume', resolution, majorantGrid: resolution >= 96 ? 48 : 32,
        renderScale: 0.72, raySteps: 88, adaptiveRays: 1, occupancySkip: 1, majorantSkip: 0,
        majorantSmooth: 1, majorantGuard: 1, temporalAccum: 0, temporalJitter: 0, historyClamp: 0,
        density: 6, fire: 0, radiance: 0, absorption: 0.75, glow: 0, smoke: 2.8,
        curl: 4, microdetail: 1.7, interfaceShred: 3.2, fireLicks: 2.15, projection: 1.5, speed: 4.4,
        inputRadius: 0.19, flowRate: 0.85, fireScale: 0.95, detailScale: 0.45, plumeHeight: 0.9,
        windStrength: 0, windAngle: -65, windHeight: -0.8, pressureMode: 'global-p3', pressureStrategy: 'global', pressureIterations: 3,
        runtimeQualityRequested: 'live_high', runtimeQualityEffective: 'live_high', runtimeQualityReason: 'low-grid-oracle-matrix', gpuPressure: 0,
        reactionLiveView: 'boundary_fire', fireRenderMode: 'inspect', shellInspectMode: 'boundary_fire',
        boundarySidecarSource: 'baked', boundarySidecarView: 'off', boundarySplatMode: 'learned',
        boundarySplatRadius: 1, boundarySplatSharpness: 3.4, boundarySplatFeatureCapture: false,
        oracleActivityCue: receiver ? 1 : 0, oracleActivityDisplay: 0,
        oracleActivityCurlNoise: receiver ? numberValue(controls.curlNoise, 0) : 0,
        oracleActivityVorticity: receiver ? numberValue(controls.vorticity, 0.2) : 0,
        oracleActivityMaterial: receiver ? numberValue(controls.material, 0) : 0,
        flowDebug: 0, gridOverlay: 0,
      };
    }

    function createCamera(view) {
      const camera = new THREE.PerspectiveCamera(45, Math.max(0.1, view.clientWidth / Math.max(1, view.clientHeight)), 0.01, 100);
      camera.position.set(0, 0.2, 4.1);
      camera.lookAt(0, 0.15, 0);
      return camera;
    }

    function makePrototype(name, view, initialControls) {
      const camera = createCamera(view);
      const record = { name, view, camera, controls: initialControls, prototype: null };
      record.prototype = createKaminosVolumePrototype({ THREE, viewport: view, camera, controls: null, getControls: () => record.controls, onStatus: () => {} });
      record.prototype.canvasElement().dataset.oracleMatrixRole = name;
      return record;
    }

    let low = null;
    let high = null;
    let raf = 0;
    let cueInFlight = false;
    const state = {
      routeIdentity, expectedSplatRendererIdentity, playbackAuthority, status: 'starting', failurePhase: null, error: null,
      sourceMode: controls.sourceMode.value, routeControlIdentity: routeBySourceMode[controls.sourceMode.value],
      lowGrid: Number(controls.lowGrid.value), highGrid: Number(controls.highGrid.value),
      cueAuthority: authorityBySourceMode[controls.sourceMode.value], cueUpdateCount: 0, droppedCueCount: 0,
      lastCueExport: null, lastReceiverState: null, lastCueReceiverStep: null, maxCueAgeFrames: 0,
      firstSourceSimStep: null, firstReceiverSimStep: null, sourceSimStepAdvance: 0, receiverSimStepAdvance: 0,
      projectionIdentity: 'max-source-cell-to-target-grid-v0', cueTemporalMode: 'consecutive-live-source-export-v0',
      effectiveBoundarySplatRendererIdentity: null, boundarySplatAttributeModelIdentity: null,
      controlledMode: startControlled, controlledStepCount: 0,
    };

    function syncPrototypeControls() {
      if (!low || !high) return;
      const mode = controls.sourceMode.value;
      low.controls = volumeControls(Number(controls.lowGrid.value), mode !== 'none');
      high.controls = volumeControls(Number(controls.highGrid.value), false);
      low.prototype.setControls(low.controls);
      high.prototype.setControls(high.controls);
      state.sourceMode = mode;
      state.routeControlIdentity = routeBySourceMode[mode];
      state.lowGrid = low.controls.resolution;
      state.highGrid = high.controls.resolution;
      state.cueAuthority = authorityBySourceMode[mode];
    }

    function clearCue() {
      state.lastReceiverState = low?.prototype.setTruthOracleActivityCue({
        values: [], grid: state.lowGrid, cueAuthority: authorityBySourceMode.none, frameId: 'untouched-low-cleared',
      });
    }

    async function updateCue() {
      if (!low || !high || cueInFlight || state.status === 'failed') return;
      const lowState = low.prototype.debugState();
      const highState = high.prototype.debugState();
      const source = state.sourceMode === 'lowSelf' ? low : high;
      const sourceState = state.sourceMode === 'lowSelf' ? lowState : highState;
      state.firstReceiverSimStep ??= lowState.simStepCount;
      state.firstSourceSimStep ??= sourceState.simStepCount;
      state.receiverSimStepAdvance = Math.max(0, lowState.simStepCount - state.firstReceiverSimStep);
      state.sourceSimStepAdvance = Math.max(0, sourceState.simStepCount - state.firstSourceSimStep);
      if (state.lastCueReceiverStep != null) state.maxCueAgeFrames = Math.max(state.maxCueAgeFrames, lowState.simStepCount - state.lastCueReceiverStep);
      if (state.sourceMode === 'none') return;
      const cadence = Math.max(1, numberValue(controls.cadence, 1));
      if ((lowState.frameCount % cadence) !== 0) return;
      cueInFlight = true;
      try {
        const receipt = await source.prototype.exportCurrentScalarActivityCue({ targetGrid: state.lowGrid, cueFloor: 0.10, cueGamma: 1.25 });
        if (!receipt?.ok) throw new Error(`${receipt?.failurePhase || 'cue-export'}: ${receipt?.reason || 'unknown cue export failure'}`);
        const frameId = `${state.sourceMode}-${receipt.frameId}-to-${state.lowGrid}`;
        state.lastReceiverState = low.prototype.setTruthOracleActivityCue({ values: receipt.values, grid: receipt.targetGrid, cueAuthority: state.cueAuthority, frameId });
        state.lastCueExport = { ...receipt, values: undefined };
        state.lastCueReceiverStep = low.prototype.debugState().simStepCount;
        state.cueUpdateCount += 1;
        state.projectionIdentity = receipt.projectionIdentity;
        state.cueTemporalMode = receipt.cueTemporalMode;
      } catch (error) {
        state.status = 'failed';
        state.failurePhase = 'live-cue-export-or-upload';
        state.error = error?.message || String(error);
      } finally {
        cueInFlight = false;
      }
    }

    function validateRoutes() {
      const lowState = low?.prototype.debugState();
      const highState = high?.prototype.debugState();
      if (!lowState || !highState) return;
      state.effectiveBoundarySplatRendererIdentity = lowState.boundarySplatRendererIdentity;
      state.boundarySplatAttributeModelIdentity = lowState.boundarySplatAttributeModelIdentity;
      if (lowState.backend === 'inactive' || highState.backend === 'inactive') return;
      if (lowState.boundarySplatRendererIdentity !== expectedSplatRendererIdentity || highState.boundarySplatRendererIdentity !== expectedSplatRendererIdentity) {
        state.status = 'failed'; state.failurePhase = 'effective-splat-route'; state.error = `expected ${expectedSplatRendererIdentity}`;
      }
      if (!lowState.boundarySplatAttributeModelIdentity || !highState.boundarySplatAttributeModelIdentity) {
        state.status = 'failed'; state.failurePhase = 'effective-splat-model'; state.error = 'missing learned splat model identity';
      }
    }

    function renderReadout() {
      const lowState = low?.prototype.debugState() || null;
      const highState = high?.prototype.debugState() || null;
      byId('low-label').textContent = `${state.routeControlIdentity} | ${state.lowGrid}^3 | learned splats | ${state.cueAuthority}`;
      byId('high-label').textContent = `high_reference | ${state.highGrid}^3 | learned splats | no injected truth`;
      byId('status').textContent = JSON.stringify({
        routeIdentity, status: state.status, failurePhase: state.failurePhase, error: state.error,
        routeControlIdentity: state.routeControlIdentity, sourceMode: state.sourceMode, lowGrid: state.lowGrid, highGrid: state.highGrid,
        cueAuthority: state.cueAuthority, cueUpdateCount: state.cueUpdateCount, droppedCueCount: state.droppedCueCount,
        sourceSimStepAdvance: state.sourceSimStepAdvance, receiverSimStepAdvance: state.receiverSimStepAdvance, maxCueAgeFrames: state.maxCueAgeFrames,
        projectionIdentity: state.projectionIdentity, cueTemporalMode: state.cueTemporalMode,
        effectiveBoundarySplatRendererIdentity: state.effectiveBoundarySplatRendererIdentity,
        boundarySplatAttributeModelIdentity: state.boundarySplatAttributeModelIdentity,
        lowFrameCount: lowState?.frameCount, highFrameCount: highState?.frameCount,
      }, null, 2);
    }

    function loop() {
      if (!state.controlledMode) syncPrototypeControls();
      validateRoutes();
      if (!state.controlledMode) void updateCue();
      renderReadout();
      raf = requestAnimationFrame(loop);
    }

    async function exportAndUploadControlledCue() {
      if (state.sourceMode === 'none') return null;
      const source = state.sourceMode === 'lowSelf' ? low : high;
      const receipt = await source.prototype.exportCurrentScalarActivityCue({ targetGrid: state.lowGrid, cueFloor: 0.10, cueGamma: 1.25 });
      if (!receipt?.ok) throw new Error(`${receipt?.failurePhase || 'cue-export'}: ${receipt?.reason || 'unknown cue export failure'}`);
      const frameId = `controlled-${state.sourceMode}-${receipt.frameId}-to-${state.lowGrid}`;
      state.lastReceiverState = low.prototype.setTruthOracleActivityCue({ values: receipt.values, grid: receipt.targetGrid, cueAuthority: state.cueAuthority, frameId });
      state.lastCueExport = { ...receipt, values: undefined };
      state.lastCueReceiverStep = low.prototype.debugState().simStepCount;
      state.cueUpdateCount += 1;
      state.projectionIdentity = receipt.projectionIdentity;
      state.cueTemporalMode = receipt.cueTemporalMode;
      return state.lastCueExport;
    }

    async function controlledStep({ frameIndex = 0, startNow = 0, stepDeltaMs = 80 } = {}) {
      state.controlledMode = true;
      const sessionId = `oracle-matrix-${state.sourceMode}-${state.highGrid}-to-${state.lowGrid}`;
      const advanceSim = frameIndex > 0;
      const highStep = await high.prototype.controlledStepFrame({
        controlledStepFrameIndex: frameIndex, advanceSim, sameBrowserSessionId: sessionId,
        startNow, stepDeltaMs, renderScales: [high.controls.renderScale], compactSamples: true,
        includeBoundarySplatGpuProfile: false, resumeRenderLoop: false,
      });
      if (!highStep?.ok) throw new Error(`high controlled step failed: ${highStep?.reason || 'unknown'}`);
      if (state.sourceMode === 'lowSelf') {
        await exportAndUploadControlledCue();
      } else if (state.sourceMode === 'highProjected') {
        await exportAndUploadControlledCue();
      }
      const lowStep = await low.prototype.controlledStepFrame({
        controlledStepFrameIndex: frameIndex, advanceSim, sameBrowserSessionId: sessionId,
        startNow, stepDeltaMs, renderScales: [low.controls.renderScale], compactSamples: true,
        includeBoundarySplatGpuProfile: false, resumeRenderLoop: false,
      });
      if (!lowStep?.ok) throw new Error(`low controlled step failed: ${lowStep?.reason || 'unknown'}`);
      const controlledNow = startNow + frameIndex * stepDeltaMs;
      const highCanvas = await high.prototype.renderFrozenScaleToCanvas({
        renderScale: high.controls.renderScale, now: controlledNow,
        sameStateCaptureId: `${sessionId}-high-${frameIndex}`, restoreControls: false, resumeRenderLoop: false,
      });
      const lowCanvas = await low.prototype.renderFrozenScaleToCanvas({
        renderScale: low.controls.renderScale, now: controlledNow,
        sameStateCaptureId: `${sessionId}-low-${frameIndex}`, restoreControls: false, resumeRenderLoop: false,
      });
      if (!highCanvas?.ok || !lowCanvas?.ok) throw new Error(`controlled canvas presentation failed: high=${highCanvas?.reason || highCanvas?.ok} low=${lowCanvas?.reason || lowCanvas?.ok}`);
      const lowState = low.prototype.debugState();
      const highState = high.prototype.debugState();
      state.firstReceiverSimStep ??= lowState.simStepCount;
      state.firstSourceSimStep ??= (state.sourceMode === 'lowSelf' ? lowState.simStepCount : highState.simStepCount);
      state.receiverSimStepAdvance = Math.max(0, lowState.simStepCount - state.firstReceiverSimStep);
      state.sourceSimStepAdvance = Math.max(0, (state.sourceMode === 'lowSelf' ? lowState.simStepCount : highState.simStepCount) - state.firstSourceSimStep);
      state.maxCueAgeFrames = state.lastCueReceiverStep == null ? 0 : Math.max(state.maxCueAgeFrames, lowState.simStepCount - state.lastCueReceiverStep);
      state.controlledStepCount += 1;
      renderReadout();
      return {
        ok: true,
        playbackAuthority,
        frameIndex,
        lowFrameCount: lowState.frameCount,
        highFrameCount: highState.frameCount,
        lowSimStepCount: lowState.simStepCount,
        highSimStepCount: highState.simStepCount,
        cueUpdateCount: state.cueUpdateCount,
      };
    }

    async function restart() {
      cancelAnimationFrame(raf);
      low?.prototype.dispose();
      high?.prototype.dispose();
      state.status = 'activating'; state.failurePhase = null; state.error = null; state.cueUpdateCount = 0;
      state.lastCueExport = null; state.lastCueReceiverStep = null; state.maxCueAgeFrames = 0;
      state.firstSourceSimStep = null; state.firstReceiverSimStep = null; state.sourceSimStepAdvance = 0; state.receiverSimStepAdvance = 0;
      state.controlledMode = startControlled; state.controlledStepCount = 0;
      low = makePrototype('lowReceiver', byId('low-view'), volumeControls(Number(controls.lowGrid.value), controls.sourceMode.value !== 'none'));
      high = makePrototype('highReference', byId('high-view'), volumeControls(Number(controls.highGrid.value), false));
      try {
        await Promise.all([low.prototype.setActive(true), high.prototype.setActive(true)]);
        syncPrototypeControls();
        if (controls.sourceMode.value === 'none') clearCue();
        if (startControlled) {
          const sessionId = `oracle-matrix-initial-${state.sourceMode}-${state.highGrid}-to-${state.lowGrid}`;
          await high.prototype.controlledStepFrame({ controlledStepFrameIndex: 0, advanceSim: false, sameBrowserSessionId: sessionId, startNow: 0, stepDeltaMs: 80, renderScales: [high.controls.renderScale], compactSamples: true, includeBoundarySplatGpuProfile: false, resumeRenderLoop: false });
          await low.prototype.controlledStepFrame({ controlledStepFrameIndex: 0, advanceSim: false, sameBrowserSessionId: sessionId, startNow: 0, stepDeltaMs: 80, renderScales: [low.controls.renderScale], compactSamples: true, includeBoundarySplatGpuProfile: false, resumeRenderLoop: false });
        }
        state.status = 'running';
      } catch (error) {
        state.status = 'failed'; state.failurePhase = 'prototype-activation'; state.error = error?.message || String(error);
      }
      raf = requestAnimationFrame(loop);
    }

    for (const node of Object.values(controls)) node.addEventListener('change', () => {
      if (node === controls.lowGrid || node === controls.highGrid || node === controls.sourceMode) void restart();
    });
    byId('restart').addEventListener('click', restart);
    window.__kaminosLowGridOracleMatrix = {
      routeIdentity, playbackAuthority, restart, controlledStep,
      debugState: () => ({ ...state, low: low?.prototype.debugState() || null, high: high?.prototype.debugState() || null }),
    };
    void restart();
  </script>
</body>
</html>
