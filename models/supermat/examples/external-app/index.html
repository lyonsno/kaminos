<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>SuperMat Material Studio</title>
<style>
:root{font:15px system-ui,sans-serif;color:#252a29;background:#eff1f0;color-scheme:light}
*{box-sizing:border-box;letter-spacing:0}body{margin:0}button,input{font:inherit}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:inherit;background:#fff;border:1px solid #c6ceca;border-radius:4px;min-height:38px;padding:7px 12px}
button:hover:not(:disabled){background:#e5ede8}button:disabled{opacity:.4;cursor:default}
svg{width:18px;height:18px;flex:none}a{color:#37644f}button:focus-visible,input:focus-visible{outline:2px solid #216645;outline-offset:3px}
header{height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cbd2ce;background:#fff;gap:16px}
h1{font-size:19px;margin:0}header a{font-size:13px}
main{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:calc(100dvh - 64px)}
aside{padding:24px 20px;border-right:1px solid #cbd2ce;background:#f8faf9;display:flex;flex-direction:column;gap:24px;min-width:0}
.inputs{display:flex;flex-direction:column;gap:20px}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
input[type=file]{width:100%;font-size:12px}input::file-selector-button{padding:8px;border:1px solid #b8c5bd;border-radius:4px;background:#fff;margin-right:8px}
input[type=number]{width:100%;padding:9px;border:1px solid #b8c5bd;border-radius:4px;background:white}
.actions{display:flex;gap:8px}.actions #run{flex:1;background:#235c42;color:#fff;border-color:#235c42}
.icon{width:38px;height:38px;padding:8px;flex:none}.status{font-size:13px;line-height:1.5;margin:0;overflow-wrap:anywhere}
#status{min-height:40px}#error{color:#a22b32}.file-name{font-size:13px;overflow-wrap:anywhere;color:#58655e;margin-top:10px}
.workspace{display:flex;flex-direction:column;min-width:0;padding:16px;gap:12px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;min-height:38px}
.maps{display:flex;flex-wrap:wrap;gap:4px}.maps button{font-size:13px;padding:8px 10px;border-color:transparent;background:transparent}
.maps button[aria-pressed=true]{background:#fff;border-color:#becbc2}
.view-tools{display:flex;align-items:center;gap:10px}#zoom{width:110px;accent-color:#235c42}
.picture{flex:1;position:relative;min-height:320px;background:#1f2121;overflow:hidden}
#image{display:block;position:absolute;width:100%;height:100%;touch-action:none;cursor:grab}#image:active{cursor:grabbing}
.footer{display:flex;justify-content:space-between;align-items:center;min-height:38px;color:#58655e;font-size:13px;gap:12px}
@media(max-width:760px){header{padding:0 16px}main{display:flex;flex-direction:column}aside{border-right:0;border-bottom:1px solid #cbd2ce;padding:16px;gap:16px}.inputs{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:16px}.workspace{padding:12px}.picture{flex:none;height:58dvh;min-height:300px}#status{min-height:20px}.status:empty{display:none}}
</style>
<header><h1>SuperMat Material Studio</h1><a href="https://www.npmjs.com/package/@kaminos/supermat">API guide</a></header>
<main>
  <aside>
    <div class="inputs">
      <div><label for="file">Source image</label><input id="file" type="file" accept="image/*" disabled><div id="image-name" class="file-name"></div></div>
      <div><label for="size">Map size</label><input id="size" type="number" min="64" step="64" value="512" aria-label="Map size"></div>
    </div>
    <div class="actions"><button id="run" disabled>Infer materials</button><button id="pause" class="icon" data-icon="Pause" title="Pause" aria-label="Pause" disabled></button><button id="stop" class="icon" data-icon="Square" title="Stop" aria-label="Stop" disabled></button></div>
    <div><p id="status" class="status" role="status">Starting WebGPU</p><p id="error" class="status" role="alert"></p></div>
  </aside>
  <section class="workspace" aria-label="Material maps">
    <div class="toolbar">
      <div class="maps" role="group" aria-label="Displayed map"><button data-map="input" aria-pressed="true">Image</button><button data-map="albedo" aria-pressed="false" disabled>Albedo</button><button data-map="roughness" aria-pressed="false" disabled>Roughness</button><button data-map="metallic" aria-pressed="false" disabled>Metalness</button></div>
      <div class="view-tools"><input id="zoom" type="range" min=".25" max="4" step=".05" value="1" aria-label="Zoom"><button id="fit" class="icon" data-icon="Maximize" title="Fit image" aria-label="Fit image"></button></div>
    </div>
    <div class="picture"><canvas id="image" aria-label="Selected material map"></canvas></div>
    <div class="footer"><span id="dimensions"></span><button id="download" data-icon="Download" disabled>Download PNG</button></div>
  </section>
</main>
<script type="module" src="./dist/app.js"></script>
</html>
