<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperMat Materials</title>
<style>
  :root { color-scheme: dark; --bg: #111214; --panel: #1b1d21; --line: #2c2f35; --text: #e6e6e6; --dim: #9aa0a8; --accent: #e0a040; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  button, label.file { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:disabled { opacity: 0.5; cursor: default; }
  label.file input { display: none; }
  #status { color: var(--dim); flex: 1 1 240px; }
  #status.error { color: #ff7b7b; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 16px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  figure canvas { display: block; width: 100%; aspect-ratio: 1; background: #808080; }
  figcaption { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; color: var(--dim); }
  figcaption a { color: var(--accent); text-decoration: none; }
  #drop { outline: 2px dashed transparent; outline-offset: -8px; }
  #drop.over { outline-color: var(--accent); }
  #timings { padding: 0 16px 16px; color: var(--dim); font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  .toggle { display: flex; gap: 6px; align-items: center; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>SuperMat materials</h1>
  <label class="file">Choose image<input id="file" type="file" accept="image/*"></label>
  <button id="run" disabled>Infer materials</button>
  <button id="pause" disabled>Pause</button>
  <button id="stop" disabled>Stop</button>
  <label class="toggle"><input id="cooperative" type="checkbox" checked>Cooperative</label>
  <label class="toggle"><input id="mask" type="checkbox" checked>Hide background</label>
  <span id="status">Loading…</span>
</header>
<main id="drop">
  <figure><canvas id="scene" width="512" height="512"></canvas><figcaption>Live scene (same GPU device)</figcaption></figure>
  <figure><canvas id="input" width="512" height="512"></canvas><figcaption>Input</figcaption></figure>
  <figure><canvas id="albedo" width="512" height="512"></canvas><figcaption>Albedo <a id="albedo-link" download="albedo.png" hidden>PNG</a></figcaption></figure>
  <figure><canvas id="roughness" width="512" height="512"></canvas><figcaption>Roughness <a id="roughness-link" download="roughness.png" hidden>PNG</a></figcaption></figure>
  <figure><canvas id="metallic" width="512" height="512"></canvas><figcaption>Metallic <a id="metallic-link" download="metallic.png" hidden>PNG</a></figcaption></figure>
</main>
<div id="timings"></div>
<script type="module" src="./supermat-demo.js"></script>
</body>
</html>
