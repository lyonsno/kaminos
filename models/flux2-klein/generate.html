<!doctype html>
<meta charset="utf-8">
<title>Klein text-to-image</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --line: #d9d6cf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe7; --muted: #9a988f; --line: #33322f; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 14px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 70px; font: inherit; padding: 10px; background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, select, button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; }
  button { cursor: pointer; } button:disabled { opacity: 0.5; cursor: default; }
  canvas { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  #status { color: var(--muted); font-variant-numeric: tabular-nums; white-space: pre-wrap; }
</style>
<main>
  <h1 style="margin:0;font-size:20px">FLUX.2 Klein in the browser</h1>
  <textarea id="prompt">A small brass toy steam locomotive, isolated on a plain white background, studio product photo</textarea>
  <div class="row">
    <label>Seed <input id="seed" type="number" value="7006" style="width:8em"></label>
    <label>Size <select id="size"><option>512</option><option>768</option><option>1024</option></select></label>
    <button id="go" disabled>Loading weights…</button>
  </div>
  <div id="status"></div>
  <canvas id="out" width="512" height="512"></canvas>
</main>
<script type="module">
import { KleinPipeline } from './klein-pipeline.js';
const q = new URLSearchParams(location.search);
const urls = { textEncoderUrl: q.get('te') ?? '/te', transformerUrl: q.get('dit') ?? '/dit', vaeUrl: q.get('vae') ?? '/vae',
  gemmVersion: Number(q.get('gemm') ?? 2), sharedType: q.get('shared') ?? 'f16' };
const status = document.getElementById('status'), go = document.getElementById('go');
let pipeline;
async function init() {
  const adapter = await navigator.gpu?.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter?.features.has('shader-f16')) throw new Error('WebGPU with shader-f16 is required');
  const device = await adapter.requestDevice({ requiredFeatures: ['shader-f16'], requiredLimits: {
    maxBufferSize: adapter.limits.maxBufferSize, maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
    maxStorageBuffersPerShaderStage: adapter.limits.maxStorageBuffersPerShaderStage } });
  pipeline = new KleinPipeline(device, urls);
  await pipeline.load((part, name) => { status.textContent = `Loading ${part} ${name}…`; });
  const gb = Object.values(pipeline.residentBytes).reduce((a, b) => a + b, 0) / 1e9;
  status.textContent = `Weights loaded in ${(pipeline.timings.loadMs / 1000).toFixed(1)} s (${gb.toFixed(2)} GB resident)`;
  go.disabled = false; go.textContent = 'Generate';
  return pipeline;
}
async function generate({ prompt, seed, size }) {
  const r = await pipeline.generate({ prompt, seed, width: size, height: size,
    onStep: (i, n) => { status.textContent = `Step ${i}/${n}…`; } });
  const canvas = document.getElementById('out'); canvas.width = r.width; canvas.height = r.height;
  canvas.getContext('2d').putImageData(new ImageData(r.rgba, r.width, r.height), 0, 0);
  const t = r.timings;
  status.textContent = `${(t.totalMs / 1000).toFixed(2)} s: text ${(t.textEncodeMs / 1000).toFixed(2)} s, ` +
    `steps ${t.stepMs.map(x => (x / 1000).toFixed(2)).join(' / ')} s, decode ${(t.vaeDecodeMs / 1000).toFixed(2)} s`;
  return r;
}
window.kleinReady = init().then(() => true, e => { status.textContent = String(e); throw e; });
go.onclick = async () => {
  go.disabled = true;
  try { await generate({ prompt: document.getElementById('prompt').value, seed: Number(document.getElementById('seed').value), size: Number(document.getElementById('size').value) }); }
  catch (e) { status.textContent = String(e); }
  go.disabled = false;
};
// Headless batch entry point: returns PNG base64 per job plus timings.
window.kleinBatch = async jobs => {
  await window.kleinReady;
  const results = [];
  for (const job of jobs) {
    const r = await generate(job);
    const canvas = new OffscreenCanvas(r.width, r.height);
    canvas.getContext('2d').putImageData(new ImageData(r.rgba, r.width, r.height), 0, 0);
    const bytes = new Uint8Array(await (await canvas.convertToBlob({ type: 'image/png' })).arrayBuffer());
    let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    results.push({ name: job.name, seed: job.seed, size: job.size, promptTokens: r.promptTokens, timings: r.timings, png: btoa(bin) });
  }
  return { results, residentBytes: pipeline.residentBytes, loadMs: pipeline.timings.loadMs, kernels: pipeline.kernels };
};
window.kleinPageReady = true;
</script>
