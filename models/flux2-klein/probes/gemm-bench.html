<!doctype html>
<meta charset="utf-8">
<title>Klein GEMM bench</title>
<pre id="log"></pre>
<script type="module">
// Times the product GEMM kernels on the Klein transformer's linear shapes at 512² (int4, group 128),
// one dispatch per submit with GPU timestamps, and projects the linear-layer time of one denoising
// step as sum(count * median). Each kernel's output is compared with GEMM v2's on the same inputs.
import { gemmShaderV2, gemmShaderV3 } from '../klein-kernels.js';

const q = new URLSearchParams(location.search);
const reps = Number(q.get('reps') ?? 7), warmup = Number(q.get('warmup') ?? 2), group = Number(q.get('group') ?? 128);
const log = text => { document.getElementById('log').textContent += text + '\n'; };
// [name, count per 512² step, M, N, K]
const SHAPES = [
  ['double.img.qkv', 5, 1024, 9216, 3072], ['double.img.to_out', 5, 1024, 3072, 3072],
  ['double.img.ff_in', 5, 1024, 18432, 3072], ['double.img.ff_out', 5, 1024, 3072, 9216],
  ['double.txt.qkv', 5, 512, 9216, 3072], ['double.txt.to_out', 5, 512, 3072, 3072],
  ['double.txt.ff_in', 5, 512, 18432, 3072], ['double.txt.ff_out', 5, 512, 3072, 9216],
  ['single.qkv_mlp', 20, 1536, 27648, 3072], ['single.to_out', 20, 1536, 3072, 12288],
];
const KERNELS = (q.get('kernels') ?? 'v2,v3-4x4,v3-8x4,v3-4x8,v3-8x8').split(',');
// Kernel names: v2 | v3-<tm>x<tn>, with optional suffixes -wf16 (f16 weights instead of int4) and
// -sf32 (f32 shared tiles), so each factor can be isolated.
function kernel(name) {
  const bType = name.includes('-wf16') ? 'f16' : 'i4', sType = name.includes('-sf32') ? 'f32' : 'f16';
  if (name.startsWith('v2')) return { code: gemmShaderV2({ bType, epilogue: 'store', sType, group }), tileM: 64, tileN: 64, bType };
  const [tm, tn] = name.split('-')[1].split('x').map(Number);
  return { code: gemmShaderV3({ bType, epilogue: 'store', sType, group, tm, tn }), tileM: 16 * tm, tileN: 16 * tn, bType };
}

window.gemmBench = (async () => {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  const device = await adapter.requestDevice({ requiredFeatures: ['shader-f16', 'timestamp-query'], requiredLimits: {
    maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxBufferSize: adapter.limits.maxBufferSize,
    maxComputeWorkgroupStorageSize: adapter.limits.maxComputeWorkgroupStorageSize } });
  const rng = (() => { let s = 12345; return () => ((s = Math.imul(s ^ (s >>> 15), 2246822519) ^ Math.imul(s ^ (s >>> 13), 3266489917)) >>> 0) / 4294967296; })();
  const pipelines = Object.fromEntries(KERNELS.map(k => {
    const { code, tileM, tileN } = kernel(k);
    return [k, { pipe: device.createComputePipeline({ layout: 'auto', compute: { module: device.createShaderModule({ code }), entryPoint: 'main' } }), tileM, tileN, bType: kernel(k).bType }];
  }));
  const qs = device.createQuerySet({ type: 'timestamp', count: 2 });
  const qbuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC });
  const qread = device.createBuffer({ size: 16, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const rows = [];
  for (const [name, count, M, N, K] of SHAPES) {
    const a = new Float32Array(M * K).map(() => rng() * 2 - 1);
    const words = new Uint32Array(N * K / 8).map(() => (rng() * 4294967296) >>> 0);
    const groups = N * K / group;
    const sb = new Uint16Array(groups * 2);
    const f16 = x => { const f = new Float32Array([x]), u = new Uint32Array(f.buffer)[0]; return ((u >> 16) & 0x8000) | ((((u >> 23) & 0xff) - 112) << 10) | ((u >> 13) & 0x3ff); };
    for (let g = 0; g < groups; g++) { sb[2 * g] = f16(0.002 + rng() * 0.004); sb[2 * g + 1] = f16(-0.02 - rng() * 0.01); }
    const scaleAt = Math.ceil(words.byteLength / 256) * 256;
    const wbytes = new Uint8Array(scaleAt + sb.byteLength); wbytes.set(new Uint8Array(words.buffer)); wbytes.set(new Uint8Array(sb.buffer), scaleAt);
    const mk = (data, usage) => { const b = device.createBuffer({ size: Math.ceil(data.byteLength / 16) * 16, usage: usage | GPUBufferUsage.COPY_DST }); device.queue.writeBuffer(b, 0, data); return b; };
    const aBuf = mk(a, GPUBufferUsage.STORAGE), wBuf = mk(wbytes, GPUBufferUsage.STORAGE);
    const wf16 = KERNELS.some(k => k.includes('-wf16')) ? mk(new Uint16Array(N * K).map(() => f16(rng() * 0.04 - 0.02)), GPUBufferUsage.STORAGE) : null;
    const out = device.createBuffer({ size: M * N * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    const u = mk(new Uint32Array([M, N, K, 0x3f800000, 0, K, 0, 0, K, 0, 0, N, 0, 0, 1, scaleAt / 2, 0, 0, 0, 0]), GPUBufferUsage.UNIFORM);
    let reference = null;
    for (const k of KERNELS) {
      const { pipe, tileM, tileN, bType } = pipelines[k];
      const entries = [{ binding: 0, resource: { buffer: aBuf } }, { binding: 1, resource: { buffer: bType === 'f16' ? wf16 : wBuf } },
        { binding: 2, resource: { buffer: out } }, { binding: 3, resource: { buffer: u } }];
      if (bType !== 'f16') entries.push({ binding: 5, resource: { buffer: wBuf } });
      const bind = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries });
      const times = [];
      device.pushErrorScope('validation');
      for (let r = 0; r < warmup + reps; r++) {
        const enc = device.createCommandEncoder();
        const pass = enc.beginComputePass({ timestampWrites: { querySet: qs, beginningOfPassWriteIndex: 0, endOfPassWriteIndex: 1 } });
        pass.setPipeline(pipe); pass.setBindGroup(0, bind); pass.dispatchWorkgroups(Math.ceil(N / tileN), Math.ceil(M / tileM)); pass.end();
        enc.resolveQuerySet(qs, 0, 2, qbuf, 0); enc.copyBufferToBuffer(qbuf, 0, qread, 0, 16);
        device.queue.submit([enc.finish()]);
        await qread.mapAsync(GPUMapMode.READ);
        const t = new BigUint64Array(qread.getMappedRange().slice(0)); qread.unmap();
        if (r >= warmup) times.push(Number(t[1] - t[0]) / 1e6);
      }
      const validation = await device.popErrorScope();
      // Output check against v2 (both f16 tiles; differences are summation order).
      const read = device.createBuffer({ size: M * N * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
      const enc = device.createCommandEncoder(); enc.copyBufferToBuffer(out, 0, read, 0, M * N * 4); device.queue.submit([enc.finish()]);
      await read.mapAsync(GPUMapMode.READ); const got = new Float32Array(read.getMappedRange().slice(0)); read.unmap(); read.destroy();
      let relL2 = null;
      // Only kernels on the same weights are comparable; f16-weight rows get their own reference.
      if (bType === 'f16') { if (!window.f16ref) { window.f16ref = got; } else { let e = 0, r2 = 0; for (let i = 0; i < got.length; i += 7) { const d = got[i] - window.f16ref[i]; e += d * d; r2 += window.f16ref[i] ** 2; } relL2 = Math.sqrt(e / r2); } }
      else if (!reference) reference = got;
      else { let e = 0, r2 = 0; for (let i = 0; i < got.length; i += 7) { const d = got[i] - reference[i]; e += d * d; r2 += reference[i] * reference[i]; } relL2 = Math.sqrt(e / r2); }
      times.sort((x, y) => x - y);
      const ms = times[Math.floor(times.length / 2)];
      const row = { shape: name, count, M, N, K, kernel: k, ms, minMs: times[0], tflops: 2 * M * N * K / (ms / 1000) / 1e12, relL2VsV2: relL2,
        validationError: validation?.message ?? null };
      rows.push(row); log(JSON.stringify(row));
    }
    aBuf.destroy(); wBuf.destroy(); wf16?.destroy(); out.destroy(); u.destroy(); window.f16ref = null;
  }
  const perStep = Object.fromEntries(KERNELS.map(k => [k, rows.filter(r => r.kernel === k).reduce((s, r) => s + r.count * r.ms, 0) / 1000]));
  return { adapter: adapter.info ? { vendor: adapter.info.vendor, architecture: adapter.info.architecture, description: adapter.info.description } : null,
    limits: { maxComputeWorkgroupStorageSize: device.limits.maxComputeWorkgroupStorageSize }, group, reps, rows, linearSecondsPerStep: perStep };
})();
window.gemmBenchReady = true;
</script>
