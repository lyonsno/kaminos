<!doctype html><meta charset="utf-8"><title>Qwen hybrid kernel witness</title>
<script type="module">
import * as kernels from './kernels.js';
import { affineParams, affineDispatch, affineTiledDispatch, deltaParams, attentionParams } from './kernel-params.js';
import { createWebGpuTiledFlashAttentionShader, flashAttentionParams } from '../../webgpu-inference-kit/src/flash-attention-kernel.js';

window.qwenKernelReady = true;
window.qwenKernelResult = (async () => {
  const meta = await (await fetch('/fixture/meta.json')).json(), arrays = {}, rows = [], errors = [];
  const affineKernel = new URL(location.href).searchParams.get('affine') ?? 'oracle';
  if (!['oracle','tiled','quad'].includes(affineKernel)) throw new Error('unsupported affine kernel');
  const affineCode = affineKernel === 'quad' ? kernels.affineQuadShader() : affineKernel === 'tiled' ? kernels.affineTiledShader() : kernels.affineShader();
  const affineGrid = affineKernel === 'quad' ? (rows, tokens, limit) => affineDispatch(rows, tokens, limit, { rowsPerGroup: 4 })
    : affineKernel === 'tiled' ? affineTiledDispatch : affineDispatch;
  window.qwenKernelPartial = { backend: 'webgpu', errors, rows, affineKernel };
  for (const [name, record] of Object.entries(meta.arrays)) {
    const response = await fetch('/fixture/' + record.file);
    if (!response.ok) throw new Error(`missing reference ${name}`);
    const data = await response.arrayBuffer();
    const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', data))].map(b => b.toString(16).padStart(2, '0')).join('');
    if (data.byteLength !== record.bytes || hash !== record.sha256) throw new Error(`reference identity mismatch ${name}`);
    arrays[name] = record.dtype === 'u32' ? new Uint32Array(data) : new Float32Array(data);
  }
  const adapter = await navigator.gpu?.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) throw new Error('no WebGPU adapter');
  const info = Object.fromEntries(['vendor', 'architecture', 'device', 'description'].map(k => [k, adapter.info?.[k] ?? '']));
  info.isFallbackAdapter = adapter.isFallbackAdapter ?? adapter.info?.isFallbackAdapter ?? null;
  window.qwenKernelPartial.adapter = info;
  const device = await adapter.requestDevice();
  device.addEventListener('uncapturederror', event => errors.push(String(event.error?.message ?? event.error)));
  device.lost.then(value => { if (value.reason !== 'destroyed') errors.push(`device lost: ${value.message}`); });
  const owned = new Set(), pipelines = new Map();
  const allocate = (bytes, usage) => { const b = device.createBuffer({ size: Math.max(16, Math.ceil(bytes / 4) * 4), usage }); owned.add(b); return b; };
  const buffer = data => { const b = allocate(data.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC); device.queue.writeBuffer(b, 0, data); return b; };
  const blank = n => buffer(new Float32Array(n).fill(NaN));
  const uniform = data => { const b = allocate(data.byteLength, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST); device.queue.writeBuffer(b, 0, data); return b; };
  async function pipeline(name, code) {
    if (!pipelines.has(name)) {
      const module = device.createShaderModule({ code });
      const compilation = await module.getCompilationInfo();
      if (compilation.messages.some(x => x.type === 'error')) throw new Error(`${name}: ${compilation.messages.map(x => x.message).join('; ')}`);
      pipelines.set(name, await device.createComputePipelineAsync({ layout: 'auto', compute: { module, entryPoint: 'main' } }));
    }
    return pipelines.get(name);
  }
  async function dispatch(name, code, buffers, params, shape) {
    const pipe = await pipeline(name, code), u = uniform(params);
    device.pushErrorScope('validation');
    const bind = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [...buffers, u].map((b, binding) => ({ binding, resource: { buffer: b } })) });
    const enc = device.createCommandEncoder(), pass = enc.beginComputePass();
    pass.setPipeline(pipe); pass.setBindGroup(0, bind); pass.dispatchWorkgroups(...shape); pass.end();
    device.queue.submit([enc.finish()]);
    const error = await device.popErrorScope(); if (error) throw new Error(`${name}: ${error.message}`);
    await device.queue.onSubmittedWorkDone(); u.destroy(); owned.delete(u);
  }
  async function read(b, elements) {
    const target = allocate(elements * 4, GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST);
    const enc = device.createCommandEncoder(); enc.copyBufferToBuffer(b, 0, target, 0, elements * 4); device.queue.submit([enc.finish()]);
    await target.mapAsync(GPUMapMode.READ);
    const values = new Float32Array(target.getMappedRange().slice(0)); target.unmap(); target.destroy(); owned.delete(target); return values;
  }
  function capture(name, values, expected) {
    if (values.length !== expected.length) throw new Error(`partial read ${name}`);
    let delta = 0, norm = 0, maxAbs = 0, nonFinite = 0;
    for (let i = 0; i < values.length; i++) {
      if (!Number.isFinite(values[i])) { nonFinite++; continue; }
      const d = values[i] - expected[i]; delta += d * d; norm += expected[i] * expected[i]; maxAbs = Math.max(maxAbs, Math.abs(d));
    }
    const bytes = new Uint8Array(values.buffer, values.byteOffset, values.byteLength);
    let binary = ''; for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    rows.push({ name, elements: values.length, relL2: norm > 0 ? Math.sqrt(delta / norm) : Math.sqrt(delta), maxAbs, nonFinite, data: btoa(binary) });
  }
  try {
    for (const cs of meta.affine) {
      const root = `affine-${cs.name}`, x = arrays[`${root}.input`];
      const w = buffer(arrays[`${root}.weight`]), s = buffer(arrays[`${root}.scales`]), b = buffer(arrays[`${root}.biases`]);
      const input = buffer(x), output = blank(cs.tokens * cs.rows);
      await dispatch('affine', affineCode, [input, w, s, b, output], affineParams(cs), affineGrid(cs.rows, cs.tokens, device.limits.maxComputeWorkgroupsPerDimension));
      capture(`${root}.full`, await read(output, cs.tokens * cs.rows), arrays[`${root}.output`]);
      const padded = new Float32Array(7 + cs.tokens * (cs.columns + 3));
      for (let t = 0; t < cs.tokens; t++) padded.set(x.subarray(t * cs.columns, (t + 1) * cs.columns), 7 + t * (cs.columns + 3));
      const stridedInput = buffer(padded), expected = new Float32Array(cs.tokens * 13 + 4).fill(-1234), stridedOutput = buffer(expected);
      for (let t = 0; t < cs.tokens; t++) expected.set(arrays[`${root}.output`].subarray(t * cs.rows + 3, t * cs.rows + 10), 2 + t * 13);
      await dispatch('affine', affineCode, [stridedInput, w, s, b, stridedOutput], affineParams({ ...cs, rows: 7, inputOffset: 7, inputStride: cs.columns + 3,
        weightRowOffset: 3, outputOffset: 2, outputStride: 13 }), affineGrid(7, cs.tokens, device.limits.maxComputeWorkgroupsPerDimension));
      capture(`${root}.strided`, await read(stridedOutput, expected.length), expected);
    }
    for (const cs of meta.gdn) for (const mode of ['batch', 'chunks']) {
      const root = `gdn-${cs.name}`, width = 2 * cs.keyHeads * cs.keyDim + cs.valueHeads * cs.valueDim;
      const preparedWidth = width + 2 * cs.valueHeads, valueWidth = cs.valueHeads * cs.valueDim;
      const weight = buffer(arrays[`${root}.conv-weight`]), parameters = buffer(arrays[`${root}.parameters`]), norm = buffer(arrays[`${root}.norm-weight`]);
      let history = buffer(arrays[`${root}.history-in`]);
      const state = buffer(arrays[`${root}.state-in`]), captures = Object.fromEntries(['convolved', 'prepared', 'recurrence', 'gated'].map(k => [k, []]));
      let offset = 0;
      for (const tokens of mode === 'batch' ? [cs.tokens] : meta.chunks) {
        const p = deltaParams({ ...cs, tokens });
        const mixed = buffer(arrays[`${root}.mixed`].subarray(offset * width, (offset + tokens) * width));
        const gates = buffer(arrays[`${root}.gates`].subarray(offset * 2 * cs.valueHeads, (offset + tokens) * 2 * cs.valueHeads));
        const z = buffer(arrays[`${root}.z`].subarray(offset * valueWidth, (offset + tokens) * valueWidth));
        const conv = blank(tokens * width), nextHistory = blank((cs.kernel - 1) * width), prepared = blank(tokens * preparedWidth), recurrent = blank(tokens * valueWidth), gated = blank(tokens * valueWidth);
        await dispatch('delta-conv', kernels.deltaConvShader(), [mixed, weight, history, conv, nextHistory], p, [Math.ceil(Math.max(tokens, cs.kernel - 1) * width / 256), 1, 1]);
        await dispatch('delta-prepare', kernels.deltaPrepareShader(), [conv, gates, parameters, prepared], p, [cs.keyHeads, tokens, 1]);
        await dispatch('delta-recurrent', kernels.deltaRecurrentShader(), [prepared, state, recurrent], p, [cs.valueHeads, 1, 1]);
        await dispatch('delta-norm', kernels.deltaNormShader(), [recurrent, z, norm, gated], p, [cs.valueHeads, tokens, 1]);
        for (const [name, buf, elements] of [['convolved', conv, tokens * width], ['prepared', prepared, tokens * preparedWidth], ['recurrence', recurrent, tokens * valueWidth], ['gated', gated, tokens * valueWidth]]) {
          captures[name].push(await read(buf, elements));
        }
        history = nextHistory; offset += tokens;
      }
      for (const [name, chunks] of Object.entries(captures)) {
        const joined = new Float32Array(chunks.reduce((a, b) => a + b.length, 0)); let offset = 0;
        for (const chunk of chunks) { joined.set(chunk, offset); offset += chunk.length; }
        capture(`${root}.${mode}.${name}`, joined, arrays[`${root}.${name}`]);
      }
      capture(`${root}.${mode}.state`, await read(state, arrays[`${root}.state`].length), arrays[`${root}.state`]);
      capture(`${root}.${mode}.history`, await read(history, (cs.kernel - 1) * width), arrays[`${root}.history`]);
    }
    for (const mode of ['batch', 'chunks']) {
      const cs = meta.attention, qw = cs.queryHeads * cs.headDim, kw = cs.kvHeads * cs.headDim;
      const keys = buffer(new Float32Array(cs.capacity * kw).fill(.125)), values = buffer(new Float32Array(cs.capacity * kw).fill(-.25));
      const norms = buffer(arrays['attention.norms']), captures = { q: [], output: [], gated: [] };
      let offset = 0;
      for (const tokens of mode === 'batch' ? [cs.tokens] : meta.chunks) {
        const qp = buffer(arrays['attention.q-proj'].subarray(offset * 2 * qw, (offset + tokens) * 2 * qw));
        const kp = buffer(arrays['attention.k-proj'].subarray(offset * kw, (offset + tokens) * kw));
        const vp = buffer(arrays['attention.v-proj'].subarray(offset * kw, (offset + tokens) * kw));
        const q = blank(tokens * qw), output = blank(tokens * qw), gated = blank(tokens * qw), p = attentionParams({ ...cs, tokens, pastTokens: offset });
        await dispatch('attention-prepare', kernels.attentionPrepareShader(cs), [qp, kp, vp, norms, q, keys, values], p, [cs.queryHeads, tokens, 1]);
        const attentionWords = flashAttentionParams({ queryTokens: tokens, keyTokens: offset + tokens, heads: cs.queryHeads, kvHeads: cs.kvHeads, headDim: cs.headDim, causalOffset: offset });
        await dispatch('attention', createWebGpuTiledFlashAttentionShader({ headDim: cs.headDim, causal: true }), [q, keys, values, output], attentionWords, [Math.ceil(tokens / 64), cs.queryHeads, 1]);
        await dispatch('attention-gate', kernels.attentionGateShader(), [output, qp, gated], p, [Math.ceil(tokens * qw / 256), 1, 1]);
        for (const [name, buf] of [['q', q], ['output', output], ['gated', gated]]) captures[name].push(await read(buf, tokens * qw));
        offset += tokens;
      }
      for (const [name, chunks] of Object.entries(captures)) {
        const joined = new Float32Array(cs.tokens * qw); let offset = 0;
        for (const chunk of chunks) { joined.set(chunk, offset); offset += chunk.length; }
        capture(`attention.${mode}.${name}`, joined, arrays[`attention.${name}`]);
      }
      capture(`attention.${mode}.key-cache`, await read(keys, cs.capacity * kw), arrays['attention.key-cache']);
      capture(`attention.${mode}.value-cache`, await read(values, cs.capacity * kw), arrays['attention.value-cache']);
    }
    await device.queue.onSubmittedWorkDone();
    return { backend: 'webgpu', adapter: info, errors, rows, affineKernel };
  } finally { for (const b of owned) b.destroy(); device.destroy(); }
})().catch(error => {
  const partial = window.qwenKernelPartial ?? { backend: 'webgpu', errors: [], rows: [] };
  partial.errors.push(String(error.stack ?? error)); return partial;
});
</script>
