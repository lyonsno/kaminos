<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoGe × Live Flame — shared-device composition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #08080a; color: #e8e4da; overflow: hidden; }
  #viewport { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(10,10,14,0.82); border: 1px solid #2a2a33; border-radius: 10px;
    padding: 14px 16px; width: 340px; backdrop-filter: blur(6px);
  }
  #hud h1 { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
  #hud .sub { color: #8f8a7e; font-size: 0.72rem; margin-bottom: 10px; }
  #hud .row { display: flex; justify-content: space-between; font-size: 0.78rem; padding: 2px 0; }
  #hud .row .k { color: #9a958a; }
  #hud .row .v { font-variant-numeric: tabular-nums; }
  #ignite {
    margin-top: 10px; width: 100%; padding: 9px 0; font-size: 0.85rem; font-weight: 600;
    background: #b3502a; color: #fff; border: none; border-radius: 7px; cursor: pointer;
  }
  #ignite:disabled { background: #3a3a42; color: #777; cursor: default; }
  #depth-panel {
    position: fixed; right: 12px; bottom: 12px; z-index: 10; display: none;
    background: rgba(10,10,14,0.82); border: 1px solid #2a2a33; border-radius: 10px; padding: 8px;
  }
  #depth-panel h3 { font-size: 0.68rem; color: #9a958a; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  #depth-canvas { width: 296px; height: 296px; border-radius: 6px; display: block; }
  .warn { color: #d9a04a; }
  .good { color: #79c98f; }
  .bad { color: #e06c5a; }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="hud">
  <h1>MoGe × Live Flame</h1>
  <div class="sub">One GPUDevice: pyro volume simulating every frame + MoGe-2 ViT-L cooperative inference</div>
  <div class="row"><span class="k">fire</span><span class="v" id="hud-fire">starting…</span></div>
  <div class="row"><span class="k">frame p95 (rolling)</span><span class="v" id="hud-p95">—</span></div>
  <div class="row"><span class="k">frames during inference</span><span class="v" id="hud-frames">—</span></div>
  <div class="row"><span class="k">weights</span><span class="v" id="hud-weights">not loaded</span></div>
  <div class="row"><span class="k">inference</span><span class="v" id="hud-infer">idle</span></div>
  <div class="row"><span class="k">scheduler receipt</span><span class="v" id="hud-sched">—</span></div>
  <button id="ignite" disabled>Loading weights…</button>
</div>
<div id="depth-panel">
  <h3>MoGe depth (live)</h3>
  <canvas id="depth-canvas" width="296" height="296"></canvas>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.webgpu.js",
    "three/webgpu": "./lib/three.webgpu.js",
    "three/tsl": "./lib/three.tsl.js"
  }
}
</script>
<script type="module" src="./moge-live-flame-core.mjs"></script>
</body>
</html>
