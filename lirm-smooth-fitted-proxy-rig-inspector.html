<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>719024 Smooth Fitted-Curve Inspector</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #111311;
      color: #eceee9;
    }

    * { box-sizing: border-box; }

    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body { background: #111311; }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active { cursor: grabbing; }

    .toolbar {
      position: fixed;
      inset: 14px 14px auto 14px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      background: rgba(19, 22, 19, 0.9);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(10px);
    }

    .title {
      min-width: 190px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .title span {
      margin-left: 7px;
      color: #91a493;
      font-weight: 500;
    }

    .segmented {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      background: #080a08;
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    button {
      height: 30px;
      border: 0;
      padding: 0 11px;
      color: #aeb7ad;
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0;
      cursor: pointer;
    }

    button:hover { color: #fff; background: rgba(255, 255, 255, 0.07); }
    button[aria-pressed="true"] { color: #0e130e; background: #b7d39d; }

    .toolbar-spacer { flex: 1; }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 9px;
      color: #aeb7ad;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .toggle input { accent-color: #b7d39d; }

    .metric-strip {
      position: fixed;
      z-index: 2;
      left: 14px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(4, minmax(96px, auto));
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(19, 22, 19, 0.88);
      backdrop-filter: blur(10px);
    }

    .metric {
      min-width: 0;
      padding: 9px 12px 8px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .metric:last-child { border-right: 0; }

    .metric-label {
      color: #7f8c7f;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .metric-value {
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 700;
    }

    .identity {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 2;
      max-width: min(510px, calc(100vw - 28px));
      padding: 9px 11px;
      border-left: 3px solid #4caa7f;
      background: rgba(19, 22, 19, 0.88);
      color: #95a095;
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      backdrop-filter: blur(10px);
    }

    .identity strong { color: #dce3d9; }
    .identity[data-state="error"] { border-left-color: #ef695f; }
    .identity[data-state="loading"] { border-left-color: #d8ad53; }

    .diagnostic button[aria-pressed="true"] { background: #da9b4d; }

    @media (max-width: 860px) {
      .toolbar { flex-wrap: wrap; }
      .title { width: 100%; }
      .toolbar-spacer { display: none; }
      .metric-strip { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .identity { display: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div class="toolbar" aria-label="Deformation inspector controls">
    <div class="title">719024 <span>continuous fitted curve</span></div>
    <div class="segmented" id="pose-controls" role="group" aria-label="Pose">
      <button type="button" data-pose="rest">Rest</button>
      <button type="button" data-pose="c">C bend</button>
      <button type="button" data-pose="s">S bend</button>
      <button type="button" data-pose="asym">Asymmetric</button>
    </div>
    <button type="button" data-action="motion" aria-pressed="false">Play motion</button>
    <div class="toolbar-spacer"></div>
    <label class="toggle"><input id="probes" type="checkbox" checked /> Probes</label>
    <label class="toggle"><input id="wireframe" type="checkbox" /> Wireframe</label>
    <div class="segmented diagnostic" role="group" aria-label="Diagnostic control">
      <button type="button" data-pose="legacy">Segmented control</button>
    </div>
  </div>

  <div class="metric-strip" aria-live="polite">
    <div class="metric"><div class="metric-label">Pose</div><div class="metric-value" id="metric-pose">-</div></div>
    <div class="metric"><div class="metric-label">Flipped</div><div class="metric-value" id="metric-flips">-</div></div>
    <div class="metric"><div class="metric-label">Edge p99</div><div class="metric-value" id="metric-p99">-</div></div>
    <div class="metric"><div class="metric-label">Max edge</div><div class="metric-value" id="metric-max">-</div></div>
  </div>

  <div class="identity" id="identity" data-state="loading">
    <strong>loading</strong><br />Exact route and source identity pending.
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import {
      createSmoothFittedProxyRigBinding,
      createSmoothFittedProxyRigProbeBinding,
      evaluateSmoothFittedProxyRigPhase,
      SMOOTH_FITTED_PHASE_ROUTE,
    } from './lirm-reference-fitted-armature-core.mjs';

    const app = document.querySelector('#app');
    const identity = document.querySelector('#identity');
    const wireframeInput = document.querySelector('#wireframe');
    const probesInput = document.querySelector('#probes');
    const poseButtons = [...document.querySelectorAll('[data-pose]')];
    const motionButton = document.querySelector('[data-action="motion"]');
    const metricPose = document.querySelector('#metric-pose');
    const metricFlips = document.querySelector('#metric-flips');
    const metricP99 = document.querySelector('#metric-p99');
    const metricMax = document.querySelector('#metric-max');

    const ROUTE = 'kaminos/fitted-proxy-rig/exact-glb-smooth-curve-stress-v0';
    const EVALUATOR_ROUTE = SMOOTH_FITTED_PHASE_ROUTE;
    const EXERCISE_ROUTE = 'kaminos/fitted-proxy-rig/arbitrary-phase-flat-support-exercise-v0';
    const SOURCE_HASH = '8fed20d958ef48797c14ad1d3846a50eae05d43e6ae67f8805060b02f1abde8e';
    const REGISTRATION_HASH = 'a63fa02ffa7a144234eef3b9902ac9d349fd413d93a19c87ee1464b0b61ca7f9';
    const BASE = './artifacts/lirm-719024-smooth-fitted-proxy-rig-assay-v0';
    const PHASE_BASE = './artifacts/lirm-719024-smooth-fitted-phase-exercise-v0';
    const FITTED_REGISTRATION = './artifacts/lirm-719024-fitted-proxy-rig-mechanism-witness-v1/registration.json';
    const SOURCES = {
      rest: './artifacts/motion-ready-719024/creature.glb',
      c: `${BASE}/smooth-c-bend.glb`,
      s: `${BASE}/smooth-s-bend.glb`,
      asym: `${BASE}/smooth-asymmetric.glb`,
      legacy: `${BASE}/legacy-s-bend.glb`,
    };
    const SOURCE_HASHES = {
      rest: SOURCE_HASH,
      c: 'd11dec96a20b39457faf9dbddb22627cf99b475e75119d3efb7eda15012d4cd6',
      s: '23c1af48f2d0ea354327a1a5607c64b125e0d7d3f5c741fc1fcbb3fa7ff31a90',
      asym: '8b7e06c5c792ac84923feb8b5135b7856ac4ef2310efc5c33c84866c60280a23',
      legacy: '0e7366b1d663b78fd3fc65d7352a2fe3faafdd4449d8f62c481e41fa729453c6',
    };
    const LABELS = {
      rest: 'Rest',
      c: 'C bend',
      s: 'S bend',
      asym: 'Asymmetric',
      legacy: 'Segmented control',
    };
    const MOTION_SEQUENCE = ['rest', 'c', 'rest', 's', 'rest', 'asym', 'rest'];
    const MOTION_SEGMENT_SECONDS = 1.35;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setAnimationLoop(render);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.append(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x191c19);
    scene.fog = new THREE.Fog(0x191c19, 4.5, 11);

    const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.01, 100);
    camera.position.set(3.2, 2.05, 3.4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.target.set(0, 0.4, 0);
    controls.minDistance = 1.2;
    controls.maxDistance = 12;
    controls.update();

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const hemi = new THREE.HemisphereLight(0xdce9f1, 0x3e372d, 1.7);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffecd1, 4.2);
    key.position.set(-3, 5, 4);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x8fb6d9, 2.2);
    rim.position.set(4, 2.5, -4);
    scene.add(rim);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({ color: 0x313630, roughness: 0.78, metalness: 0.03 }),
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.01;
    floor.receiveShadow = true;
    scene.add(floor);

    const loader = new GLTFLoader();
    const objects = new Map();
    const motionMeshes = [];
    const probeMarkers = new Map();
    let report = null;
    let phaseReport = null;
    let phaseEvaluator = null;
    let currentPose = 'rest';
    let framed = false;
    let motionActive = false;
    let motionPhase = 0;
    let lastRenderTime = null;
    let lastMetricUpdate = 0;

    window.__LIRM_INSPECTOR_STATE__ = {
      status: 'loading',
      requestedRoute: ROUTE,
      effectiveRoute: null,
      sourceHash: SOURCE_HASH,
      actualRenderedSourceHash: null,
      registrationHash: REGISTRATION_HASH,
      requestedEvaluatorRoute: EVALUATOR_ROUTE,
      effectiveEvaluatorRoute: null,
      requestedExerciseRoute: EXERCISE_ROUTE,
      effectiveExerciseRoute: null,
      effectiveAmplitude: null,
      currentPose,
      loadedPoses: [],
      denseMotion: {
        status: 'unmounted',
        active: false,
        phase: 0,
        sequence: [...MOTION_SEQUENCE],
        requestedEvaluatorRoute: EVALUATOR_ROUTE,
        effectiveEvaluatorRoute: null,
        requestedExerciseRoute: EXERCISE_ROUTE,
        effectiveExerciseRoute: null,
        parameterization: 'station-chain-interpolation-plus-fitted-curve-reconstruction-v0',
        probes: [],
      },
    };

    async function sha256Hex(bytes) {
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return [...new Uint8Array(digest)].map(value => value.toString(16).padStart(2, '0')).join('');
    }

    async function loadGLB(url, expectedHash) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`GLB load failed for ${url}: ${response.status}`);
      const bytes = await response.arrayBuffer();
      const actualHash = await sha256Hex(bytes);
      if (actualHash !== expectedHash) {
        throw new Error(`rendered source hash mismatch for ${url}: ${actualHash}`);
      }
      const resourcePath = new URL('.', new URL(url, location.href)).href;
      const gltf = await new Promise((resolve, reject) => loader.parse(bytes, resourcePath, resolve, reject));
      return { gltf, actualHash };
    }

    function styleObject(root) {
      root.traverse((node) => {
        if (!node.isMesh) return;
        node.castShadow = true;
        node.receiveShadow = true;
        if (Array.isArray(node.material)) {
          node.material = node.material.map((material) => material.clone());
        } else if (node.material) {
          node.material = node.material.clone();
        }
      });
    }

    function setWireframe(enabled) {
      for (const root of objects.values()) {
        root.traverse((node) => {
          if (!node.isMesh || !node.material) return;
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          for (const material of materials) material.wireframe = enabled;
        });
      }
    }

    function meshList(root) {
      const meshes = [];
      root.traverse((node) => { if (node.isMesh) meshes.push(node); });
      return meshes;
    }

    function normalizePositionArray(values) {
      const min = [Infinity, Infinity, Infinity];
      const max = [-Infinity, -Infinity, -Infinity];
      for (let index = 0; index < values.length; index += 3) {
        for (let axis = 0; axis < 3; axis += 1) {
          min[axis] = Math.min(min[axis], values[index + axis]);
          max[axis] = Math.max(max[axis], values[index + axis]);
        }
      }
      const center = min.map((value, axis) => (value + max[axis]) * 0.5);
      const diagonal = Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]);
      const scale = 2.15 / Math.max(diagonal, 1e-12);
      return {
        values: Float64Array.from(values, (value, index) => (value - center[index % 3]) * scale),
        center,
        scale,
      };
    }

    function buildMotionObject(registration, contactAtlas) {
      const root = objects.get('rest').clone(true);
      styleObject(root);
      const animatedMeshes = meshList(root);
      if (animatedMeshes.length !== 1) throw new Error(`arbitrary-phase evaluator requires one exact mesh, got ${animatedMeshes.length}`);
      const mesh = animatedMeshes[0];
      mesh.geometry = mesh.geometry.clone();
      const sourcePosition = mesh.geometry.getAttribute('position');
      if (!sourcePosition || sourcePosition.count !== contactAtlas.vertexCount) {
        throw new Error(`contact atlas vertex layout mismatch: ${sourcePosition?.count} != ${contactAtlas.vertexCount}`);
      }
      const normalization = normalizePositionArray(sourcePosition.array);
      const binding = createSmoothFittedProxyRigBinding({
        positions: normalization.values,
        registration,
        sampleCount: phaseReport.effectiveConfig.curveSampleCount,
      });
      const probeBinding = createSmoothFittedProxyRigProbeBinding({
        binding,
        contactAtlas,
        contactAtlasSha256: phaseReport.contactAtlas.sha256,
      });
      phaseEvaluator = {
        binding,
        probeBinding,
        normalization,
        rootFrame: phaseReport.flatSupport?.rootFrame ?? {
          schema: 'kaminos.creature-root-frame.v0',
          origin: { x: 0, y: 0, z: 0 },
          lateral: { x: 1, y: 0, z: 0 },
          normal: { x: 0, y: 1, z: 0 },
          tangent: { x: 0, y: 0, z: 1 },
        },
      };
      motionMeshes.push({ mesh });
      const probeColors = [0x68d5ff, 0xff6f72, 0x65e394, 0xffc85a];
      const markerGeometry = new THREE.SphereGeometry(0.018, 16, 10);
      const markerRoot = new THREE.Group();
      markerRoot.name = 'exact-contact-probes';
      probeBinding.probes.forEach((probe, index) => {
        const marker = new THREE.Mesh(
          markerGeometry,
          new THREE.MeshBasicMaterial({ color: probeColors[index % probeColors.length], depthTest: false }),
        );
        marker.name = `probe-${probe.id}`;
        marker.renderOrder = 10;
        probeMarkers.set(probe.id, marker);
        markerRoot.add(marker);
      });
      root.add(markerRoot);
      root.name = 'pose-motion';
      root.visible = false;
      objects.set('motion', root);
      scene.add(root);
      Object.assign(window.__LIRM_INSPECTOR_STATE__.denseMotion, {
        status: 'mounted',
        effectiveExerciseRoute: phaseReport.effectiveExerciseRoute,
        probeIds: probeBinding.probes.map(probe => probe.id),
      });
    }

    function applyMotionPhase(normalizedPhase) {
      motionPhase = ((normalizedPhase % 1) + 1) % 1;
      if (!phaseEvaluator) throw new Error('arbitrary-phase evaluator is not mounted');
      const packet = evaluateSmoothFittedProxyRigPhase({
        binding: phaseEvaluator.binding,
        probeBinding: phaseEvaluator.probeBinding,
        phase: motionPhase,
        amplitude: phaseReport.effectiveConfig.amplitude,
        rootFrame: phaseEvaluator.rootFrame,
      });
      if (packet.effectiveRoute !== EVALUATOR_ROUTE) {
        throw new Error(`effective evaluator route mismatch: ${packet.effectiveRoute}`);
      }
      for (const entry of motionMeshes) {
        const position = entry.mesh.geometry.getAttribute('position');
        for (let index = 0; index < position.array.length; index += 1) {
          position.array[index] = packet.worldPositions[index];
        }
        position.needsUpdate = true;
        entry.mesh.geometry.computeVertexNormals();
        entry.mesh.geometry.computeBoundingBox();
      }
      for (const probe of packet.probes) {
        probeMarkers.get(probe.id).position.fromArray(probe.worldPosition);
      }
      const from = packet.pose.fromPreset === 'c-bend' ? 'c'
        : packet.pose.fromPreset === 's-bend' ? 's'
          : packet.pose.fromPreset === 'asymmetric' ? 'asym' : 'rest';
      const to = packet.pose.toPreset === 'c-bend' ? 'c'
        : packet.pose.toPreset === 's-bend' ? 's'
          : packet.pose.toPreset === 'asymmetric' ? 'asym' : 'rest';
      Object.assign(window.__LIRM_INSPECTOR_STATE__.denseMotion, {
        effectiveEvaluatorRoute: packet.effectiveRoute,
        effectiveExerciseRoute: phaseReport.effectiveExerciseRoute,
        phase: motionPhase,
        segment: packet.pose.segment,
        from,
        to,
        mix: packet.pose.mix,
        probes: packet.probes,
      });
      return window.__LIRM_INSPECTOR_STATE__.denseMotion;
    }

    function motionScreenProbe() {
      const root = objects.get('motion');
      if (!root?.visible) throw new Error('motion object is not visible');
      root.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(root);
      if (bounds.isEmpty()) throw new Error('motion object has empty bounds');
      const projected = [];
      for (const x of [bounds.min.x, bounds.max.x]) {
        for (const y of [bounds.min.y, bounds.max.y]) {
          for (const z of [bounds.min.z, bounds.max.z]) {
            const point = new THREE.Vector3(x, y, z).project(camera);
            projected.push({
              x: (point.x * 0.5 + 0.5) * innerWidth,
              y: (-point.y * 0.5 + 0.5) * innerHeight,
            });
          }
        }
      }
      const raw = {
        minX: Math.min(...projected.map(point => point.x)),
        minY: Math.min(...projected.map(point => point.y)),
        maxX: Math.max(...projected.map(point => point.x)),
        maxY: Math.max(...projected.map(point => point.y)),
      };
      const clipped = {
        minX: Math.max(0, raw.minX),
        minY: Math.max(0, raw.minY),
        maxX: Math.min(innerWidth, raw.maxX),
        maxY: Math.min(innerHeight, raw.maxY),
      };
      const width = Math.max(0, clipped.maxX - clipped.minX);
      const height = Math.max(0, clipped.maxY - clipped.minY);
      return {
        viewport: { width: innerWidth, height: innerHeight },
        raw,
        clipped: { ...clipped, width, height },
        areaRatio: width * height / (innerWidth * innerHeight),
        intersectsViewport: width > 0 && height > 0,
      };
    }

    window.__lirmMotionScreenProbe = motionScreenProbe;

    function setMotionPhase(normalizedPhase) {
      motionActive = false;
      motionButton.textContent = 'Play motion';
      motionButton.setAttribute('aria-pressed', 'false');
      for (const root of objects.values()) root.visible = false;
      objects.get('motion').visible = true;
      currentPose = 'motion';
      applyMotionPhase(normalizedPhase);
      metricPose.textContent = `${LABELS[window.__LIRM_INSPECTOR_STATE__.denseMotion.from]} to ${LABELS[window.__LIRM_INSPECTOR_STATE__.denseMotion.to]}`;
      metricFlips.textContent = '4 live probes';
      metricP99.textContent = 'fitted curve';
      metricMax.textContent = 'flat support';
      window.__LIRM_INSPECTOR_STATE__.currentPose = currentPose;
      window.__LIRM_INSPECTOR_STATE__.denseMotion.active = false;
      return window.__LIRM_INSPECTOR_STATE__.denseMotion;
    }

    window.__setLirmMotionPhase = setMotionPhase;

    function setMotionActive(enabled) {
      motionActive = enabled;
      for (const root of objects.values()) root.visible = false;
      objects.get('motion').visible = true;
      currentPose = 'motion';
      motionButton.textContent = enabled ? 'Pause motion' : 'Play motion';
      motionButton.setAttribute('aria-pressed', String(enabled));
      for (const button of poseButtons) button.setAttribute('aria-pressed', 'false');
      window.__LIRM_INSPECTOR_STATE__.currentPose = currentPose;
      window.__LIRM_INSPECTOR_STATE__.denseMotion.active = enabled;
      if (enabled) lastRenderTime = null;
      const params = new URLSearchParams(location.search);
      if (enabled) params.set('motion', '1'); else params.delete('motion');
      history.replaceState(null, '', `${location.pathname}?${params}`);
    }

    function metricsFor(pose) {
      if (!report || pose === 'rest') return null;
      const key = pose === 'c' ? 'c-bend' : pose === 's' || pose === 'legacy' ? 's-bend' : 'asymmetric';
      return report.results?.[key]?.[pose === 'legacy' ? 'hard' : 'smooth'] ?? null;
    }

    function updateMetrics(pose) {
      const metrics = metricsFor(pose);
      metricPose.textContent = LABELS[pose];
      metricFlips.textContent = metrics ? `${metrics.flippedTriangles.toLocaleString()} / ${metrics.triangleCount.toLocaleString()}` : 'baseline';
      metricP99.textContent = metrics ? `${metrics.edgeRatio.p99.toFixed(3)}x` : '1.000x';
      metricMax.textContent = metrics ? `${metrics.edgeRatio.max.toFixed(3)}x` : '1.000x';
    }

    function showPose(pose) {
      if (!objects.has(pose)) return;
      motionActive = false;
      motionButton.textContent = 'Play motion';
      motionButton.setAttribute('aria-pressed', 'false');
      window.__LIRM_INSPECTOR_STATE__.denseMotion.active = false;
      currentPose = pose;
      for (const [name, root] of objects) root.visible = name === pose;
      for (const button of poseButtons) button.setAttribute('aria-pressed', String(button.dataset.pose === pose));
      updateMetrics(pose);
      window.__LIRM_INSPECTOR_STATE__.currentPose = pose;
      const params = new URLSearchParams(location.search);
      params.set('pose', pose);
      history.replaceState(null, '', `${location.pathname}?${params}`);
    }

    function frameObjects() {
      const union = new THREE.Box3();
      for (const root of objects.values()) {
        if (root.visible) union.union(new THREE.Box3().setFromObject(root));
      }
      if (union.isEmpty()) throw new Error('cannot frame an empty visible object set');
      const sphere = union.getBoundingSphere(new THREE.Sphere());
      const center = sphere.center;
      floor.position.y = currentPose === 'motion' ? 0 : union.min.y - 0.04;
      const distance = sphere.radius / Math.sin(THREE.MathUtils.degToRad(camera.fov * 0.5));
      const view = new URLSearchParams(location.search).get('view') ?? 'three-quarter';
      const directions = {
        'three-quarter': new THREE.Vector3(0.82, 0.45, 0.92),
        side: new THREE.Vector3(1, 0.22, 0),
        opposite: new THREE.Vector3(-1, 0.22, 0),
        front: new THREE.Vector3(0, 0.18, 1),
        rear: new THREE.Vector3(0, 0.18, -1),
        low: new THREE.Vector3(0.9, -0.18, 0.25),
        top: new THREE.Vector3(0.25, 1, 0.18),
      };
      camera.position.copy(directions[view] ?? directions['three-quarter'])
        .normalize()
        .multiplyScalar(distance * 1.26)
        .add(center);
      camera.near = Math.max(0.005, distance / 100);
      camera.far = distance * 12;
      camera.updateProjectionMatrix();
      controls.target.copy(center);
      controls.minDistance = sphere.radius * 0.72;
      controls.maxDistance = sphere.radius * 8;
      controls.update();
      framed = true;
    }

    function render(time) {
      if (motionActive) {
        if (lastRenderTime === null) lastRenderTime = time;
        const deltaSeconds = Math.min(0.1, Math.max(0, (time - lastRenderTime) / 1000));
        lastRenderTime = time;
        const cycleSeconds = MOTION_SEGMENT_SECONDS * (MOTION_SEQUENCE.length - 1);
        applyMotionPhase(motionPhase + deltaSeconds / cycleSeconds);
        if (time - lastMetricUpdate > 120) {
          const motion = window.__LIRM_INSPECTOR_STATE__.denseMotion;
          metricPose.textContent = `${LABELS[motion.from]} to ${LABELS[motion.to]}`;
          metricFlips.textContent = `${motion.probes.length} live probes`;
          metricP99.textContent = `${Math.round(motion.phase * 100)}% cycle`;
          metricMax.textContent = 'fitted phase';
          lastMetricUpdate = time;
        }
      }
      controls.update();
      renderer.render(scene, camera);
    }

    async function boot() {
      try {
        const [reportResponse, phaseReportResponse, registrationResponse, contactAtlasResponse, ...glbs] = await Promise.all([
          fetch(`${BASE}/report.json`, { cache: 'no-store' }),
          fetch(`${PHASE_BASE}/report.json`, { cache: 'no-store' }),
          fetch(FITTED_REGISTRATION, { cache: 'no-store' }),
          fetch(`${PHASE_BASE}/admitted-contact-atlas.json`, { cache: 'no-store' }),
          ...Object.entries(SOURCES).map(async ([pose, url]) => [
            pose,
            await loadGLB(url, SOURCE_HASHES[pose]),
          ]),
        ]);
        if (!reportResponse.ok) throw new Error(`report load failed: ${reportResponse.status}`);
        if (!phaseReportResponse.ok) throw new Error(`phase report load failed: ${phaseReportResponse.status}`);
        if (!registrationResponse.ok) throw new Error(`fitted registration load failed: ${registrationResponse.status}`);
        if (!contactAtlasResponse.ok) throw new Error(`contact atlas load failed: ${contactAtlasResponse.status}`);
        report = await reportResponse.json();
        phaseReport = await phaseReportResponse.json();
        const registration = await registrationResponse.json();
        const contactAtlas = await contactAtlasResponse.json();
        if (report.effectiveRoute !== ROUTE) throw new Error(`effective route mismatch: ${report.effectiveRoute}`);
        if (phaseReport.effectiveEvaluatorRoute !== EVALUATOR_ROUTE) {
          throw new Error(`effective evaluator route mismatch: ${phaseReport.effectiveEvaluatorRoute}`);
        }
        if (phaseReport.effectiveExerciseRoute !== EXERCISE_ROUTE) {
          throw new Error(`effective exercise route mismatch: ${phaseReport.effectiveExerciseRoute}`);
        }
        if (report.source?.sha256 !== `sha256:${SOURCE_HASH}`) throw new Error(`source hash mismatch: ${report.source?.sha256}`);
        if (report.registration?.sha256 !== `sha256:${REGISTRATION_HASH}`) {
          throw new Error(`registration hash mismatch: ${report.registration?.sha256}`);
        }
        if (phaseReport.source?.sha256 !== `sha256:${SOURCE_HASH}`
            || phaseReport.registration?.sha256 !== `sha256:${REGISTRATION_HASH}`
            || contactAtlas.castHash !== SOURCE_HASH
            || registration.donorSha256 !== `sha256:${SOURCE_HASH}`) {
          throw new Error('arbitrary-phase source identity mismatch');
        }

        for (const [pose, loaded] of glbs) {
          const { gltf, actualHash } = loaded;
          if (actualHash !== SOURCE_HASHES[pose]) throw new Error(`rendered source hash mismatch for ${pose}`);
          const root = gltf.scene;
          root.name = `pose-${pose}`;
          styleObject(root);
          root.visible = false;
          objects.set(pose, root);
          scene.add(root);
        }
        const params = new URLSearchParams(location.search);
        const requestedPose = params.get('pose');
        const initialPose = objects.has(requestedPose) ? requestedPose : 'rest';
        wireframeInput.checked = params.get('wire') === '1';
        setWireframe(wireframeInput.checked);
        buildMotionObject(registration, contactAtlas);
        applyMotionPhase(0);
        if (params.get('motion') === '1') {
          applyMotionPhase(Number(params.get('phase') ?? 0));
          if (params.get('paused') === '1') setMotionPhase(Number(params.get('phase') ?? 0));
          else setMotionActive(true);
        } else {
          showPose(initialPose);
        }
        frameObjects();

        identity.dataset.state = 'loaded';
        identity.innerHTML = `<strong>exact route loaded | 5/5 poses mounted | 4 probes live</strong><br>${EVALUATOR_ROUTE}<br>source ${SOURCE_HASH.slice(0, 16)}... | registration ${REGISTRATION_HASH.slice(0, 16)}... | 148,118 vertices | amplitude ${phaseReport.effectiveConfig.amplitude}`;
        Object.assign(window.__LIRM_INSPECTOR_STATE__, {
          status: 'loaded',
          effectiveRoute: report.effectiveRoute,
          actualRenderedSourceHash: glbs.find(([pose]) => pose === 'rest')[1].actualHash,
          effectiveEvaluatorRoute: window.__LIRM_INSPECTOR_STATE__.denseMotion.effectiveEvaluatorRoute,
          effectiveExerciseRoute: phaseReport.effectiveExerciseRoute,
          effectiveAmplitude: report.effectiveConfig.amplitude,
          loadedPoses: [...objects.keys()],
          currentPose,
          framed,
        });
        document.documentElement.dataset.inspectorStatus = 'loaded';
      } catch (error) {
        console.error(error);
        identity.dataset.state = 'error';
        identity.innerHTML = `<strong>load failed</strong><br>${error.message}`;
        window.__LIRM_INSPECTOR_STATE__.status = 'error';
        window.__LIRM_INSPECTOR_STATE__.error = error.message;
        document.documentElement.dataset.inspectorStatus = 'error';
      }
    }

    for (const button of poseButtons) button.addEventListener('click', () => showPose(button.dataset.pose));
    motionButton.addEventListener('click', () => setMotionActive(!motionActive));
    probesInput.addEventListener('change', () => {
      for (const marker of probeMarkers.values()) marker.visible = probesInput.checked;
    });
    wireframeInput.addEventListener('change', () => {
      setWireframe(wireframeInput.checked);
      const params = new URLSearchParams(location.search);
      if (wireframeInput.checked) params.set('wire', '1'); else params.delete('wire');
      history.replaceState(null, '', `${location.pathname}?${params}`);
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    boot();
  </script>
</body>
</html>
