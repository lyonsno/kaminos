name: Deploy Kaminos Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/flame-atlas/**
      - docs/inference-kit/**
      - demos/hand-mesh/**
      - models/mobrecon/*.js
      - models/wilor-hand-detector/*.js
      - demos/material-photo/**
      - models/supermat/*.js
      - models/moge/**
      - assets/hdr/**
      - lib/three*.js
      - lib/addons/tsl/display/**
      - scene-gi*.mjs
      - finger-fluid-webgpu-core.js
      - models/flux2-klein/index.html
      - models/flux2-klein/klein-*.js
      - models/flux2-klein/qwen-tokenizer.js
      - models/flux2-klein/assets/**
      - models/unimate/index.html
      - models/unimate/unimate-*.js
      - models/unimate/clips/**
      - webgpu-inference-kit/src/**
      - scripts/assemble-pages-site.mjs
      - .github/workflows/flame-atlas-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kaminos
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site (flame boutique and browser model experiences)
        env:
          SUPERMAT_WEIGHTS_URL: ${{ vars.SUPERMAT_WEIGHTS_URL }}
        run: node scripts/assemble-pages-site.mjs _site --supermat-weights "$SUPERMAT_WEIGHTS_URL"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
