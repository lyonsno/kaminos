name: Deploy Flame Boutique

on:
  push:
    branches:
      - main
    paths:
      - docs/flame-atlas/**
      - .github/workflows/flame-atlas-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kaminos
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload flame boutique
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/flame-atlas

      - name: Deploy flame boutique
        id: deployment
        uses: actions/deploy-pages@v4
