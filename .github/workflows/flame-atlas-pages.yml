name: Deploy Kaminos Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/flame-atlas/**
      - models/flux2-klein/index.html
      - models/flux2-klein/klein-*.js
      - models/flux2-klein/qwen-tokenizer.js
      - webgpu-inference-kit/src/**
      - scripts/assemble-pages-site.mjs
      - .github/workflows/flame-atlas-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kaminos
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site (flame boutique at the root, Klein demo at inference-kit/klein/)
        run: node scripts/assemble-pages-site.mjs _site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
