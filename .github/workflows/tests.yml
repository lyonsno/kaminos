name: tests

# Advisory: no step here blocks a push or a landing. Problems surface as
# warnings on the run and in its summary; the run itself stays green.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy pillow
      - run: npm ci
      - name: serve.py answers within 10 s
        id: serve
        continue-on-error: true
        run: |
          python3 -u serve.py 18499 > serve-startup.log 2>&1 &
          pid=$!
          up=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:18499/api/runtime-config > /dev/null; then up=1; echo "serve.py up after $i polls"; break; fi
            sleep 0.5
          done
          kill $pid || true
          cat serve-startup.log
          test "$up" = 1
      - name: suite
        id: suite
        continue-on-error: true
        run: node tools/test-runner.mjs --report test-results/report.json
      - name: warnings
        if: always()
        env:
          SERVE: ${{ steps.serve.outcome }}
          SUITE: ${{ steps.suite.outcome }}
        run: |
          node -e '
            const fs = require("fs");
            const out = [];
            if (process.env.SERVE !== "success") out.push("serve.py did not answer within 10 s");
            let r = null;
            try { r = JSON.parse(fs.readFileSync("test-results/report.json", "utf8")); } catch {}
            if (!r) out.push(`no suite report (suite step ${process.env.SUITE})`);
            else {
              for (const f of r.newFailures || []) out.push(`new failure: ${f}`);
              for (const f of r.staleQuarantine || []) out.push(`stale quarantine: ${f}`);
              for (const w of r.warnings || []) out.push(`warning: ${typeof w === "string" ? w : (w.message || JSON.stringify(w))}`);
            }
            const lines = out.map(l => l.replace(/\r?\n/g, " "));
            for (const line of lines) console.log(`::warning::${line}`);
            const c = r && r.counts;
            const head = c ? `executed ${c.executed}, passed ${c.passed}, known ${c.knownFailures}, new ${c.newFailures}, not run ${c.notRun}` : "no report";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Tests (advisory)\n\n${head}\n\n${lines.map(l => `- ${l}`).join("\n")}\n`);
          '
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            serve-startup.log
