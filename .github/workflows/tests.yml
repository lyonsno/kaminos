name: tests

# Advisory: nothing here fails the run or blocks a push or a landing.
# Problems surface as warnings on the run and in its summary
# (tools/ci-advisory-warnings.mjs), including a failure to set up (checkout,
# toolchains, installs), which skips the suite and says nothing was checked.
# Lane branches (cc/**) get a run too, so a lane can read the full suite's
# result for its exact commit before landing instead of running it on the
# shared machine (trial, 2026-10-17). No run is ever cancelled: a branch run
# whose commit a newer push has already replaced skips the suite and says so,
# and every other run goes to the end. Each run posts one verdict notice:
# "tests clean", "tests not clean" or "tests no result".
on:
  push:
    branches: [main, 'cc/**']
  workflow_dispatch:

jobs:
  suite:
    runs-on: macos-latest
    # Setup steps are bounded (at most 30 minutes together) and the suite at 45,
    # so a hang ends its own step as a warning before the job limit is reached.
    timeout-minutes: 90
    steps:
      # On a lane branch, a commit that is no longer the branch tip has been
      # replaced by a newer push, whose own run checks it.
      - id: current
        continue-on-error: true
        timeout-minutes: 2
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ]; then
            tip=$(git ls-remote "https://github.com/$REPO" "$REF" | cut -f1)
            if [ -n "$tip" ] && [ "$tip" != "$SHA" ]; then echo "superseded=$tip" >> "$GITHUB_OUTPUT"; fi
          fi
      - id: checkout
        if: steps.current.outputs.superseded == ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: node
        if: steps.current.outputs.superseded == ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version: '25'
      - id: python
        if: steps.current.outputs.superseded == ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: pip
        if: steps.current.outputs.superseded == ''
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -m pip install -r requirements.txt
      - id: npm
        if: steps.current.outputs.superseded == ''
        continue-on-error: true
        timeout-minutes: 10
        run: npm ci
      - name: serve.py answers within 10 s
        id: serve
        continue-on-error: true
        if: steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.python.outcome == 'success' && steps.pip.outcome == 'success' && steps.npm.outcome == 'success'
        run: |
          python3 -u serve.py 18499 > serve-startup.log 2>&1 &
          pid=$!
          up=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:18499/api/runtime-config > /dev/null; then up=1; echo "serve.py up after $i polls"; break; fi
            sleep 0.5
          done
          kill $pid || true
          cat serve-startup.log
          test "$up" = 1
      - name: suite
        id: suite
        continue-on-error: true
        if: steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.python.outcome == 'success' && steps.pip.outcome == 'success' && steps.npm.outcome == 'success'
        timeout-minutes: 45
        # The runner defaults to half the cores, which is one on a three-core
        # macOS runner; the runner has the machine to itself.
        run: node tools/test-runner.mjs --parallel 3 --report test-results/report.json
      - name: warnings
        if: always()
        continue-on-error: true
        env:
          SERVE: ${{ steps.serve.outcome }}
          SUITE: ${{ steps.suite.outcome }}
          SETUP: checkout=${{ steps.checkout.outcome }} node=${{ steps.node.outcome }} python=${{ steps.python.outcome }} pip=${{ steps.pip.outcome }} npm=${{ steps.npm.outcome }}
          SUPERSEDED: ${{ steps.current.outputs.superseded }}
        run: |
          if [ -n "$SUPERSEDED" ]; then
            echo "::notice title=tests::tests no result: superseded by $SUPERSEDED, a newer push to this branch; this commit was not checked"
            printf '### Tests (advisory)\n\n**tests no result: superseded by %s, a newer push to this branch; this commit was not checked**\n' "$SUPERSEDED" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f tools/ci-advisory-warnings.mjs ]; then
            node tools/ci-advisory-warnings.mjs test-results/report.json "$SERVE" "$SUITE" "$SETUP" || {
              code=$?
              echo "::warning::the advisory warning tool failed (exit $code; setup: $SETUP), so problems in this run are unknown; see the suite step and the test-results artifact"
              echo "::notice title=tests::tests no result: the warning tool failed (exit $code)"
              printf '### Tests (advisory)\n\n**tests no result: the warning tool failed (exit %s)**\n' "$code" >> "$GITHUB_STEP_SUMMARY"
            }
          else
            echo "::warning::setup failed before the repository was checked out ($SETUP); nothing was checked"
            echo "::notice title=tests::tests no result: setup failed before checkout, so nothing was checked"
            printf '### Tests (advisory)\n\n**tests no result: setup failed before checkout (%s); nothing was checked**\n' "$SETUP" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always() && steps.current.outputs.superseded == ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            serve-startup.log
