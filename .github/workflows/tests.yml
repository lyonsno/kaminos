name: tests

on:
  push:
    branches: [main, 'cc/operlocutor-*', 'land/**']
  workflow_dispatch:

jobs:
  suite:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy pillow
      - run: npm ci
      - name: serve.py answers within 10 s
        run: |
          python3 -u serve.py 18499 > serve-startup.log 2>&1 &
          pid=$!
          up=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:18499/api/runtime-config > /dev/null; then up=1; echo "serve.py up after $i polls"; break; fi
            sleep 0.5
          done
          kill $pid || true
          cat serve-startup.log
          test "$up" = 1
      # Browser-kind tests run against Chrome for Testing, never an installed
      # Chrome. The cache key changes weekly so stable is refreshed.
      - id: cft-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chrome
          key: chrome-for-testing-stable-${{ runner.os }}-${{ runner.arch }}-${{ steps.cft-week.outputs.week }}
      - name: Install Chrome for Testing
        run: |
          line=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" | tail -n 1)
          echo "$line"
          exe="${line#* }"
          test -x "$exe"
          "$exe" --version
          echo "KAMINOS_BROWSER=$exe" >> "$GITHUB_ENV"
      - run: node tools/test-runner.mjs --report test-results/report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            serve-startup.log
