<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Material Photograph | Kaminos</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three/webgpu":"../../lib/three.webgpu.js","three/tsl":"../../lib/three.tsl.js"}}</script>
</head>
<body>
  <header><a class="brand" href="../../index.html">Kaminos</a><span>Material photograph</span><a href="https://github.com/lyonsno/kaminos/tree/main/webgpu-inference-kit">Inference Kit <span aria-hidden="true">&#8599;</span></a></header>
  <main>
    <section class="stage" aria-label="Photograph surface">
      <div class="title"><h1>Material photograph</h1><p id="stage-label" role="status" aria-live="polite">Original photograph</p></div>
      <img id="preview" alt="Selected photograph">
      <div id="scene" class="comparison" tabindex="0" aria-label="Synchronized photograph comparison" hidden>
        <article data-tile="original"><div class="view-surface"><canvas data-canvas="original" aria-label="Original photograph"></canvas></div><button data-focus="original" title="Enlarge original photograph">Original photograph</button></article>
        <article data-tile="photo"><div class="view-surface"><canvas data-canvas="photo" aria-label="Inferred depth"></canvas></div><button data-focus="photo" title="Enlarge depth surface">Photograph + depth</button></article>
        <article data-tile="relit"><div class="view-surface"><canvas data-canvas="relit" aria-label="Relit photograph"></canvas></div><button data-focus="relit" title="Enlarge relit photograph">Image as albedo</button></article>
        <article data-tile="materials"><div class="view-surface"><canvas data-canvas="materials" aria-label="Inferred materials"></canvas></div><button data-focus="materials" title="Enlarge inferred materials">Inferred materials</button></article>
      </div>
      <button id="view-prev" class="icon-button carousel previous" aria-label="Previous view" title="Previous view" disabled><img src="./icons/chevron-left.svg" alt=""></button>
      <button id="view-next" class="icon-button carousel next" aria-label="Next view" title="Next view" disabled><img src="./icons/chevron-right.svg" alt=""></button>
      <div id="light-ring" class="light-ring" aria-label="Light direction"><span>Front</span><small>Grazing</small><button id="sun" class="icon-button sun" aria-label="Sun position" title="Light direction" hidden><img src="./icons/sun.svg" alt=""></button></div>
      <div class="stage-foot"><span id="name">Celebration</span><span id="resolution"></span></div>
    </section>
    <aside>
      <section><h2><span>01</span> Photograph</h2>
        <div class="samples" aria-label="Example photographs">
          <button data-sample="celebration" class="selected"><img src="./images/celebration.png" alt=""><span>Celebration</span></button>
          <button data-sample="bag"><img src="./images/bag.webp" alt=""><span>Backpack</span></button>
          <button data-sample="orb"><img src="./images/evil-orb.png" alt=""><span>Metal &amp; glow</span></button>
        </div>
        <label class="file">Choose photograph<input id="file" type="file" accept="image/*"></label>
        <label>Material resolution<select id="material-size"><option value="512">512 x 512</option><option value="768">768 x 768</option><option value="1024">1024 x 1024</option></select></label>
        <button id="run" class="primary">Reveal depth &amp; materials</button>
        <div class="progress"><p id="status" role="status" aria-live="polite">Photograph loaded</p><progress id="progress" max="1" value="0"></progress><span id="elapsed"></span></div>
      </section>
      <section><h2><span>02</span> Explore</h2>
        <button id="compare" class="comparison-button" disabled>Compare all four</button>
        <div class="segmented" aria-label="Surface view"><button data-view="original" class="selected" aria-pressed="true">Original</button><button data-view="photo" aria-pressed="false" disabled>Depth</button><button data-view="relit" aria-pressed="false" disabled>Relit</button><button data-view="materials" aria-pressed="false" disabled>Materials</button></div>
        <label>Environment<select id="environment" disabled><option value="studio">Studio</option><option value="warehouse">Warehouse</option><option value="sunset">Sunset</option></select></label>
        <p id="environment-status" role="status" aria-live="polite"></p>
        <label>Environment rotation<input id="environment-rotation" type="range" min="0" max="360" step="1" value="0" disabled></label>
        <label>Environment light<input id="environment-intensity" type="number" min="0" step="0.1" value="1" disabled></label>
        <label>Movable light<input id="direct-intensity" type="number" min="0" step="0.1" value="1" disabled></label>
        <label class="check"><input id="gi" type="checkbox" checked disabled>Screen-space GI</label>
        <label class="check"><input id="glow" type="checkbox" disabled>Inferred glow</label>
        <button id="reset" class="icon-button" aria-label="Reset view and light" title="Reset view and light" disabled><img src="./icons/rotate-ccw.svg" alt=""></button>
        <details id="advanced"><summary>Advanced</summary>
          <label>Inspector<select id="map" disabled><option value="surface">Surface</option><option value="albedo">Albedo</option><option value="roughness">Roughness</option><option value="metallic">Metallic</option><option value="orm">Packed ORM</option><option value="normals">Surface normals</option><option value="emission">Emission</option></select></label>
          <div id="tuning" class="tuning">
            <label>GI gain<input id="gain" type="number" min="0" step="any" value="1" disabled></label>
            <label>AO strength<input id="aoStrength" type="number" min="0" step="any" value="0.5" disabled></label>
            <label>Radius<input id="radius" type="number" min="0" step="any" value="0.15" disabled></label>
            <label>Thickness<input id="thickness" type="number" min="0" step="any" value="0.03" disabled></label>
            <label>Slices<input id="slices" type="number" min="1" step="1" value="6" disabled></label>
            <label>Steps<input id="steps" type="number" min="1" step="1" value="16" disabled></label>
            <label>Denoise radius<input id="denoise" type="number" min="0" step="any" value="3" disabled></label>
            <label>Exponent<input id="expFactor" type="number" min="0" step="any" value="2" disabled></label>
            <label>Backface lighting<input id="backfaceLighting" type="number" min="0" step="any" value="0" disabled></label>
            <label>Depth phi<input id="depthPhi" type="number" min="0" step="any" value="0.1" disabled></label>
            <label>Normal phi<input id="normalPhi" type="number" min="0" step="any" value="5" disabled></label>
            <label>Luma phi<input id="lumaPhi" type="number" min="0" step="any" value="5" disabled></label>
          </div>
          <label class="check"><input id="screenSpaceSampling" type="checkbox" disabled>Screen-space sampling</label>
          <label class="check"><input id="linearThickness" type="checkbox" disabled>Linear thickness</label>
          <div class="preset-actions"><button id="preset-export" disabled>Export preset</button><button id="preset-import" disabled>Import preset</button></div>
          <input id="preset-file" type="file" accept="application/json,.json" hidden>
          <p id="preset-error" class="error" role="alert"></p>
        </details>
      </section>
      <div class="identity"><span id="identity">MoGe-2 + SuperMat</span><span>Local WebGPU inference</span><span id="timings"></span></div>
    </aside>
  </main>
  <footer><span>Kaminos WebGPU Inference Kit</span><span>Depth, normals &amp; material maps from one image</span></footer>
  <script type="module" src="./main.js"></script>
</body>
</html>
