<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>719024 Stationary Hill Contact</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #101310;
      color: #eef0e8;
    }
    * { box-sizing: border-box; }
    html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #101310; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .toolbar {
      position: fixed;
      z-index: 2;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      background: rgba(18, 22, 18, 0.9);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }
    .title {
      min-width: 210px;
      padding: 0 7px;
      font-size: 13px;
      font-weight: 720;
      white-space: nowrap;
    }
    .title span { margin-left: 7px; color: #92a493; font-weight: 520; }
    .spacer { flex: 1; }
    button {
      height: 32px;
      border: 0;
      padding: 0 12px;
      background: transparent;
      color: #b7c0b4;
      font: inherit;
      font-size: 12px;
      font-weight: 680;
      cursor: pointer;
    }
    button:hover { color: #fff; background: rgba(255, 255, 255, 0.07); }
    button[aria-pressed="true"] { color: #101510; background: #b7d39d; }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 32px;
      padding: 0 8px;
      color: #aeb8ac;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .toggle input { accent-color: #b7d39d; }
    .metrics {
      position: fixed;
      z-index: 2;
      left: 14px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(4, minmax(108px, auto));
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(18, 22, 18, 0.88);
      backdrop-filter: blur(10px);
    }
    .metric { padding: 9px 12px 8px; border-right: 1px solid rgba(255, 255, 255, 0.08); }
    .metric:last-child { border-right: 0; }
    .metric-label {
      color: #7f8d7e;
      font-size: 10px;
      font-weight: 720;
      text-transform: uppercase;
    }
    .metric-value {
      margin-top: 3px;
      font-size: 13px;
      font-weight: 720;
      font-variant-numeric: tabular-nums;
    }
    .identity {
      position: fixed;
      z-index: 2;
      right: 14px;
      bottom: 14px;
      max-width: min(560px, calc(100vw - 28px));
      padding: 9px 11px;
      border-left: 3px solid #4fa67c;
      background: rgba(18, 22, 18, 0.88);
      color: #96a096;
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      backdrop-filter: blur(10px);
    }
    .identity strong { color: #e2e8de; }
    .identity[data-state="loading"] { border-left-color: #d4a54a; }
    .identity[data-state="error"] { border-left-color: #ef695f; }
    @media (max-width: 820px) {
      .toolbar { flex-wrap: wrap; }
      .title { width: 100%; }
      .spacer { display: none; }
      .metrics { grid-template-columns: repeat(2, minmax(108px, 1fr)); }
      .identity { display: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="toolbar">
    <div class="title">719024 <span>stationary Hill contact</span></div>
    <button type="button" id="play" aria-pressed="true">Pause</button>
    <button type="button" id="support" aria-pressed="true">Support on</button>
    <div class="spacer"></div>
    <label class="toggle"><input id="contacts" type="checkbox" checked /> Contact field</label>
    <label class="toggle"><input id="wireframe" type="checkbox" /> Wireframe</label>
  </div>
  <div class="metrics">
    <div class="metric"><div class="metric-label">Phase</div><div class="metric-value" id="phase">0%</div></div>
    <div class="metric"><div class="metric-label">Stance</div><div class="metric-value" id="stance">-</div></div>
    <div class="metric"><div class="metric-label">Max residual</div><div class="metric-value" id="residual">-</div></div>
    <div class="metric"><div class="metric-label">Realization</div><div class="metric-value">appendage-local carriers</div></div>
  </div>
  <div class="identity" id="identity" data-state="loading">
    <strong>loading exact route</strong><br />Source and support identity pending.
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import {
      createSupportPlacedFittedRig,
      evaluatePublishedStationaryContactPhase,
      STATIONARY_CONTACT_CONSTRAINTS_SHA256,
      STATIONARY_CONTACT_RECEIPT_SHA256,
      STATIONARY_HILL_PUBLISHED_CONTACT_ROUTE,
      verifyPublishedStationaryContactArtifacts,
    } from './lirm-stationary-hill-contact-core.mjs';
    import {
      decodeHillMotionAffordancePacket,
      sampleHillTerrainSurface,
    } from './hill-motion-affordance-source.mjs';
    import {
      createHillMotionSupportIdentity,
      createHillSampledSupportSurface,
    } from './hill-motion-support-adapter.js';

    const SOURCE_HASH = '8fed20d958ef48797c14ad1d3846a50eae05d43e6ae67f8805060b02f1abde8e';
    const REGISTRATION_SHA256 = 'sha256:a63fa02ffa7a144234eef3b9902ac9d349fd413d93a19c87ee1464b0b61ca7f9';
    const CONTACT_ATLAS_SHA256 = 'sha256:e3007a55f930d709ac8a7bf684ff32ad862e7d55186343220edb3e2ad3635b78';
    const PHASE_REPORT_SHA256 = 'sha256:97abeb1cdacb802ecf26e2aba6e27ae9d96508e6f85836853b9c3bdd993583ff';
    const HANDSHAKE_SHA256 = 'sha256:f6d5d91f71dd34feb5c632ca0c673cb82877a011e63d3e2348c851b2c5649112';
    const AXIAL_REGISTRATION_SHA256 = 'sha256:cb519913ad863441e88555b3d9fbd588ffef03650475de07c29ee1c71f500ff6';
    const HILL_PACKET_SHA256 = 'sha256:ab9900438d60ca3356327e700617c65fd65e75e4b2707d8e03da0e2f3dd8e9e2';
    const HILL_DATA_SHA256 = 'sha256:bd29f0464aecffdd35d79496b744b6d04175b1c2b8a80934fa3c88ed34874fd7';
    const SOURCE_URL = './artifacts/motion-ready-719024/creature.glb';
    const REGISTRATION_URL = './artifacts/lirm-719024-fitted-proxy-rig-mechanism-witness-v1/registration.json';
    const CONTACT_ATLAS_URL = './artifacts/lirm-719024-smooth-fitted-phase-exercise-v0/admitted-contact-atlas.json';
    const PHASE_REPORT_URL = './artifacts/lirm-719024-smooth-fitted-phase-exercise-v0/report.json';
    const HANDSHAKE_URL = './artifacts/lirm-719024-motion-contact-probe-handshake-v0/stationary-hill-request-response.json';
    const AXIAL_REGISTRATION_URL = './artifacts/motion-ready-719024/registration.json';
    const HILL_PACKET_URL = './artifacts/motion-ready-719024/hill/motion-affordance-packet.json';
    const HILL_DATA_URL = './artifacts/motion-ready-719024/hill/motion-affordance-data.json';
    const CONSTRAINTS_URL = './artifacts/motion-ready-719024/stationary-contact-constraints/constraints.json';
    const RECEIPT_URL = './artifacts/motion-ready-719024/stationary-contact-constraints/receipt.json';
    const PUBLISHED_EVENT_PHASE = 1.3 / (Math.PI * 2);
    const app = document.querySelector('#app');
    const playButton = document.querySelector('#play');
    const supportButton = document.querySelector('#support');
    const contactsInput = document.querySelector('#contacts');
    const wireframeInput = document.querySelector('#wireframe');
    const identity = document.querySelector('#identity');
    const phaseMetric = document.querySelector('#phase');
    const stanceMetric = document.querySelector('#stance');
    const residualMetric = document.querySelector('#residual');

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: true,
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.16;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.append(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171b17);
    scene.fog = new THREE.Fog(0x171b17, 5, 15);
    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.01, 50);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.minDistance = 0.65;
    controls.maxDistance = 8;

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.add(new THREE.HemisphereLight(0xe7eee2, 0x3a3228, 1.65));
    const key = new THREE.DirectionalLight(0xffefd5, 3.8);
    key.position.set(-3, 5, 3.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x91b8cf, 1.8);
    rim.position.set(4, 2.5, -4);
    scene.add(rim);

    const loader = new GLTFLoader();
    const contactRoot = new THREE.Group();
    contactRoot.name = 'contact-field';
    scene.add(contactRoot);
    const markers = new Map();
    let creatureRoot = null;
    let creatureMesh = null;
    let placedRig = null;
    let supportSurface = null;
    let prepass = null;
    let contactAtlas = null;
    let contactPlaneY = 0;
    let amplitude = 0.18;
    let phase = 0;
    let active = true;
    let supportActive = true;
    let lastTime = null;
    let lastSolveTime = -Infinity;
    let currentPacket = null;
    let hillSource = null;
    let publication = null;
    const cycleSeconds = 8.1;
    const solveIntervalMs = 1000 / 24;

    window.__LIRM_HILL_CONTACT_STATE__ = {
      status: 'loading',
      happy: false,
      requestedRoute: STATIONARY_HILL_PUBLISHED_CONTACT_ROUTE,
      effectiveRoute: null,
      sourceHash: SOURCE_HASH,
      actualSourceHash: null,
      inputHashes: null,
      supportSurface: null,
      supportActive: true,
      phase: 0,
      contactStates: {},
      maximumResidual: null,
      solveMilliseconds: null,
      directVertexTranslationCount: null,
      contactRoute: null,
      contactAuthority: null,
      carrierTransformCount: null,
      publication: null,
      cameraView: 'three-quarter',
    };

    async function sha256Hex(bytes) {
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return [...new Uint8Array(digest)].map(value => value.toString(16).padStart(2, '0')).join('');
    }

    async function loadExactJson(url, expectedHash) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`exact JSON load failed: ${url} ${response.status}`);
      const bytes = await response.arrayBuffer();
      const actualHash = `sha256:${await sha256Hex(bytes)}`;
      if (actualHash !== expectedHash) {
        throw new Error(`exact JSON hash mismatch for ${url}: ${actualHash} != ${expectedHash}`);
      }
      return {
        value: JSON.parse(new TextDecoder().decode(bytes)),
        bytes,
        sha256: actualHash,
      };
    }

    function normalizePositionArray(values) {
      const min = [Infinity, Infinity, Infinity];
      const max = [-Infinity, -Infinity, -Infinity];
      for (let index = 0; index < values.length; index += 3) {
        for (let axis = 0; axis < 3; axis += 1) {
          min[axis] = Math.min(min[axis], values[index + axis]);
          max[axis] = Math.max(max[axis], values[index + axis]);
        }
      }
      const center = min.map((value, axis) => (value + max[axis]) * 0.5);
      const diagonal = Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]);
      const scale = 2.15 / Math.max(diagonal, 1e-12);
      return {
        values: Float64Array.from(values, (value, index) => (value - center[index % 3]) * scale),
        center,
        scale,
      };
    }

    async function loadSource() {
      const response = await fetch(SOURCE_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error(`source load failed: ${response.status}`);
      const bytes = await response.arrayBuffer();
      const actualHash = await sha256Hex(bytes);
      if (actualHash !== SOURCE_HASH) throw new Error(`source hash mismatch: ${actualHash}`);
      const gltf = await new Promise((resolve, reject) => {
        loader.parse(bytes, new URL('.', new URL(SOURCE_URL, location.href)).href, resolve, reject);
      });
      return { root: gltf.scene, actualHash };
    }

    function findSingleMesh(root) {
      const meshes = [];
      root.traverse(node => { if (node.isMesh) meshes.push(node); });
      if (meshes.length !== 1) throw new Error(`stationary Hill viewer requires one exact mesh, got ${meshes.length}`);
      return meshes[0];
    }

    function buildTerrain() {
      const center = prepass.rootSurface;
      const half = 1.7;
      const segments = 54;
      const positions = [];
      const colors = [];
      const indices = [];
      for (let row = 0; row <= segments; row += 1) {
        for (let column = 0; column <= segments; column += 1) {
          const x = center[0] - half + column / segments * half * 2;
          const z = center[2] - half + row / segments * half * 2;
          const sample = sampleHillTerrainSurface(hillSource, x, z);
          positions.push(x, sample.height, z);
          const slope = 1 - sample.normal[1];
          const heightMix = THREE.MathUtils.clamp((sample.height - center[1] + 0.4) / 1.1, 0, 1);
          const low = new THREE.Color(0x394b32);
          const high = new THREE.Color(0x7b7950);
          const color = low.lerp(high, heightMix * 0.72 + slope * 0.45);
          colors.push(color.r, color.g, color.b);
        }
      }
      const stride = segments + 1;
      for (let row = 0; row < segments; row += 1) {
        for (let column = 0; column < segments; column += 1) {
          const a = row * stride + column;
          const b = a + 1;
          const c = a + stride;
          const d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      const terrain = new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.86,
          metalness: 0,
          side: THREE.DoubleSide,
        }),
      );
      terrain.receiveShadow = true;
      terrain.name = 'exact-hill-support-patch';
      scene.add(terrain);
    }

    function buildMarkers() {
      const geometry = new THREE.SphereGeometry(0.022, 18, 12);
      for (const probe of placedRig.probeBinding.probes) {
        const marker = new THREE.Mesh(
          geometry,
          new THREE.MeshBasicMaterial({ color: 0x66d7ff, depthTest: false }),
        );
        marker.name = `contact-${probe.id}`;
        marker.renderOrder = 20;
        markers.set(probe.id, marker);
        contactRoot.add(marker);
      }
    }

    function setWireframe(enabled) {
      if (!creatureRoot) return;
      creatureRoot.traverse(node => {
        if (!node.isMesh || !node.material) return;
        const materials = Array.isArray(node.material) ? node.material : [node.material];
        for (const material of materials) material.wireframe = enabled;
      });
    }

    function setPhase(nextPhase, force = false) {
      const solveStartedAt = performance.now();
      phase = ((Number(nextPhase) % 1) + 1) % 1;
      if (!placedRig) return null;
      const packet = evaluatePublishedStationaryContactPhase({
        placedRig,
        prepass,
        publication,
        bodyPhase: phase,
        amplitude,
        contactPlaneY,
        includeBaseline: !supportActive,
        clearance: 0.008,
        correctionGain: 0.82,
        maximumCorrection: 0.18,
        iterationCount: 3,
      });
      if (packet.effectiveRoute !== STATIONARY_HILL_PUBLISHED_CONTACT_ROUTE) {
        throw new Error(`effective route mismatch: ${packet.effectiveRoute}`);
      }
      const selected = supportActive ? packet.realized : packet.baseline;
      const position = creatureMesh.geometry.getAttribute('position');
      position.array.set(selected.worldPositions);
      position.needsUpdate = true;
      creatureMesh.geometry.computeVertexNormals();
      creatureMesh.geometry.computeBoundingSphere();
      const realizedById = new Map(packet.realized.probes.map(probe => [probe.id, probe]));
      const constraintsById = new Map(packet.constraints.patches.map(patch => [patch.id, patch]));
      for (const [id, marker] of markers) {
        const probe = realizedById.get(id);
        const constraint = constraintsById.get(id);
        marker.position.fromArray(probe.worldPosition);
        marker.material.color.setHex(
          constraint.contactState === 'stance' ? 0x74e6a1
            : constraint.contactState === 'release' ? 0xffbf63 : 0x62c9f4,
        );
      }
      currentPacket = packet;
      const patches = packet.realized.contactRealization.patches;
      const stanceCount = patches.filter(patch => patch.contactState === 'stance').length;
      const stancePatches = patches.filter(patch => patch.contactState === 'stance');
      const maximumResidual = Math.max(...stancePatches.map(patch => Math.abs(patch.residual)));
      phaseMetric.textContent = `${Math.round(phase * 100)}%`;
      stanceMetric.textContent = `${stanceCount} / ${patches.length}`;
      residualMetric.textContent = maximumResidual.toFixed(4);
      Object.assign(window.__LIRM_HILL_CONTACT_STATE__, {
        status: 'loaded',
        happy: true,
        effectiveRoute: packet.effectiveRoute,
        supportActive,
        phase,
        contactStates: Object.fromEntries(
          packet.constraints.patches.map(patch => [patch.id, patch.contactState]),
        ),
        maximumResidual,
        solveMilliseconds: performance.now() - solveStartedAt,
        directVertexTranslationCount: packet.realized.contactRealization.directVertexTranslationCount,
        contactRoute: packet.realized.effectiveRoute,
        contactAuthority: packet.realized.contactRealization.authority,
        carrierTransformCount: packet.realized.contactRealization.carrierTransformCount,
        publication: { ...packet.publication },
        forcedPhase: force,
      });
      return window.__LIRM_HILL_CONTACT_STATE__;
    }

    window.__setLirmHillContactPhase = value => {
      active = false;
      playButton.textContent = 'Play';
      playButton.setAttribute('aria-pressed', 'false');
      return setPhase(value, true);
    };

    function screenProbe() {
      if (!creatureRoot) throw new Error('creature is not mounted');
      creatureRoot.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(creatureRoot);
      const projected = [];
      for (const x of [bounds.min.x, bounds.max.x]) {
        for (const y of [bounds.min.y, bounds.max.y]) {
          for (const z of [bounds.min.z, bounds.max.z]) {
            const point = new THREE.Vector3(x, y, z).project(camera);
            projected.push({
              x: (point.x * 0.5 + 0.5) * innerWidth,
              y: (-point.y * 0.5 + 0.5) * innerHeight,
            });
          }
        }
      }
      const minX = Math.max(0, Math.min(...projected.map(point => point.x)));
      const minY = Math.max(0, Math.min(...projected.map(point => point.y)));
      const maxX = Math.min(innerWidth, Math.max(...projected.map(point => point.x)));
      const maxY = Math.min(innerHeight, Math.max(...projected.map(point => point.y)));
      return {
        viewport: { width: innerWidth, height: innerHeight },
        clipped: { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY },
        areaRatio: Math.max(0, maxX - minX) * Math.max(0, maxY - minY) / (innerWidth * innerHeight),
      };
    }

    window.__lirmHillContactScreenProbe = screenProbe;

    function frameScene(view = 'three-quarter') {
      const center = new THREE.Vector3(...prepass.rootSurface);
      let offset;
      if (view === 'posterior-closeup') {
        creatureMesh.geometry.computeBoundingBox();
        const bounds = creatureMesh.geometry.boundingBox;
        controls.target.set(
          (bounds.min.x + bounds.max.x) * 0.5,
          (bounds.min.y + bounds.max.y) * 0.5,
          bounds.max.z - (bounds.max.z - bounds.min.z) * 0.18,
        );
        offset = new THREE.Vector3(0.88, 0.24, 0.58);
        camera.position.copy(controls.target).add(offset);
      } else {
        controls.target.copy(center).add(new THREE.Vector3(0, 0.25, 0));
        offset = view === 'profile'
          ? new THREE.Vector3(1.55, 0.65, 1.72)
          : new THREE.Vector3(2.25, 0.95, 0);
        camera.position.copy(center).add(offset);
      }
      camera.lookAt(controls.target);
      controls.update();
      window.__LIRM_HILL_CONTACT_STATE__.cameraView = view;
      return { view, position: camera.position.toArray(), target: controls.target.toArray() };
    }
    window.__setLirmHillContactView = frameScene;
    window.__LIRM_HILL_CONTACT_EVENT_PHASE__ = PUBLISHED_EVENT_PHASE;

    async function boot() {
      try {
        const [
          source,
          registrationInput,
          atlasInput,
          phaseReportInput,
          handshakeInput,
          axialRegistrationInput,
          hillPacketInput,
          hillDataInput,
          constraintsPublication,
          receiptPublication,
        ] = await Promise.all([
          loadSource(),
          loadExactJson(REGISTRATION_URL, REGISTRATION_SHA256),
          loadExactJson(CONTACT_ATLAS_URL, CONTACT_ATLAS_SHA256),
          loadExactJson(PHASE_REPORT_URL, PHASE_REPORT_SHA256),
          loadExactJson(HANDSHAKE_URL, HANDSHAKE_SHA256),
          loadExactJson(AXIAL_REGISTRATION_URL, AXIAL_REGISTRATION_SHA256),
          loadExactJson(HILL_PACKET_URL, HILL_PACKET_SHA256),
          loadExactJson(HILL_DATA_URL, HILL_DATA_SHA256),
          loadExactJson(CONSTRAINTS_URL, STATIONARY_CONTACT_CONSTRAINTS_SHA256),
          loadExactJson(RECEIPT_URL, STATIONARY_CONTACT_RECEIPT_SHA256),
        ]);
        const registration = registrationInput.value;
        const atlas = atlasInput.value;
        const phaseReport = phaseReportInput.value;
        const handshake = handshakeInput.value;
        const axialRegistration = axialRegistrationInput.value;
        const hillPacket = hillPacketInput.value;
        const hillData = hillDataInput.value;
        hillSource = decodeHillMotionAffordancePacket({ packet: hillPacket, data: hillData });
        supportSurface = createHillSampledSupportSurface(
          hillSource,
          createHillMotionSupportIdentity(hillPacket),
        );
        prepass = handshake.prepass;
        contactAtlas = atlas;
        publication = await verifyPublishedStationaryContactArtifacts({
          constraintsBytes: constraintsPublication.bytes,
          receiptBytes: receiptPublication.bytes,
        });
        contactPlaneY = axialRegistration.contactPlaneY;
        amplitude = phaseReport.effectiveConfig.amplitude;
        creatureRoot = source.root;
        creatureMesh = findSingleMesh(creatureRoot);
        creatureMesh.geometry = creatureMesh.geometry.clone();
        creatureMesh.castShadow = true;
        creatureMesh.receiveShadow = true;
        creatureMesh.material = creatureMesh.material.clone();
        const sourcePosition = creatureMesh.geometry.getAttribute('position');
        const normalization = normalizePositionArray(sourcePosition.array);
        if (Math.max(...normalization.center.map(
          (value, axis) => Math.abs(value - handshake.normalization.center[axis]),
        )) > 1e-12 || Math.abs(normalization.scale - handshake.normalization.scale) > 1e-12) {
          throw new Error('browser source normalization diverged from admitted handshake');
        }
        placedRig = createSupportPlacedFittedRig({
          normalizedPositions: normalization.values,
          registration,
          normalization,
          bodyScale: prepass.body.scale,
          contactAtlas,
          contactAtlasSha256: phaseReport.contactAtlas.sha256,
          sampleCount: phaseReport.effectiveConfig.curveSampleCount,
        });
        scene.add(creatureRoot);
        buildTerrain();
        buildMarkers();
        const requestedPhase = Number(new URLSearchParams(location.search).get('phase') ?? 0.08);
        supportActive = new URLSearchParams(location.search).get('support') !== '0';
        supportButton.setAttribute('aria-pressed', String(supportActive));
        supportButton.textContent = supportActive ? 'Support on' : 'Support off';
        Object.assign(window.__LIRM_HILL_CONTACT_STATE__, {
          actualSourceHash: source.actualHash,
          supportSurface: { ...supportSurface.identity },
          inputHashes: {
            registration: registrationInput.sha256,
            contactAtlas: atlasInput.sha256,
            phaseReport: phaseReportInput.sha256,
            handshake: handshakeInput.sha256,
            axialRegistration: axialRegistrationInput.sha256,
            hillPacket: hillPacketInput.sha256,
            hillData: hillDataInput.sha256,
          },
        });
        setPhase(requestedPhase, true);
        frameScene();
        identity.dataset.state = 'loaded';
        identity.innerHTML = `<strong>happy | reviewed stationary constraints | appendage-local carriers</strong><br>${STATIONARY_HILL_PUBLISHED_CONTACT_ROUTE}<br>receipt ${STATIONARY_CONTACT_RECEIPT_SHA256.slice(7, 23)}... | Hill ${supportSurface.identity.revision} | zero direct vertex translations`;
      } catch (error) {
        identity.dataset.state = 'error';
        identity.innerHTML = `<strong>load failed</strong><br>${String(error?.message || error)}`;
        window.__LIRM_HILL_CONTACT_STATE__.status = 'error';
        window.__LIRM_HILL_CONTACT_STATE__.error = String(error?.stack || error);
        console.error(error);
      }
    }

    playButton.addEventListener('click', () => {
      active = !active;
      playButton.textContent = active ? 'Pause' : 'Play';
      playButton.setAttribute('aria-pressed', String(active));
      if (active) lastTime = null;
    });
    supportButton.addEventListener('click', () => {
      supportActive = !supportActive;
      supportButton.textContent = supportActive ? 'Support on' : 'Support off';
      supportButton.setAttribute('aria-pressed', String(supportActive));
      if (currentPacket) setPhase(phase, true);
    });
    contactsInput.addEventListener('change', () => { contactRoot.visible = contactsInput.checked; });
    wireframeInput.addEventListener('change', () => setWireframe(wireframeInput.checked));
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function render(time) {
      if (active && placedRig) {
        if (lastTime === null) lastTime = time;
        const delta = Math.min(0.1, Math.max(0, (time - lastTime) / 1000));
        lastTime = time;
        phase = (phase + delta / cycleSeconds) % 1;
        if (time - lastSolveTime >= solveIntervalMs) {
          setPhase(phase);
          lastSolveTime = time;
        }
      }
      controls.update();
      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(render);
    boot();
  </script>
</body>
</html>
