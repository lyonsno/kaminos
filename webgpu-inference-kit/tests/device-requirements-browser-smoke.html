<!doctype html>
<meta charset="utf-8">
<title>WebGPU Device Requirements Contract</title>
<script type="module">
import { composeWebGpuDeviceRequirements, createWebGpuDeviceRequest, validateWebGpuDeviceRequirements } from '../src/index.js';

window.deviceRequirementsResult = (async () => {
  let device;
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('WebGPU adapter unavailable');
    const requirements = composeWebGpuDeviceRequirements([
      { requiredFeatures: ['shader-f16'], requiredLimits: { maxBufferSize: 905969664, maxStorageBufferBindingSize: 905969664 } },
      { requiredLimits: { maxStorageBuffersPerShaderStage: 9, minUniformBufferOffsetAlignment: adapter.limits.minUniformBufferOffsetAlignment } },
    ]);
    const requested = createWebGpuDeviceRequest(adapter, { requirements });
    device = await adapter.requestDevice(requested);
    const validation = validateWebGpuDeviceRequirements(device, requirements);
    if (!validation.ok) throw new Error(validation.errors.join('; '));
    const impossible = { requiredLimits: { maxBufferSize: adapter.limits.maxBufferSize * 2 } };
    if (validateWebGpuDeviceRequirements(device, impossible).ok) throw new Error('impossible requirement accepted');
    let nativeRejected = false;
    try { const unexpected = await adapter.requestDevice(impossible); unexpected.destroy(); } catch { nativeRejected = true; }
    if (!nativeRejected) throw new Error('native requestDevice accepted above-adapter limit');
    return {
      status: 'succeeded', route: location.href, moduleUrl: new URL('../src/index.js', location.href).href,
      browser: navigator.userAgent, adapter: { vendor: adapter.info.vendor, architecture: adapter.info.architecture, device: adapter.info.device, description: adapter.info.description },
      requested, effective: { features: [...device.features], limits: Object.fromEntries(Object.keys(requirements.requiredLimits).map(key => [key, device.limits[key]])) },
      validation, nativeRejected,
    };
  } finally { device?.destroy(); }
})();
</script>
