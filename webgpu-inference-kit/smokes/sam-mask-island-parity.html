<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SAM Mask Island Parity Smoke</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #101312;
        color: #f3f7f2;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(320px, 440px) 1fr;
      }
      aside {
        padding: 18px;
        border-right: 1px solid #3d4742;
        background: #151a18;
      }
      main {
        padding: 18px;
        display: grid;
        align-content: start;
        gap: 14px;
      }
      h1 {
        font-size: 18px;
        line-height: 1.25;
        margin: 0 0 12px;
      }
      dl {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 6px 10px;
        font-size: 12px;
        margin: 0;
      }
      dt {
        color: #9fafaa;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #status {
        font-size: 13px;
        line-height: 1.35;
        min-height: 36px;
      }
      canvas {
        width: min(920px, 100%);
        image-rendering: pixelated;
        border: 1px solid #59635e;
        background: #050706;
      }
      #sam-source-image {
        display: none;
      }
      pre {
        margin: 0;
        max-width: 100%;
        overflow: auto;
        padding: 12px;
        background: #050706;
        border: 1px solid #35403b;
        font-size: 11px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>SAM Mask Island Parity</h1>
      <div id="status">initializing</div>
      <dl id="summary"></dl>
    </aside>
    <main>
      <img id="sam-source-image" alt="SAM source image">
      <canvas id="sam-mask-parity-canvas" width="920" height="260" aria-label="SAM source, reference, WebGPU, and diff visualization"></canvas>
      <pre id="report">{}</pre>
    </main>
    <script type="module" src="./sam-mask-island-parity.js"></script>
  </body>
</html>
