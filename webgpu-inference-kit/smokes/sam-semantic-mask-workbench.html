<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAM 3.1 Semantic Mask Workbench</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111315;
      color: #edf1f2;
      font-synthesis: none;
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #111315; }
    button, input { font: inherit; letter-spacing: 0; }

    .topbar {
      min-height: 64px;
      padding: 12px 20px;
      border-bottom: 1px solid #303438;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: #171a1d;
    }

    .title-group { min-width: 0; }
    h1 { margin: 0; font-size: 17px; line-height: 1.2; font-weight: 650; }
    .subtitle { margin-top: 4px; color: #91999f; font-size: 12px; }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #b8c0c4;
      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #758087; }
    [data-state="running"] .status-dot { background: #e0aa42; box-shadow: 0 0 0 3px #e0aa4225; }
    [data-state="complete"] .status-dot { background: #59c68a; box-shadow: 0 0 0 3px #59c68a25; }
    [data-state="warning"] .status-dot { background: #ef7c62; box-shadow: 0 0 0 3px #ef7c6225; }
    [data-state="failed"] .status-dot { background: #ef5f67; box-shadow: 0 0 0 3px #ef5f6725; }

    .controls {
      padding: 16px 20px;
      border-bottom: 1px solid #303438;
      display: grid;
      grid-template-columns: minmax(260px, 420px) minmax(320px, 1fr) auto;
      gap: 16px;
      align-items: end;
      background: #141719;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: #aab1b5;
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
    }

    #sample-picker {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .sample-button {
      height: 44px;
      padding: 0 10px;
      border: 1px solid #3a4044;
      border-radius: 5px;
      background: #202428;
      color: #b9c0c4;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sample-button:hover { border-color: #626c72; color: #f1f4f5; }
    .sample-button[aria-pressed="true"] { border-color: #6ec4e7; color: #f4fbfd; background: #20333c; }

    #prompt-input {
      width: 100%;
      height: 44px;
      border: 1px solid #454b50;
      border-radius: 5px;
      padding: 0 12px;
      background: #0f1113;
      color: #f4f6f7;
      outline: none;
    }

    #prompt-input:focus { border-color: #71c9ea; box-shadow: 0 0 0 3px #71c9ea18; }

    .commands { display: flex; gap: 8px; }
    .command {
      height: 44px;
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 0 15px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 620;
    }

    #run-segmentation { background: #d7f06b; color: #151806; }
    #run-segmentation:hover { background: #e5f890; }
    #run-negative-control { border-color: #6c4b45; background: #281d1a; color: #f0a493; }
    #run-negative-control:hover { border-color: #a56b5f; }
    .command:disabled { opacity: .48; cursor: wait; }

    .visual-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      min-height: min(62vh, 720px);
    }

    .visual-panel { min-width: 0; padding: 16px; border-right: 1px solid #303438; }
    .visual-panel:last-child { border-right: 0; }
    .panel-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    h2 { margin: 0; font-size: 13px; font-weight: 650; }
    .panel-meta { color: #778087; font-size: 11px; white-space: nowrap; }

    .canvas-stage {
      width: 100%;
      min-height: 280px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background-color: #090b0c;
      background-image:
        linear-gradient(45deg, #171a1c 25%, transparent 25%),
        linear-gradient(-45deg, #171a1c 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #171a1c 75%),
        linear-gradient(-45deg, transparent 75%, #171a1c 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      border: 1px solid #2d3235;
      border-radius: 4px;
    }

    canvas { display: block; width: 100%; height: auto; max-height: 68vh; object-fit: contain; }
    #mask-canvas { image-rendering: pixelated; }

    .evidence-bar {
      border-top: 1px solid #303438;
      display: grid;
      grid-template-columns: minmax(200px, 1.4fr) repeat(4, minmax(100px, 1fr));
      background: #171a1d;
    }

    .evidence-cell { min-width: 0; padding: 11px 16px; border-right: 1px solid #303438; }
    .evidence-cell:last-child { border-right: 0; }
    .evidence-key { display: block; color: #778087; font-size: 10px; text-transform: uppercase; margin-bottom: 4px; }
    .evidence-value { display: block; color: #c9d0d3; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #effective-route { color: #88d4ef; }

    #sam-mask-runtime-frame { position: fixed; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }

    @media (max-width: 980px) {
      .controls { grid-template-columns: 1fr; align-items: stretch; }
      .commands { justify-content: stretch; }
      .command { flex: 1; }
      .visual-grid { grid-template-columns: 1fr; }
      .visual-panel { border-right: 0; border-bottom: 1px solid #303438; }
      .visual-panel:last-child { border-bottom: 0; }
      .evidence-bar { grid-template-columns: 1fr 1fr; }
      .evidence-cell { border-bottom: 1px solid #303438; }
    }

    @media (max-width: 560px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .controls, .visual-panel { padding-left: 12px; padding-right: 12px; }
      #sample-picker { grid-template-columns: 1fr; }
      .commands { flex-direction: column; }
      .evidence-bar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title-group">
      <h1>SAM 3.1 semantic mask workbench</h1>
      <div class="subtitle">Browser-owned image + text · WebGPU detector stack</div>
    </div>
    <div id="workbench-status" class="status-chip" data-state="idle" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-text">Select a sample and run</span>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Segmentation controls">
      <div>
        <span class="field-label">Sample image</span>
        <div id="sample-picker" role="group" aria-label="Sample image"></div>
      </div>
      <form id="prompt-form">
        <label class="field-label" for="prompt-input">Text prompt</label>
        <input id="prompt-input" name="prompt" type="text" autocomplete="off" value="truck">
      </form>
      <div class="commands">
        <button id="run-segmentation" class="command" type="submit" form="prompt-form">Run mask</button>
        <button id="run-negative-control" class="command" type="button" disabled>Negative control</button>
      </div>
    </section>

    <section class="visual-grid" aria-label="Mask output">
      <article class="visual-panel">
        <div class="panel-heading"><h2>Source</h2><span id="source-meta" class="panel-meta">1800 × 1200</span></div>
        <div class="canvas-stage"><canvas id="source-canvas" width="900" height="600"></canvas></div>
      </article>
      <article class="visual-panel">
        <div class="panel-heading"><h2>Selected mask</h2><span id="overlay-meta" class="panel-meta">No output</span></div>
        <div class="canvas-stage"><canvas id="overlay-canvas" width="900" height="600"></canvas></div>
      </article>
      <article class="visual-panel">
        <div class="panel-heading"><h2>Raw mask</h2><span id="mask-meta" class="panel-meta">64 × 64</span></div>
        <div class="canvas-stage"><canvas id="mask-canvas" width="600" height="600"></canvas></div>
      </article>
    </section>
  </main>

  <footer class="evidence-bar" aria-label="Invocation evidence">
    <div class="evidence-cell"><span class="evidence-key">Effective route</span><span id="effective-route" class="evidence-value">Not run</span></div>
    <div class="evidence-cell"><span class="evidence-key">Authority</span><span id="output-authority" class="evidence-value">No output</span></div>
    <div class="evidence-cell"><span class="evidence-key">Candidate</span><span id="candidate-evidence" class="evidence-value">Not selected</span></div>
    <div class="evidence-cell"><span class="evidence-key">Foreground</span><span id="foreground-evidence" class="evidence-value">0 px</span></div>
    <div class="evidence-cell"><span class="evidence-key">Control</span><span id="control-evidence" class="evidence-value">Not run</span></div>
  </footer>

  <iframe id="sam-mask-runtime-frame" title="SAM 3.1 WebGPU runtime"></iframe>
  <script type="module" src="./sam-semantic-mask-workbench.js"></script>
</body>
</html>
