      prefixTokens:5,tokenCount:1029,hiddenSize:1024,heads:16,headDim:64,intermediateSize:4096,ropeTheta:100,layerNormEpsilon:1e-5,
    } },
    onPhase:async ({phase,phaseIndex,lastCompletedPhase})=>{
      setPhase(phase,{phaseIndex,lastCompletedPhase});
    },
  };
  const layerWeightSuffixes={
    norm1Weight:'norm1_weight',norm1Bias:'norm1_bias',
    qWeight:'q_weight',qBias:'q_bias',kWeight:'k_weight',
    vWeight:'v_weight',vBias:'v_bias',oWeight:'o_weight',oBias:'o_bias',
    layerScale1:'layer_scale1',norm2Weight:'norm2_weight',norm2Bias:'norm2_bias',
    mlpUpWeight:'mlp_up_weight',mlpUpBias:'mlp_up_bias',
    mlpDownWeight:'mlp_down_weight',mlpDownBias:'mlp_down_bias',layerScale2:'layer_scale2',
  };
  const streamedLayerWeightReceipts=[];
  const loadLayerWeights=async blockIndex=>{
    if(!residentFullConditioningMode||!Number.isInteger(blockIndex)||blockIndex<3||blockIndex>23) throw new Error(`full-conditioning weight loader rejects block ${blockIndex}`);
    const loaded={};
    const files=[];
    for(const [weightName,suffix] of Object.entries(layerWeightSuffixes)) {
      const tensorName=`layer${blockIndex}_${suffix}`;
      const tensor=await readTensor(manifest,tensorName);
      loaded[weightName]=tensor.values;
      files.push({tensorName,sha256:tensor.sha256,byteLength:tensor.bytes.byteLength,shape:tensor.entry.shape});
    }
    streamedLayerWeightReceipts.push({blockIndex,files});
    state.streamedLayerWeightReceipts=streamedLayerWeightReceipts;
    render();
    return loaded;
  };
  if(residentFullConditioningMode) routeInput.loadLayerWeights=loadLayerWeights;
  const runFullConditioningThroughSession=async()=>{
    inferenceSession=await kit.createWebGpuInferenceSession({sessionId:`trellis-dinov3-full-conditioning-${invocationId}`,adapter,device,backendIdentity,adapterName,browser});
    inferenceRoute=await inferenceSession.registerRoute({
      routeId:state.requestedRouteId,
      runtimeOptions:{runtimeLabel:'trellis-dinov3-full-conditioning-session-runtime',kernel:{profile:'trellis2-dinov3-full-conditioning-resident-session-v0',commit:query.get('sourceRevision')||'unreported-source-revision'},yieldMs:0},
    });
    evidence('full conditioner registered one Kaminos session route; all DINO blocks execute inside its admitted invocation on the borrowed host device',{
      sessionRouteId:inferenceRoute.routeId,runtimeRouteId:inferenceRoute.runtime.routeId,deviceOwnership:'borrowed-by-session',manifestSha256,
    });
    const job=inferenceRoute.enqueue({
      jobId:invocationId,
      metadata:{modelId:model.id,modelRevision:model.revision,mode:'resident-full-conditioning',referenceManifestSha256:manifestSha256},
      execute:invocation=>residentProbe.runTrellisDinoV3PrefixBlockResidentFullConditioningProbe({
        ...routeInput,sessionRoute:inferenceRoute,schedulerInvocation:invocation,
      }),
    });
    const completion=await job.completion;
    inferenceRoute.forgetJob(job.jobId);
    await inferenceRoute.drain();
    if(completion.status!=='succeeded') throw new Error(completion.failure?.message||completion.cancellation?.reason||`full-conditioning session job ended ${completion.status}`);
    return completion.output;
  };
  const result = residentFullConditioningMode
    ? await runFullConditioningThroughSession()
    : residentBlock2MlpMode
    ? await residentProbe.runTrellisDinoV3PrefixBlockResidentBlock2MlpProbe({ ...routeInput, block1Norm1Weight, block1Norm1Bias, ...block1AttentionWeights, ...block1MlpWeights, ...block2Norm1Weights, ...block2AttentionWeights, ...block2MlpWeights })
    : residentBlock2AttentionMode
    ? await residentProbe.runTrellisDinoV3PrefixBlockResidentBlock2AttentionProbe({ ...routeInput, block1Norm1Weight, block1Norm1Bias, ...block1AttentionWeights, ...block1MlpWeights, ...block2Norm1Weights, ...block2AttentionWeights })
    : residentBlock2Norm1Mode
    ? await residentProbe.runTrellisDinoV3PrefixBlockResidentBlock2Norm1Probe({ ...routeInput, block1Norm1Weight, block1Norm1Bias, ...block1AttentionWeights, ...block1MlpWeights, ...block2Norm1Weights })
    : residentBlock1Mode
    ? await residentProbe.runTrellisDinoV3PrefixBlockResidentBlock1Probe({ ...routeInput, block1Norm1Weight, block1Norm1Bias, ...block1AttentionWeights, ...block1MlpWeights })
    : residentHandoffMode
      ? await residentProbe.runTrellisDinoV3PrefixBlockResidentHandoffProbe({ ...routeInput, block1Norm1Weight, block1Norm1Bias, ...block1AttentionWeights })
    : await modelRoute.runTrellisDinoV3PrefixBlockPhaseProgramRoute({ ...routeInput, includeReadback:true });
  if (residentMode) {
    if (result.status !== 'diagnostic-probe-complete' || result.authority !== 'non-authoritative-diagnostic') throw new Error('resident handoff result is not explicitly diagnostic-only');
    if (result.requestedProbeRouteId !== state.requestedRouteId || result.runtimeRouteId !== state.requestedRouteId) throw new Error('resident handoff probe route identity mismatch');
    if (residentFullConditioningMode) {
      if (result.block0Readback !== 'skipped' || result.completeTransformerBlockCount !== 24 || result.finalNoAffineLayerNormApplied !== true || result.downstream?.operation !== 'dinov3-final-no-affine-layernorm-conditioning-features' || result.downstream?.dtype !== 'f32' || JSON.stringify(result.downstream?.shape) !== '[1,1029,1024]') throw new Error('full-conditioning probe did not prove 24 complete blocks plus final no-affine LayerNorm at the exact F32 output shape');
      state.completeTransformerBlockCount = result.completeTransformerBlockCount;
      state.finalNoAffineLayerNormApplied = result.finalNoAffineLayerNormApplied;
    } else {
      const expectedOperation = residentBlock2MlpMode ? 'dinov3-block2-mlp-residual' : residentBlock2AttentionMode ? 'dinov3-block2-attention-residual' : residentBlock2Norm1Mode ? 'dinov3-block2-layernorm1' : residentBlock1Mode ? 'dinov3-block1-mlp-residual' : 'dinov3-block1-attention-residual';
      if (result.block0Readback !== 'skipped' || result.downstream?.operation !== expectedOperation) throw new Error('resident probe did not keep the requested DINO stages resident until diagnostic readback');
    }
    if (result.computeRouteId !== route.routeId) throw new Error('resident probe compute route does not match the pinned block-0 implementation');
    state.effectiveRouteId = result.runtimeRouteId;
    state.backend = result.backend;
    state.receipt = null;
    state.authority = 'non-authoritative-diagnostic';
    state.downstream = result.downstream;
  } else {
    state.requestedRouteId = route.routeId;
    state.effectiveRouteId = result.receipt?.effectiveRouteId || null;
    state.backend = result.receipt?.backend || null;
    state.receipt = result.receipt;
    state.authority = 'route-receipt';
  }
  state.model = model;
  state.kernel = kernel;
  state.precision.execution = residentFullConditioningMode ? 'observed-f32-resident-full-conditioning-diagnostic; block0-readback-skipped' : residentMode ? 'observed-f32-resident-consumer; block0-readback-skipped' : 'observed-f32-output-readback';
  if (residentFullConditioningMode) evidence('the same session-route invocation completed all 24 F32 DINOv3 blocks and final no-affine LayerNorm without intermediate host readback; only the final conditioning tensor was read back for parity', { requestedProbeRouteId:result.requestedProbeRouteId, runtimeRouteId:result.runtimeRouteId, computeRouteId:result.computeRouteId, transfer:result.transfer, downstream:result.downstream, completeTransformerBlockCount:result.completeTransformerBlockCount, finalNoAffineLayerNormApplied:result.finalNoAffineLayerNormApplied, authority:result.authority });
  else if (residentMode) evidence('block-0 output stayed in the same WebGPU runtime/device and fed the requested resident DINO stages before block-0 host readback', { requestedProbeRouteId:result.requestedProbeRouteId, runtimeRouteId:result.runtimeRouteId, computeRouteId:result.computeRouteId, transfer:result.transfer, downstream:result.downstream, authority:result.authority });
  if (!residentMode) {
    if (result.receipt?.status !== 'real' || result.receipt?.requestedRouteId !== route.routeId || result.receipt?.effectiveRouteId !== route.routeId) throw new Error('WebGPU route receipt is missing, fallback, or does not match requested route identity');
    if (result.receipt?.model?.id !== model.id || result.receipt?.model?.revision !== model.revision || result.receipt?.model?.weightsHash !== model.weightsHash || result.receipt?.model?.dtype !== 'fp32') throw new Error('effective route receipt model/checkpoint/precision identity mismatch');
  }
  const actual = residentFullConditioningMode
    ? result.debugResidentFullConditioning
    : residentBlock2MlpMode
    ? {
      ...result.debugResidentBlock2Mlp,
      outputValues: {
        ...(result.debugResidentBlock1?.outputValues || {}),
        ...(result.debugResidentBlock2Attention?.outputValues || {}),
        ...(result.debugResidentBlock2Mlp?.outputValues || {}),
      },
    }
    : residentBlock2AttentionMode
    ? {
      ...result.debugResidentBlock2Attention,
      outputValues: {
        ...(result.debugResidentBlock1?.outputValues || {}),
        ...(result.debugResidentBlock2Attention?.outputValues || {}),
      },
    }
    : residentBlock1Mode ? result.debugResidentBlock1 : residentHandoffMode ? result.debugResidentHandoff : result.debugReadback;
  if (residentFullConditioningMode) {
    if (actual?.operation !== 'dinov3-final-no-affine-layernorm-conditioning-features' || !(actual.outputValues instanceof Float32Array) || actual.tensor?.dtype !== 'f32' || JSON.stringify(actual.tensor?.shape) !== '[1,1029,1024]') throw new Error('resident conditioner did not return the exact final F32 conditioning tensor and device-buffer identity');
    const streamedBlocks=state.streamedLayerWeightReceipts||[];
    if (streamedBlocks.length!==21 || streamedBlocks.some((receipt,index)=>receipt.blockIndex!==index+3||receipt.files.length!==17||receipt.files.some(file=>!file.sha256||file.byteLength!==file.shape.reduce((count,axis)=>count*axis,1)*4))) throw new Error('full conditioner did not hash-verify all 17 F32 checkpoint tensors for every block 3 through 23');
  } else if (residentBlock2MlpMode) {
    if (actual?.operation !== 'dinov3-block2-mlp-residual' || !actual.outputValues || Object.values(actual.outputValues).some(values=>!(values instanceof Float32Array))) throw new Error('resident consumer did not return all downstream F32 full-block-2 diagnostic tensors');
  } else if (residentBlock2AttentionMode) {
    if (actual?.operation !== 'dinov3-block2-attention-residual' || !actual.outputValues || Object.values(actual.outputValues).some(values=>!(values instanceof Float32Array))) throw new Error('resident consumer did not return all downstream F32 block-2 diagnostic tensors');
  } else if (residentBlock1Mode) {
    if (actual?.operation !== 'dinov3-block1-mlp-residual' || !actual.outputValues || Object.values(actual.outputValues).some(values=>!(values instanceof Float32Array))) throw new Error('resident consumer did not return all downstream F32 block-1 diagnostic tensors');
  } else if (residentHandoffMode) {
    if (actual?.operation !== 'dinov3-block1-attention-residual' || !(actual.outputValues instanceof Float32Array)) throw new Error('resident consumer did not return a downstream F32 attention-residual diagnostic output');
  } else if (actual?.dtype !== 'float32') throw new Error('WebGPU route did not return F32 diagnostic outputs');
  const comparisons = residentFullConditioningMode
    ? [['conditioningFeatures','conditioning_features']]
    : residentBlock2MlpMode
    ? [['block1Attention','block1_after_attention_hidden_states'],['block1Norm2','block1_norm2_hidden_states'],['block1MlpHidden','block1_mlp_hidden_states'],['block1MlpProjection','block1_mlp_output'],['block1Output','block1_after_mlp_hidden_states'],['block2Norm1','block2_norm1_hidden_states'],['block2Attention','block2_after_attention_hidden_states'],['block2Norm2','block2_norm2_hidden_states'],['block2MlpHidden','block2_mlp_hidden_states'],['block2MlpProjection','block2_mlp_output'],['block2Output','block2_after_mlp_hidden_states']]
    : residentBlock2AttentionMode
    ? [['block1Attention','block1_after_attention_hidden_states'],['block1Norm2','block1_norm2_hidden_states'],['block1MlpHidden','block1_mlp_hidden_states'],['block1MlpProjection','block1_mlp_output'],['block1Output','block1_after_mlp_hidden_states'],['block2Norm1','block2_norm1_hidden_states'],['block2Attention','block2_after_attention_hidden_states']]
    : residentBlock2Norm1Mode
    ? [['block1Attention','block1_after_attention_hidden_states'],['block1Norm2','block1_norm2_hidden_states'],['block1MlpHidden','block1_mlp_hidden_states'],['block1MlpProjection','block1_mlp_output'],['block1Output','block1_after_mlp_hidden_states'],['block2Norm1','block2_norm1_hidden_states']]
    : residentBlock1Mode
    ? [['block1Attention','block1_after_attention_hidden_states'],['block1Norm2','block1_norm2_hidden_states'],['block1MlpHidden','block1_mlp_hidden_states'],['block1MlpProjection','block1_mlp_output'],['block1Output','block1_after_mlp_hidden_states']]
    : residentHandoffMode
      ? [['block1Attention','block1_after_attention_hidden_states']]
    : [['patchEmbeddings','patch_embeddings'],['prefixHiddenStates','prefix_hidden_states'],['block0HiddenStates','block0_hidden_states']];
  for (const [routeName, referenceName] of comparisons) {
    setPhase(`persist-and-compare-${routeName}`);
    const actualValues = residentFullConditioningMode
      ? actual.outputValues
      : residentBlock2MlpMode || residentBlock2AttentionMode
      ? actual.outputValues[routeName]
      : routeName==='block2Norm1'
        ? result.debugResidentBlock2Norm1?.outputValues
        : residentBlock1Mode ? actual.outputValues[routeName] : residentHandoffMode ? actual.outputValues : actual[routeName];
    await persistGpuTensor(routeName, actualValues, references[referenceName]);
    state.comparisons[routeName] = compareTensor(routeName, actualValues, references[referenceName].values, requestedAtol, requestedRtol);
    state.comparisons[routeName].referenceSha256 = references[referenceName].sha256;
    state.comparisons[routeName].webgpuSha256 = state.actualOutputs[routeName].sha256;
    evidence(`F32 ${routeName} compared with same-invocation pinned MLX tensor`, state.comparisons[routeName]);
  }
  const failedComparisons = Object.values(state.comparisons).filter(comparison=>!comparison.pass);
  if (failedComparisons.length) throw new Error(`tensor parity failed: ${failedComparisons.map(item=>`${item.name} maxAbs=${item.maxAbs} failures=${item.failureCount}`).join('; ')}`);
  if (residentFullConditioningMode ? !state.actualOutputs.conditioningFeatures : residentMode ? !state.actualOutputs.block1Attention || residentBlock2AttentionMode && !state.actualOutputs.block2Attention || residentBlock2MlpMode && !state.actualOutputs.block2Output : (!state.actualOutputs.patchEmbeddings || !state.actualOutputs.prefixHiddenStates || !state.actualOutputs.block0HiddenStates)) throw new Error('one or more required GPU outputs were not persisted');
  if (residentFullConditioningMode) await closeInferenceSession();
  else if (activeDevice) { activeDevice.destroy(); activeDevice = null; }
  state.status = 'passed';
  state.failurePhase = null;
  state.claim = residentFullConditioningMode
    ? 'observed: one registered Kaminos session-route invocation executed all 24 DINOv3 transformer blocks and final no-affine LayerNorm in F32, retained intermediate tensors on the same WebGPU device, and its final [1,1029,1024] conditioning tensor matched the same-job pinned MLX F32 output within recorded tolerance; diagnostic parity only, not yet consumed by native TRELLIS conditioning or an end-to-end image-to-3D route'
    : residentBlock2MlpMode
    ? 'observed: the live F32 tensor passed through three complete DINOv3 blocks on the same WebGPU runtime/device without intermediate host readback; all eleven captured F32 boundaries matched same-job pinned MLX F32 within recorded tolerance; diagnostic probe only, final model LayerNorm and TRELLIS conditioning not included'
    : residentBlock2AttentionMode
    ? 'observed: the live F32 tensor passed through complete DINOv3 blocks 0 and 1, then block-2 norm1 and attention on the same WebGPU runtime/device without intermediate host readback; all seven captured F32 boundaries matched same-job pinned MLX F32 within recorded tolerance; diagnostic probe only, not full conditioning'
    : residentBlock2Norm1Mode
    ? 'observed: the live F32 tensor passed through complete DINOv3 blocks 0 and 1, then fed block-2 norm1 on the same WebGPU runtime/device without intermediate host readback; all six captured F32 boundaries matched same-job pinned MLX F32 within recorded tolerance; diagnostic probe only, not full conditioning'
    : residentBlock1Mode
    ? 'observed: the live block-0 F32 GPU tensor fed block-1 norm1, attention, norm2, GELU MLP, and both LayerScale residuals on the same runtime/device without block-0 host readback; each captured stage tensor matched same-job pinned MLX F32 within recorded tolerance; diagnostic probe only, not full conditioning'
    : residentHandoffMode
      ? 'observed: the live block-0 F32 GPU tensor fed block-1 LayerNorm, Q/K/V, RoPE, global attention, output projection, and LayerScale residual on the same runtime/device without block-0 host readback; the attention-residual output matched same-job pinned MLX F32 within recorded tolerance; diagnostic probe only, not full conditioning'
    : 'observed: exact pinned F32 MLX/WebGPU patch, prefix, and complete block-0 tensors satisfy the recorded comparison tolerance; not an end-to-end TRELLIS conditioning handoff';
  render();
} catch (error) {
  state.status = 'failed';
  state.failurePhase = error?.dinov3FailurePhase || state.phase;
  state.lastCompletedPhase = error?.dinov3LastCompletedPhase || state.currentPhaseDetail?.lastCompletedPhase || null;
  state.error = String(error?.stack || error);
  state.claim = 'no completed matched F32 parity claim; inspect persisted actualOutputs and last trustworthy evidence for any partial work';
  try { await closeInferenceSession(); } catch (cleanupError) { state.cleanupError = String(cleanupError?.stack || cleanupError); }
  render();
}
</script>
