<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SAM Browser Serving Runtime</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #101312; color: #f3f7f2; }
      body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: minmax(320px, 440px) 1fr; }
      aside, main { padding: 18px; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      dl { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; font-size: 12px; }
      dd { margin: 0; overflow-wrap: anywhere; }
      canvas { width: min(920px, 100%); image-rendering: pixelated; }
      #sam-source-image { display: none; }
      pre { max-width: 100%; overflow: auto; font-size: 11px; }
    </style>
  </head>
  <body data-runtime-mode="serving">
    <aside>
      <h1>SAM Browser Serving Runtime</h1>
      <div id="status">initializing</div>
      <dl id="summary"></dl>
    </aside>
    <main>
      <img id="sam-source-image" alt="SAM source image">
      <canvas id="sam-mask-parity-canvas" width="920" height="260" aria-label="SAM browser serving output"></canvas>
      <pre id="report">{}</pre>
    </main>
    <script type="module" src="./sam-mask-island-parity.js"></script>
  </body>
</html>
