<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaminos Native 64 Causal Cue Feedback</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #020303; color: #edf4f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; background: #020303; }
    #frame { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
    #causalNativeSource { width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
    #controls { position: fixed; z-index: 10; inset: 10px 10px auto; display: grid; grid-template-columns: auto minmax(260px, 1fr) auto auto; align-items: center; gap: 8px; padding: 8px; border: 1px solid #38464a; border-radius: 6px; background: rgba(6, 9, 10, .94); }
    #roles { display: flex; gap: 2px; }
    button { min-height: 34px; border: 1px solid #43545a; border-radius: 4px; background: #111718; color: #dce8eb; padding: 0 10px; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #8ac9ff; background: #163044; color: #fff; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #aab9bd; font: 10px/1.35 "SF Mono", Menlo, monospace; }
    #identity { position: fixed; z-index: 10; inset: auto 10px 10px; max-width: calc(100vw - 20px); padding: 7px 9px; border: 1px solid #303b3e; border-radius: 5px; background: rgba(4, 7, 7, .86); color: #c7d5d8; font: 10px/1.4 "SF Mono", Menlo, monospace; }
    #runner { position: fixed; left: -2400px; top: 0; width: 960px; height: 720px; opacity: .01; pointer-events: none; border: 0; }
    @media (max-width: 900px) { #controls { grid-template-columns: 1fr auto auto; } #roles { grid-column: 1 / -1; overflow-x: auto; } }
  </style>
</head>
<body>
  <main id="frame"><img id="causalNativeSource" alt="Causally evolved native 64 source"></main>
  <div id="controls">
    <div id="roles" aria-label="Causal role"></div>
    <div id="status">Starting native 64 causal receiver...</div>
    <button id="step" type="button">Step</button>
    <button id="auto" type="button" aria-pressed="false">Play</button>
  </div>
  <div id="identity">No frame captured</div>
  <iframe id="runner" title="native64 causal receiver"></iframe>
  <script type="module">
    const CAUSAL_ROLES = Object.freeze(['control', 'self', 'learnedContinuous', 'learnedRelease']);
    const params = new URLSearchParams(location.search);
    const requestedRole = CAUSAL_ROLES.includes(params.get('role')) ? params.get('role') : 'control';
    const preRollSteps = Math.max(0, Math.round(Number(params.get('preroll_steps') || 96)));
    const warmupSteps = Math.max(1, Math.round(Number(params.get('warmup_steps') || 30)));
    const releaseSteps = Math.max(1, Math.round(Number(params.get('release_steps') || 30)));
    const curlNoiseGain = Math.max(0, Math.min(3, Number(params.get('curl_noise_gain') || 0.72)));
    const vorticityGain = Math.max(0, Math.min(3, Number(params.get('vorticity_gain') || 0.52)));
    const autoIntervalMs = Math.max(0, Number(params.get('interval_ms') || 0));
    const requestedBackend = 'WebGPU';
    const requestedRoute = 'native64-causal-cue-feedback-operator-v0';
    const initialStateContract = Object.freeze({
      identity: 'causal-initial-state-reset-96-to-64-v0',
      intermediateControls: Object.freeze({ resolution: 96 }),
      targetControls: Object.freeze({ resolution: 64 }),
      resetSimStepCount: 0,
      preRollIdentity: 'causal-unforced-deterministic-preroll-v0',
      preRollSteps,
      firstCapturedSimulationStep: preRollSteps + 1,
      receiverDisabledDuringPreRoll: true,
    });
    const deterministicStepClock = Object.freeze({
      identity: 'causal-deterministic-step-clock-v0',
      stepIntervalMs: 1000 / 30,
      wallClockInferenceLatencyAffectsSimulationPhase: false,
    });
    const runtimeTruthAvailable = false;
    const syntheticDownsampleApplied = false;
    const receiverControls = Object.freeze({ oracleActivityCurlNoise: curlNoiseGain, oracleActivityVorticity: vorticityGain });
    const runner = document.getElementById('runner');
    const image = document.getElementById('causalNativeSource');
    const status = document.getElementById('status');
    const identity = document.getElementById('identity');
    const stepButton = document.getElementById('step');
    const autoButton = document.getElementById('auto');
    const roles = document.getElementById('roles');
    let role = requestedRole;
    let latestFrame = null;
    let failurePhase = 'route-initialize';
    let lastTrustworthyEvidence = null;
    let stepping = false;
    let autoPlaying = false;
    let autoTimer = null;

    function runnerUrl() {
      const query = new URLSearchParams({
        causal_feedback_role: role,
        manual_source_grid: '64',
        causal_preroll_steps: String(preRollSteps),
        warmup_steps: String(warmupSteps),
        release_steps: String(releaseSteps),
        causal_curl_noise_gain: String(curlNoiseGain),
        causal_vorticity_gain: String(vorticityGain),
      });
      return `./volume-native-low-selective-live.html?${query}`;
    }

    function renderRoles() {
      roles.replaceChildren(...CAUSAL_ROLES.map(candidate => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = candidate;
        button.ariaPressed = String(candidate === role);
        button.addEventListener('click', () => {
          if (candidate === role) return;
          role = candidate;
          location.search = new URLSearchParams({ ...Object.fromEntries(params), role }).toString();
        });
        return button;
      }));
    }

    function childApi() {
      return runner.contentWindow?.__kaminosNativeLowSelectiveLive || null;
    }

    async function waitForChild() {
      const started = performance.now();
      while (performance.now() - started < 300000) {
        const api = childApi();
        const state = api?.debugState?.();
        if (api?.stepCausalFeedbackFrame && state?.status === 'paused') return api;
        if (state?.status === 'failed') throw new Error(`${state.failurePhase || 'child-route'}:child route failed`);
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      throw new Error('native64 causal child route did not activate');
    }

    async function stepFrame() {
      if (stepping) throw new Error('native64 causal step already in flight');
      stepping = true;
      stepButton.disabled = true;
      failurePhase = 'causal-frame-step';
      try {
        const api = await waitForChild();
        const frame = await api.stepCausalFeedbackFrame();
        if (!frame?.causalNativeSourceObjectUrl) throw new Error('causalNativeSourceObjectUrl missing');
        if (frame.runtimeTruthAvailable !== false || frame.syntheticDownsampleApplied !== false) {
          throw new Error('causal frame violated no-truth native-source contract');
        }
        image.src = frame.causalNativeSourceObjectUrl;
        latestFrame = frame;
        lastTrustworthyEvidence = frame;
        failurePhase = frame.failurePhase;
        const forcingPhase = frame.forcingPhase;
        status.textContent = `${role} | ${forcingPhase} | step ${frame.simulationStep} | ${Math.round(frame.endToEndFrameMs || 0)} ms`;
        identity.textContent = `applied=${frame.appliedCueFrameId || 'none'} | generated=${frame.generatedCueFrameId || 'none'} | next=${frame.generatedForNextSimulationStep ?? 'none'} | truth=false | synthetic=false`;
        return frame;
      } catch (error) {
        status.textContent = error?.message || String(error);
        status.style.color = '#ff9d8d';
        throw error;
      } finally {
        stepping = false;
        stepButton.disabled = false;
      }
    }

    function scheduleAuto() {
      clearTimeout(autoTimer);
      if (!autoPlaying) return;
      autoTimer = setTimeout(async () => {
        try {
          await stepFrame();
        } finally {
          scheduleAuto();
        }
      }, autoIntervalMs);
    }

    function setAutoPlaying(value) {
      autoPlaying = Boolean(value);
      autoButton.ariaPressed = String(autoPlaying);
      autoButton.textContent = autoPlaying ? 'Pause' : 'Play';
      scheduleAuto();
      return { ok: true, autoPlaying };
    }

    function debugState() {
      const effectiveBackend = latestFrame?.effectiveBackend || null;
      const effectiveRoute = latestFrame?.effectiveRoute || null;
      return {
        identity: 'native64-causal-cue-feedback-operator-v0',
        status: failurePhase ? (failurePhase === 'route-initialize' ? 'starting' : 'failed') : 'active',
        role,
        forcingPhase: latestFrame?.forcingPhase || 'unstarted',
        nativeGrid: 64,
        preRollSteps,
        firstCapturedSimulationStep: preRollSteps + 1,
        warmupSteps,
        releaseSteps,
        receiverControls,
        initialStateContract,
        deterministicStepClock,
        requestedBackend,
        effectiveBackend,
        requestedRoute,
        effectiveRoute,
        runtimeTruthAvailable,
        syntheticDownsampleApplied,
        latestFrame,
        failurePhase,
        lastTrustworthyEvidence,
      };
    }

    stepButton.addEventListener('click', () => stepFrame());
    autoButton.addEventListener('click', () => setAutoPlaying(!autoPlaying));
    renderRoles();
    runner.src = runnerUrl();
    waitForChild().then(() => {
      failurePhase = null;
      status.textContent = `${role} | native 64 | ${preRollSteps}-step unforced pre-roll complete | click Step or Play`;
      if (params.get('autoplay') === '1') setAutoPlaying(true);
    }).catch(error => {
      failurePhase = failurePhase || 'route-initialize';
      status.textContent = error?.message || String(error);
      status.style.color = '#ff9d8d';
    });
    window.__kaminosNative64CausalCueFeedback = { debugState, stepFrame, setAutoPlaying };
  </script>
</body>
</html>
