<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import {
  createMotionRoutePlanFromTerrainAffordance,
  decodeHillMotionAffordancePacket,
} from './motion-core.js';
import {
  MOTION_READY_719024_CAST_ID,
  MOTION_READY_719024_DEFORMATION_MODE,
  compileCreatureScaleLocomotionRail,
  applyCrawlerContactCarrierDeformation,
  applyCrawlerContactPatchDeformation,
  createAxialGeometryBinding,
  createAxialSquirmState,
  createAxialTerrainRouteTransitionEvaluator,
  createCrawlerContactKinematics,
  createCrawlerContactLocomotionState,
  deformAxialGeometryBinding,
  sampleCrawlerContactPatches,
  sampleHillTerrainSurface,
  sampleCreatureScaleLocomotionRail,
  solveAxialTerrainSupportEnvelope,
  stepAxialSquirmController,
  stepCrawlerContactLocomotion,
  validateAxialCrawlerRegistration,
  validateCrawlerContactAtlas,
  validateCrawlerContactCarriers,
} from './motion-ready-719024-core.js';

const routeParameters = new URLSearchParams(location.search);
const PATHS = Object.freeze({
  creature: routeParameters.get('creature_url') || './artifacts/motion-ready-719024/creature.glb',
  registration: routeParameters.get('registration_url') || './artifacts/motion-ready-719024/registration.json',
  contactAtlas: routeParameters.get('contact_atlas_url') || './artifacts/motion-ready-719024/contact-atlas.json',
  contactCarriers: routeParameters.get('contact_carriers_url') || './artifacts/motion-ready-719024/contact-carriers.json',
  receipt: './artifacts/motion-ready-719024/receipt.json',
  hillPacket: './artifacts/motion-ready-719024/hill/motion-affordance-packet.json',
  hillData: './artifacts/motion-ready-719024/hill/motion-affordance-data.json',
});
const EXPECTED = Object.freeze({
  castHash: '8fed20d958ef48797c14ad1d3846a50eae05d43e6ae67f8805060b02f1abde8e',
  registrationHash: 'cb519913ad863441e88555b3d9fbd588ffef03650475de07c29ee1c71f500ff6',
  contactAtlasHash: 'e3007a55f930d709ac8a7bf684ff32ad862e7d55186343220edb3e2ad3635b78',
  contactCarriersHash: '06d2402a3ae546a65adeff0e6e6f929c701e39f9cff6a494afaa74d7baa6bd3a',
  hillSourceRef: 'lerms:cc/hill-of-hills-live-terrain-server-0702@81c5348',
});
const TIMING = Object.freeze({ leadIn: 1.15, travel: 10.4, settle: 3.2 });
const consoleFailures = [];
window.addEventListener('error', event => consoleFailures.push(String(event.error?.stack || event.message || event.error || 'window error')));
window.addEventListener('unhandledrejection', event => consoleFailures.push(String(event.reason?.stack || event.reason || 'unhandled rejection')));

const viewport = document.getElementById('viewport');
const statusElement = document.getElementById('status');
const sourceRefElement = document.getElementById('source-ref');
const routeIdElement = document.getElementById('route-id');
const motionStateElement = document.getElementById('motion-state');
const progressElement = document.querySelector('#progress > div');
const pauseButton = document.getElementById('pause');
const trackInput = document.getElementById('track');
const contactCouplingInput = document.getElementById('contact-coupling');
const contactCouplingValue = document.getElementById('contact-coupling-value');
const requestedContactCoupling = THREE.MathUtils.clamp(Number(routeParameters.get('contact_coupling') ?? 1), 0, 1);
const requestedContactDeformation = routeParameters.get('contact_deformation') || 'carrier';
if (!['carrier', 'weighted'].includes(requestedContactDeformation)) {
  throw new Error('contact_deformation must be carrier or weighted');
}
contactCouplingInput.value = String(requestedContactCoupling);
contactCouplingValue.value = requestedContactCoupling.toFixed(2);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090b0d);
scene.fog = new THREE.FogExp2(0x090b0d, 0.025);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.02, 120);
camera.position.set(-4.2, 4.1, 5.8);
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
viewport.appendChild(renderer.domElement);
await renderer.init();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.2;
controls.maxDistance = 18;
controls.target.set(0, 0.5, 0);

scene.add(new THREE.HemisphereLight(0xd8e5cf, 0x28322e, 1.55));
const key = new THREE.DirectionalLight(0xffe1b2, 3.1);
key.position.set(-4, 9, 2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -9;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fc6be, 1.65);
rim.position.set(6, 4, -8);
scene.add(rim);

const state = {
  schema: 'kaminos.motion-ready-719024-live-state.v0',
  ok: false,
  loaded: false,
  paused: false,
  completed: false,
  startSeconds: performance.now() / 1000,
  elapsedSeconds: 0,
  routeProgress: 0,
  desiredRouteProgress: 0,
  routeSpeed: 0,
  previousDesiredDistance: 0,
  previousFrameSeconds: null,
  controller: createAxialSquirmState(),
  source: null,
  routePlan: null,
  locomotionRail: null,
  routeSample: null,
  terrainSupport: null,
  registration: null,
  contactAtlas: null,
  contactCarriers: null,
  contactDeformationMode: requestedContactDeformation,
  contactDeformationEvidence: null,
  contactKinematics: null,
  contactSamples: null,
  contactLocomotion: null,
  contactPhase: 0,
  contactCoupling: requestedContactCoupling,
  contactMarkers: new Map(),
  receipt: null,
  assetEvidence: null,
  creatureRoot: null,
  deformableMeshes: [],
  frameCount: 0,
  performance: {
    lastFrameMs: null,
    smoothedFps: 0,
    lastDeformationMs: 0,
    maxDeformationMs: 0,
  },
};

function setStatus(message, error = false) {
  statusElement.textContent = message;
  statusElement.classList.toggle('error', error);
}

function hillChannelValue(source, name, index, component = 0, fallback = 0) {
  const channel = source?.channels?.[name];
  const stride = Math.max(1, Number(channel?.componentCount) || 1);
  const value = Number(channel?.values?.[index * stride + component]);
  return Number.isFinite(value) ? value : fallback;
}

function hillWorldFromGrid(source, column, row, height = 0) {
  const columns = Math.max(1, source.grid.columns);
  const rows = Math.max(1, source.grid.rows);
  const tx = columns <= 1 ? 0 : column / (columns - 1);
  const tz = rows <= 1 ? 0 : row / (rows - 1);
  return [
    THREE.MathUtils.lerp(source.worldBounds.x.min, source.worldBounds.x.max, tx),
    height,
    THREE.MathUtils.lerp(source.worldBounds.z.min, source.worldBounds.z.max, tz),
  ];
}

function terrainColor(color, source, index) {
  const materialClass = Math.round(hillChannelValue(source, 'materialClass', index));
  const regionClass = Math.round(hillChannelValue(source, 'regionClass', index));
  const growth = THREE.MathUtils.clamp(hillChannelValue(source, 'growthPotential', index), 0, 1);
  const wetness = THREE.MathUtils.clamp(hillChannelValue(source, 'wetness', index), 0, 1);
  const ridge = THREE.MathUtils.clamp(hillChannelValue(source, 'ridgeStrength', index), 0, 1);
  const palette = [0x5f8e55, 0x7ca865, 0x9a9d63, 0x667f65, 0xa18c5b, 0x557d73, 0x809b55, 0x6e8462];
  color.setHex(palette[Math.abs(materialClass + regionClass * 3) % palette.length]);
  const hsl = {};
  color.getHSL(hsl);
  color.setHSL(
    (hsl.h + wetness * 0.035 - ridge * 0.018 + 1) % 1,
    THREE.MathUtils.clamp(hsl.s + growth * 0.18, 0.28, 0.72),
    THREE.MathUtils.clamp(hsl.l + growth * 0.08 - wetness * 0.06, 0.2, 0.52),
  );
  return color;
}

function createTerrain(source) {
  const columns = source.grid.columns;
  const rows = source.grid.rows;
  const positions = new Float32Array(columns * rows * 3);
  const colors = new Float32Array(columns * rows * 3);
  const indices = new Uint32Array((columns - 1) * (rows - 1) * 6);
  const color = new THREE.Color();
  for (let row = 0; row < rows; row++) {
    for (let column = 0; column < columns; column++) {
      const index = row * columns + column;
      const world = hillWorldFromGrid(source, column, row, hillChannelValue(source, 'height', index));
      positions.set(world, index * 3);
      terrainColor(color, source, index);
      colors.set([color.r, color.g, color.b], index * 3);
    }
  }
  let cursor = 0;
  for (let row = 0; row < rows - 1; row++) {
    for (let column = 0; column < columns - 1; column++) {
      const a = row * columns + column;
      const b = a + 1;
      const c = a + columns;
      const d = c + 1;
      indices.set([a, c, b, b, c, d], cursor);
      cursor += 6;
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setIndex(new THREE.BufferAttribute(indices, 1));
  geometry.computeVertexNormals();
  const material = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.91,
    metalness: 0,
    side: THREE.DoubleSide,
  });
  const terrain = new THREE.Mesh(geometry, material);
  terrain.name = 'motion-ready-719024-hill-support';
  terrain.receiveShadow = true;
  terrain.userData = {
    schema: 'kaminos.motion-ready-719024.hill-support.v0',
    sourceRef: source.sourceRef,
    authority: source.authority,
    checksums: source.checksums,
  };
  scene.add(terrain);
  return terrain;
}

function createRouteLine(points) {
  const geometry = new THREE.BufferGeometry().setFromPoints(points.map(point => new THREE.Vector3(...point).add(new THREE.Vector3(0, 0.025, 0))));
  const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0xf1d27a, transparent: true, opacity: 0.58, depthTest: true }));
  line.name = 'motion-ready-719024-hill-route';
  scene.add(line);
}

function prepareCreature(gltf, registration) {
  const root = gltf.scene;
  root.name = 'motion-ready-719024-creature';
  root.traverse(child => {
    if (!child.isMesh || !child.geometry?.attributes?.position) return;
    child.geometry = child.geometry.clone();
    const position = child.geometry.attributes.position;
    const original = new Float32Array(position.array.length);
    original.set(position.array);
    const normal = child.geometry.attributes.normal;
    if (!normal) throw new Error('deformable mesh requires vertex normals');
    const originalNormals = new Float32Array(normal.array.length);
    originalNormals.set(normal.array);
    child.userData.axialBinding = createAxialGeometryBinding(
      original,
      originalNormals,
      registration,
      { segments: 128 },
    );
    if (child.userData.axialBinding.vertexCount !== state.contactAtlas.vertexCount) {
      throw new Error('contact atlas vertex count does not match effective creature geometry');
    }
    child.geometry.computeBoundingSphere();
    child.geometry.boundingSphere.radius *= 1.35;
    child.castShadow = true;
    child.receiveShadow = true;
    if (child.material) {
      child.material = child.material.clone();
      child.material.envMapIntensity = 0.7;
      child.material.roughness = Math.max(0.52, Number(child.material.roughness) || 0.52);
    }
    state.deformableMeshes.push(child);
  });
  if (state.deformableMeshes.length !== 1) throw new Error(`expected one deformable mesh, found ${state.deformableMeshes.length}`);
  root.scale.setScalar(1.14);
  root.userData = {
    schema: 'kaminos.motion-ready-719024.creature-instance.v0',
    castId: MOTION_READY_719024_CAST_ID,
    castHash: EXPECTED.castHash,
    registrationHash: EXPECTED.registrationHash,
    deformationMode: MOTION_READY_719024_DEFORMATION_MODE,
  };
  scene.add(root);
  state.creatureRoot = root;
  return root;
}

function applyCreatureDeformation() {
  const started = performance.now();
  for (const mesh of state.deformableMeshes) {
    const position = mesh.geometry.attributes.position;
    const normal = mesh.geometry.attributes.normal;
    deformAxialGeometryBinding(
      mesh.userData.axialBinding,
      state.controller,
      position.array,
      normal.array,
    );
    state.contactDeformationEvidence = state.contactDeformationMode === 'carrier'
      ? applyCrawlerContactCarrierDeformation(
        state.contactAtlas,
        state.contactCarriers,
        state.contactKinematics,
        position.array,
      )
      : applyCrawlerContactPatchDeformation(
        state.contactAtlas,
        state.contactKinematics,
        position.array,
      );
    position.needsUpdate = true;
    normal.needsUpdate = true;
  }
  state.performance.lastDeformationMs = performance.now() - started;
  state.performance.maxDeformationMs = Math.max(
    state.performance.maxDeformationMs,
    state.performance.lastDeformationMs,
  );
}

function createContactMarkers() {
  const geometry = new THREE.SphereGeometry(0.027, 12, 8);
  for (const patch of state.contactAtlas.patches) {
    const marker = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0x71b9e6 }));
    marker.name = `motion-ready-719024-contact-${patch.id}`;
    marker.renderOrder = 3;
    scene.add(marker);
    state.contactMarkers.set(patch.id, marker);
  }
}

function updateContactMarkers() {
  for (const patch of state.contactLocomotion?.patches || []) {
    const marker = state.contactMarkers.get(patch.id);
    const sample = state.contactSamples?.patches.find(candidate => candidate.id === patch.id);
    if (!marker || !sample) continue;
    marker.position.fromArray(sample.worldPosition);
    marker.material.color.setHex(patch.state === 'stance' ? 0x73d28d : patch.state === 'release' ? 0xf0bd62 : 0x6db7e7);
  }
}

function smoothProgress(linear) {
  const t = THREE.MathUtils.clamp(linear, 0, 1);
  return t * t * (3 - 2 * t);
}

function resetPlayback() {
  state.startSeconds = performance.now() / 1000;
  state.elapsedSeconds = 0;
  state.routeProgress = 0;
  state.desiredRouteProgress = 0;
  state.routeSpeed = 0;
  state.previousDesiredDistance = 0;
  state.previousFrameSeconds = null;
  state.controller = createAxialSquirmState();
  state.contactKinematics = createCrawlerContactKinematics(state.contactAtlas, 0, {
    coupling: state.contactCoupling,
    scale: state.creatureRoot?.scale.y || 1.14,
  });
  state.contactSamples = null;
  state.contactLocomotion = createCrawlerContactLocomotionState(state.contactAtlas);
  state.contactPhase = 0;
  state.completed = false;
  state.paused = false;
  pauseButton.textContent = 'Pause';
  setStatus('Playing exact cast on source-owned Hill route');
}

function updateActor(nowSeconds) {
  if (!state.loaded || state.paused) return;
  const elapsed = Math.max(0, nowSeconds - state.startSeconds);
  state.elapsedSeconds = elapsed;
  const previousFrame = state.previousFrameSeconds ?? nowSeconds;
  const deltaSeconds = THREE.MathUtils.clamp(nowSeconds - previousFrame, 0, 0.05);
  state.previousFrameSeconds = nowSeconds;
  const travelLinear = (elapsed - TIMING.leadIn) / TIMING.travel;
  const desiredProgress = smoothProgress(travelLinear);
  const desiredDistance = state.locomotionRail.length * desiredProgress;
  const desiredSpeed = deltaSeconds > 1e-5
    ? Math.max(0, (desiredDistance - state.previousDesiredDistance) / deltaSeconds)
    : 0;
  state.previousDesiredDistance = desiredDistance;
  const priorDistance = state.contactLocomotion.routeDistance;
  if (state.contactSamples && deltaSeconds > 0) {
    state.contactLocomotion = stepCrawlerContactLocomotion(state.contactLocomotion, {
      deltaSeconds,
      desiredDistance,
      desiredSpeed,
      railLength: state.locomotionRail.length,
      locomotorPhase: state.contactPhase,
      locomotionFrame: state.routeSample?.locomotionFrame || { forward: [0, 0, -1], right: [1, 0, 0], up: [0, 1, 0] },
      contactSamples: state.contactSamples,
      scale: state.creatureRoot.scale.y,
      coupling: state.contactCoupling,
    });
  }
  const sample = sampleCreatureScaleLocomotionRail(
    state.locomotionRail,
    state.contactLocomotion.routeDistance,
  );
  const routePosition = new THREE.Vector3(...sample.position);
  const routeSpeed = deltaSeconds > 1e-5
    ? Math.max(0, (state.contactLocomotion.routeDistance - priorDistance) / deltaSeconds)
    : 0;
  state.routeProgress = sample.progress;
  state.desiredRouteProgress = desiredProgress;
  state.routeSpeed = routeSpeed;
  state.routeSample = sample;
  const horizontalForward = new THREE.Vector3(sample.tangent[0], 0, sample.tangent[2]).normalize();
  const terrainSurface = sampleHillTerrainSurface(state.source, routePosition.x, routePosition.z);
  state.terrainSupport = sample.support;
  state.controller = stepAxialSquirmController(state.controller, {
    deltaSeconds,
    routeSpeed,
    routeDistance: sample.sourceDistance,
    terrainSupport: state.terrainSupport,
    elapsedSeconds: elapsed,
  });

  state.creatureRoot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), horizontalForward);
  state.creatureRoot.position.set(
    routePosition.x,
    terrainSurface.height
      + state.controller.terrainSupportRootLift
      - state.registration.contactPlaneY * state.creatureRoot.scale.y,
    routePosition.z,
  );
  state.contactPhase = desiredDistance / 0.42 * Math.PI * 2;
  state.contactKinematics = createCrawlerContactKinematics(state.contactAtlas, state.contactPhase, {
    coupling: state.contactCoupling,
    scale: state.creatureRoot.scale.y,
    supportOffsets: new Map(state.contactLocomotion.patches.map(patch => [patch.id, patch.supportOffset])),
  });
  applyCreatureDeformation();
  const deformablePosition = state.deformableMeshes[0].geometry.attributes.position.array;
  state.contactSamples = sampleCrawlerContactPatches(
    state.contactAtlas,
    deformablePosition,
    state.source,
    {
      rootPosition: state.creatureRoot.position.toArray(),
      scale: state.creatureRoot.scale.y,
      locomotionFrame: sample.locomotionFrame,
    },
  );
  updateContactMarkers();

  if (trackInput.checked) {
    const target = state.creatureRoot.position.clone().add(new THREE.Vector3(0, 0.24, 0));
    const delta = target.clone().sub(controls.target);
    controls.target.lerp(target, 0.12);
    camera.position.addScaledVector(delta, 0.12);
  }
  progressElement.style.transform = `scaleX(${state.routeProgress})`;
  const supportStatus = state.terrainSupport.plannerDisposition === 'local-support'
    ? `support ${state.controller.terrainSupportRootLift.toFixed(3)}`
    : `reroute ${state.terrainSupport.compliance.maxEnvelopeLift.toFixed(3)}`;
  const contactStatus = `${state.contactLocomotion.patches.filter(patch => patch.state === 'stance').length} planted / traction ${state.contactLocomotion.traction.toFixed(2)}`;
  motionStateElement.textContent = `${state.routeProgress.toFixed(3)} / ${routeSpeed.toFixed(2)} u·s⁻¹ / ${contactStatus} / ${supportStatus}`;

  if (elapsed >= TIMING.leadIn + TIMING.travel + TIMING.settle && !state.completed) {
    state.completed = true;
    setStatus('Route complete / low-velocity settle held');
  }
}

async function loadJson(path) {
  const response = await fetch(path, { cache: 'no-store' });
  if (!response.ok) throw new Error(`${path} returned ${response.status}`);
  return response.json();
}

async function loadBytes(path) {
  const response = await fetch(path, { cache: 'no-store' });
  if (!response.ok) throw new Error(`${path} returned ${response.status}`);
  const bytes = await response.arrayBuffer();
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  const sha256 = [...new Uint8Array(digest)].map(value => value.toString(16).padStart(2, '0')).join('');
  return { path, bytes, byteLength: bytes.byteLength, sha256 };
}

async function loadJsonWithEvidence(path) {
  const evidence = await loadBytes(path);
  const value = JSON.parse(new TextDecoder().decode(evidence.bytes));
  return { ...evidence, value };
}

async function loadGltfWithEvidence(path) {
  const evidence = await loadBytes(path);
  const resourcePath = new URL('.', new URL(path, location.href)).href;
  const value = await new Promise((resolve, reject) => new GLTFLoader().parse(evidence.bytes, resourcePath, resolve, reject));
  return { ...evidence, value };
}

async function initialize() {
  const [registrationAsset, contactAtlasAsset, contactCarriersAsset, receipt, packet, data, creatureAsset] = await Promise.all([
    loadJsonWithEvidence(PATHS.registration),
    loadJsonWithEvidence(PATHS.contactAtlas),
    loadJsonWithEvidence(PATHS.contactCarriers),
    loadJson(PATHS.receipt),
    loadJson(PATHS.hillPacket),
    loadJson(PATHS.hillData),
    loadGltfWithEvidence(PATHS.creature),
  ]);
  if (receipt.castId !== MOTION_READY_719024_CAST_ID) throw new Error(`unexpected cast ${receipt.castId}`);
  if (receipt.files?.['creature.glb']?.sha256 !== EXPECTED.castHash) throw new Error('creature receipt hash mismatch');
  if (receipt.files?.['registration.json']?.sha256 !== EXPECTED.registrationHash) throw new Error('registration receipt hash mismatch');
  if (creatureAsset.sha256 !== EXPECTED.castHash) throw new Error(`creature effective-byte identity mismatch: ${creatureAsset.sha256}`);
  if (registrationAsset.sha256 !== EXPECTED.registrationHash) throw new Error(`registration effective-byte identity mismatch: ${registrationAsset.sha256}`);
  if (contactAtlasAsset.sha256 !== EXPECTED.contactAtlasHash) throw new Error(`contact atlas effective-byte identity mismatch: ${contactAtlasAsset.sha256}`);
  if (contactCarriersAsset.sha256 !== EXPECTED.contactCarriersHash) throw new Error(`contact carriers effective-byte identity mismatch: ${contactCarriersAsset.sha256}`);
  state.registration = validateAxialCrawlerRegistration(registrationAsset.value);
  state.contactAtlas = validateCrawlerContactAtlas(contactAtlasAsset.value, {
    castId: MOTION_READY_719024_CAST_ID,
    castHash: EXPECTED.castHash,
    registrationHash: EXPECTED.registrationHash,
    vertexCount: receipt.mesh.vertices,
  });
  state.contactCarriers = validateCrawlerContactCarriers(contactCarriersAsset.value, {
    castId: MOTION_READY_719024_CAST_ID,
    castHash: EXPECTED.castHash,
    registrationHash: EXPECTED.registrationHash,
    atlasHash: EXPECTED.contactAtlasHash,
    vertexCount: receipt.mesh.vertices,
  });
  state.receipt = receipt;
  state.assetEvidence = {
    creature: { path: creatureAsset.path, byteLength: creatureAsset.byteLength, sha256: creatureAsset.sha256 },
    registration: { path: registrationAsset.path, byteLength: registrationAsset.byteLength, sha256: registrationAsset.sha256 },
    contactAtlas: { path: contactAtlasAsset.path, byteLength: contactAtlasAsset.byteLength, sha256: contactAtlasAsset.sha256 },
    contactCarriers: { path: contactCarriersAsset.path, byteLength: contactCarriersAsset.byteLength, sha256: contactCarriersAsset.sha256 },
  };
  state.source = decodeHillMotionAffordancePacket({ packet, data });
  if (state.source.sourceRef !== EXPECTED.hillSourceRef) throw new Error(`unexpected Hill source ${state.source.sourceRef}`);

  const strictRouteFixture = {
    schema: 'kaminos.motion-ready-719024.strict-route-fixture.v0',
    basis: 'measured-connected-full-body-support-corridor',
    requested: { start: { column: 110, row: 50 }, goal: { column: 110, row: 141 } },
  };
  const fixtureWorld = ({ column, row }) => hillWorldFromGrid(
    state.source,
    column,
    row,
    hillChannelValue(state.source, 'height', row * state.source.grid.columns + column),
  );
  const start = fixtureWorld(strictRouteFixture.requested.start);
  const goal = fixtureWorld(strictRouteFixture.requested.goal);
  const supportPolicy = {
    scale: 1.14,
    clearance: 0.018,
    lateralExcursion: 0.1,
    maxPitchRadians: Math.PI / 5,
    maxBendRadiansPerStation: Math.PI / 10,
    maxSuspensionLift: 0.114,
  };
  const transitionEvaluator = createAxialTerrainRouteTransitionEvaluator(
    state.source,
    state.registration,
    supportPolicy,
  );
  state.routePlan = createMotionRoutePlanFromTerrainAffordance(state.source, {
    id: 'motion-ready-719024-strict-hill-route',
    start,
    goal,
    costProfile: 'ridge-runner',
    transitionEvaluator,
    headingTurnWeight: 0.3,
  });
  state.locomotionRail = compileCreatureScaleLocomotionRail(
    state.source,
    state.registration,
    state.routePlan,
    {
      id: 'motion-ready-719024-creature-scale-rail',
      ...supportPolicy,
      sampleSpacing: 0.07,
      transitionEvaluator,
    },
  );
  state.routePlan.fixture = strictRouteFixture;
  createTerrain(state.source);
  createRouteLine(state.locomotionRail.samples.map(sample => sample.position));
  prepareCreature(creatureAsset.value, state.registration);
  createContactMarkers();

  const startSample = sampleCreatureScaleLocomotionRail(state.locomotionRail, 0);
  const startPosition = new THREE.Vector3(...startSample.position);
  state.creatureRoot.position.set(startPosition.x, startPosition.y - state.registration.contactPlaneY * state.creatureRoot.scale.y, startPosition.z);
  controls.target.copy(state.creatureRoot.position).add(new THREE.Vector3(0, 0.25, 0));
  camera.position.copy(controls.target).add(new THREE.Vector3(-3.2, 2.55, 4.2));
  controls.update();

  sourceRefElement.textContent = state.source.sourceRef;
  routeIdElement.textContent = `${state.locomotionRail.id} / ${state.locomotionRail.samples.length} admitted samples`;
  state.loaded = true;
  state.ok = true;
  resetPlayback();
}

document.getElementById('replay').addEventListener('click', resetPlayback);
pauseButton.addEventListener('click', () => {
  state.paused = !state.paused;
  pauseButton.textContent = state.paused ? 'Resume' : 'Pause';
  if (!state.paused) {
    state.startSeconds = performance.now() / 1000 - state.elapsedSeconds;
    state.previousFrameSeconds = null;
  }
});
contactCouplingInput.addEventListener('input', () => {
  state.contactCoupling = THREE.MathUtils.clamp(Number(contactCouplingInput.value), 0, 1);
  contactCouplingValue.value = state.contactCoupling.toFixed(2);
  if (state.loaded) resetPlayback();
});

window.kaminosMotionReady719024DebugState = () => ({
  schema: 'kaminos.motion-ready-719024.debug-state.v0',
  ok: state.ok && consoleFailures.length === 0,
  loaded: state.loaded,
  paused: state.paused,
  completed: state.completed,
  frameCount: state.frameCount,
  requested: {
    castId: MOTION_READY_719024_CAST_ID,
    castPath: PATHS.creature,
    registrationPath: PATHS.registration,
    contactAtlasPath: PATHS.contactAtlas,
    contactCarriersPath: PATHS.contactCarriers,
    contactDeformationMode: requestedContactDeformation,
    contactCoupling: requestedContactCoupling,
    hillPacketPath: PATHS.hillPacket,
    hillDataPath: PATHS.hillData,
  },
  effective: {
    castId: state.receipt?.castId || null,
    castHash: state.assetEvidence?.creature?.sha256 || null,
    registrationHash: state.assetEvidence?.registration?.sha256 || null,
    contactAtlasHash: state.assetEvidence?.contactAtlas?.sha256 || null,
    contactAtlasSchema: state.contactAtlas?.schema || null,
    contactAtlasAuthority: state.contactAtlas?.authority || null,
    contactPatchIds: state.contactAtlas?.patches?.map(patch => patch.id) || [],
    contactCarriersHash: state.assetEvidence?.contactCarriers?.sha256 || null,
    contactCarriersSchema: state.contactCarriers?.schema || null,
    contactCarriersAuthority: state.contactCarriers?.authority || null,
    contactDeformationMode: state.contactDeformationMode,
    assetEvidence: state.assetEvidence,
    deformationMode: MOTION_READY_719024_DEFORMATION_MODE,
    hillSourceRef: state.source?.sourceRef || null,
    hillAuthority: state.source?.authority || null,
    hillIdentityProjection: state.source?.identityProjection || null,
    hillChecksums: state.source?.checksums || null,
    routePlanId: state.routePlan?.id || null,
    routeProfile: state.routePlan?.cost?.profile?.id || null,
    routePointCount: state.routePlan?.routePoints?.length || 0,
    dynamicContinuity: state.routePlan?.evidence?.dynamicContinuity || null,
    transitionAdmission: state.routePlan?.evidence?.transitionAdmission || null,
    strictRouteFixture: state.routePlan?.fixture || null,
    locomotionRailId: state.locomotionRail?.id || null,
    locomotionRailSchema: state.locomotionRail?.schema || null,
    locomotionRailAuthority: state.locomotionRail?.authority || null,
    locomotionRailLength: state.locomotionRail?.length || null,
    locomotionRailSampleCount: state.locomotionRail?.samples?.length || 0,
    locomotionRailContinuity: state.locomotionRail?.continuity || null,
    locomotionRailEvidence: state.locomotionRail?.evidence || null,
  },
  motion: {
    elapsedSeconds: state.elapsedSeconds,
    routeProgress: state.routeProgress,
    desiredRouteProgress: state.desiredRouteProgress,
    routeSpeed: state.routeSpeed,
    routeSample: state.routeSample,
    controller: { ...state.controller },
    terrainSupport: state.terrainSupport,
    contactCoupling: state.contactCoupling,
    contactPhase: state.contactPhase,
    contactKinematics: state.contactKinematics,
    contactSamples: state.contactSamples,
    contactLocomotion: state.contactLocomotion,
    contactDeformation: state.contactDeformationEvidence,
    root: state.creatureRoot ? state.creatureRoot.position.toArray() : null,
  },
  performance: { ...state.performance },
  consoleFailures: [...consoleFailures],
});

window.kaminosMotionReady719024PrepareDeterministicCapture = () => {
  resetPlayback();
  state.paused = true;
  pauseButton.textContent = 'Resume';
  return window.kaminosMotionReady719024DebugState();
};

window.kaminosMotionReady719024AdvanceToElapsed = targetSecondsInput => {
  const targetSeconds = Math.max(0, Number(targetSecondsInput) || 0);
  if (targetSeconds + 1e-6 < state.elapsedSeconds) {
    window.kaminosMotionReady719024PrepareDeterministicCapture();
  }
  const stepSeconds = 1 / 60;
  while (state.elapsedSeconds + 1e-6 < targetSeconds) {
    const nextElapsed = Math.min(targetSeconds, state.elapsedSeconds + stepSeconds);
    state.paused = false;
    updateActor(state.startSeconds + nextElapsed);
  }
  state.paused = true;
  pauseButton.textContent = 'Resume';
  return window.kaminosMotionReady719024DebugState();
};

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

try {
  await initialize();
} catch (error) {
  state.ok = false;
  consoleFailures.push(String(error?.stack || error));
  setStatus(`Witness failed: ${error?.message || error}`, true);
  console.error(error);
}

function animate(nowMs) {
  requestAnimationFrame(animate);
  if (state.performance.lastFrameMs != null) {
    const frameSeconds = Math.max(1e-4, (nowMs - state.performance.lastFrameMs) / 1000);
    const instantFps = 1 / frameSeconds;
    state.performance.smoothedFps = state.performance.smoothedFps > 0
      ? state.performance.smoothedFps * 0.9 + instantFps * 0.1
      : instantFps;
  }
  state.performance.lastFrameMs = nowMs;
  state.frameCount++;
  updateActor(nowMs / 1000);
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
